# gitleaks configuration — see https://github.com/gitleaks/gitleaks
# Extends the built-in ruleset; only adds project-specific allowlisting.

[extend]
useDefault = true

[allowlist]
description = """
Framework examples read credentials from local *_api_key.dat files. These files
are excluded by .gitignore and any keys that ever landed in them have been
rotated, so findings in those paths are not actionable. Real secrets elsewhere
are still reported.
"""
paths = [
  '''.*_api_key\.dat$''',
  # core/release/cov_scan.{in,sh} carried a hardcoded Coverity Scan upload token
  # from 2019-08-11 until it was removed in 2026-08. This entry suppresses the 17
  # historical findings across the 140 commits that touched those paths; removing
  # it from the tree did not un-publish seven years of history, and the token has
  # since been rotated.
  #
  # cov_scan.in stays deleted. cov_scan.sh, however, EXISTS AT HEAD again -- it
  # was restored as a working script that reads its token from outside the repo.
  # This path entry therefore does hide a future secret pasted into it, which is
  # why .gitleaks-head.toml + the release-scripts-head job in secret-scan.yml
  # scan that file at HEAD with no exemption. Do not rely on this config alone to
  # protect core/release/cov_scan.sh.
  '''^core/release/cov_scan\.(in|sh)$''',
]

# Documentation placeholders, allowlisted by REGEX rather than by path or commit.
#
# core/compiler/lib_src/cipher.obs uses a 32-character literal in the AES-256
# examples in its doc comments, which generic-api-key reads as a key. It is a
# placeholder: "mysecretkey" padded with digits to the 32 bytes AES-256 takes.
#
# Regex, and deliberately not a path: a paths entry for cipher.obs would also
# hide a real key committed there tomorrow, which is the argument this file
# already makes about job-search below. Not a commit entry either -- that can
# only suppress one SHA, and these findings return whenever anything rewrites
# those lines.
#
# They returned exactly that way once already. gitleaks-action scans only a pull
# request's new commit range, so renormalizing line endings rewrote every line
# of the file and two long-standing doc lines were presented as added and
# scanned as new. The content was unchanged -- verified byte-exactly, the old
# blob with CRLF->LF applied equals the new one. Any future whole-file rewrite
# will resurface every pre-existing finding in the files it touches.
#
# This entry suppresses that one literal anywhere it appears and leaves every
# other line of cipher.obs watched.
#
# The two SHA-1 digests below are published test vectors, not secrets:
# a9993e36...d89d is SHA1("abc") and da39a3ee...0709 is SHA1(""), both from
# RFC 3174. programs/tests/test_mbedtls_migration.obs asserts against them, so
# generic-api-key -- which matches on shape, a long hex-looking literal -- fires
# five times across the commits that added and moved that file.
#
# By REGEX rather than by commit or path, because these constants are the same
# everywhere and will be re-attributed to a new SHA by any future line-ending
# normalization or file move, exactly as cipher.obs was above. A path entry for
# the test file would also hide a real key pasted into it tomorrow.
regexes = [
  '''mysecretkey123456789012345678901''',
  '''a9993e364706816aba3e25717850c26c9cd0d89d''',
  '''da39a3ee5e6b4b0d3255bfef95601890afd80709''',
]

# The seventeen historical commits behind the 326 findings a FULL-HISTORY scan
# reports. Every one was reviewed; none is a live credential.
#
# Allowlisted by COMMIT, deliberately, and not by path. A path entry for
# programs/examples/job-search would also hide a real key committed there
# tomorrow -- and test-1.mhtml is still tracked at HEAD. A commit entry can only
# ever suppress findings attributed to that exact SHA, so every one of these
# paths stays watched for all future commits, on pushes, pull requests and the
# weekly scan alike.
#
# Why this list exists at all: gitleaks-action scans only the new commit range
# on push and pull_request, but a SCHEDULED run has no range and walks all
# ~30,600 commits. So secret-scan.yml passed on every push and failed every
# Monday on the same historical findings -- a job that is always red is a job
# nobody reads, and finding 327 would have arrived unnoticed. This is the same
# hazard the release-scripts-head job in secret-scan.yml was already scoped to
# avoid.
commits = [
  # 286 findings: one saved LinkedIn page kept as a parser fixture, re-added
  # across three commits, plus a saved results page. The linkedin-client-id and
  # linkedin-client-secret rules are matching the captured page's own markup.
  "829384f0ac8a56c246c0a8a4c0ce112753d14224",  # programs/examples/job-search/data/test-1.mhtml
  "080e1d5872f2fa785438b5e61c3db400342b1d7d",  # same fixture, re-added
  "7c95011b2d07feaa69e7fb0b5d53397c71da8015",  # same fixture, re-added
  "da53467370350a39e377a85b301eb71393df7bd2",  # programs/examples/job-search/out-2.html

  # 36 findings: a single saved web page, "Example  Scanning for HREFs.htm",
  # which moved between three directories over the years. generic-api-key is
  # firing on high-entropy strings in the captured HTML.
  "fc86a3f6bd6755acf7084bd87ea4e1a0aaf30c32",  # src/compiler/test_src/web/
  "71fd45cf5dee3cf306b36f265fb847da1b3c90ed",  # src/compiler/test_src/web/
  "478d3af82d6bfefbb23d00a008ec7b95d53d2bb8",  # src/compiler/test_src/web/
  "20a968f05bde73a4da0393ce9802b2b9dc2787ac",  # programs/web/
  "27a772e1f8c9a393118faa5d308746d3c30293d7",  # programs/web/
  "97c6f7fc37a63a65a819b2c7428da947f188cd5b",  # programs/web/
  "b9658df6bcbeb755eb9eaeb2b9299207372859d5",  # programs/web/old/
  "0a6d8da28ce802a2ead1b3d1ef19bbe0a8d27f58",  # programs/web/old/
  "0bb3d3d3d1534c539eb05efbebd7ded4314492b9",  # programs/web/old/

  # 3 findings: a self-signed demo keypair added as "ssl server support",
  # alongside its cert.pem, for the example TLS server. Deleted later and NOT
  # present at HEAD. A demo key published in 2014 protects nothing.
  "8c335e52fde075b1a0baf81a929b499d8b07d888",  # programs/web/key.pem
  "826ee589a7d97f38aacabda889ff1d885a603392",  # programs/web/key.pem
  "20f8157681a38575533dac5cccf8c7a1944c5971",  # programs/web/key.pem

  # 1 finding: an actions/cache step for the InsightFace SCRFD model whose YAML
  # field is literally named 'key:', which generic-api-key matched. A cache key,
  # not a credential.
  "bdf9408e2818d201c6101a38744869564316eb29",  # .github/workflows/ci-build.yml

  # 3 findings: a REAL Google API key, hardcoded into a generativelanguage
  # googleapis.com URL in programs/frameworks/gemini/test_0.obs and committed
  # 2024-03-29. It is the one true positive this allowlist has ever recorded.
  # The file was deleted later (a5456a6a73) and nothing AIza-shaped exists at
  # HEAD, but deletion does not remove it from a public history -- so the key
  # was ROTATED on 2026-09-21, which is what actually closed the exposure.
  #
  # Allowlisted only after rotation, and by commit so that a new AIza key
  # committed tomorrow still fires. Left unlisted the scan is red every Monday
  # on a dead credential, and a job that is always red is a job nobody reads --
  # which is how the next real finding would be missed.
  "0f112a09706183939220b26403414786d5a84009",
  "0733eff9aa8e30bee3f802c3dd7ed0c5cc30b5f8",
  "1b0a4ff5d5468650d866442ee4a2d76b031de02a",
]
