# Library alias groups for the compiler's '-lib' option.
#
# An entry beginning with '@' is expanded to the .obl list under the matching
# section (see Linker::Load in core/compiler/linker.cpp).
#
# NOTE: '#' is the only comment character ParseIni understands -- a ';' line is
# read as a library name and fails with "Unable to read library".
#
# A group must be CLOSED UNDER DEPENDENCIES. The linker loads exactly what is
# listed and does not chase a member's own dependencies, so if a member was
# built against another .obl that .obl must be listed here too. Otherwise every
# compile using the alias dies while loading the library -- even a program that
# never references it. A library's dependencies are the '-lib' list it is built
# with in core/compiler/update_version.sh.
#
# lang.obl and gen_collect.obl are always supplied by the compiler
# (compiler.cpp:281) and filtered out of any user '-lib' (compiler.cpp:314), so
# they never need listing.
#
# Libraries with no dependencies of their own -- concurrent, diags, lame, odbc
# -- are deliberately not grouped: an alias would save nothing over naming them
# directly.

