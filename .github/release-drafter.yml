# This draft accumulates merged PRs and is never published: release-publish.yml
# writes its own notes and runs `gh release create`. It must therefore not claim
# a version, and it cannot compute one anyway -- the resolver below is semver,
# while Objeck versions are YEAR.MONTH.RELEASE, so from v2026.9.7 it proposed
# v2026.9.8 when the next release was v2026.10.0 because the month rolled. That
# would be wrong at every month boundary.
name-template: 'Unreleased changes (since $PREVIOUS_TAG)'
tag-template: 'unreleased-draft'

categories:
  - title: '🚀 Features'
    labels:
      - 'feature'
      - 'enhancement'
    collapse-after: 5

  - title: '🐛 Bug Fixes'
    labels:
      - 'fix'
      - 'bugfix'
      - 'bug'
    collapse-after: 5

  - title: '⚡ Performance'
    labels:
      - 'performance'
      - 'optimization'
      - 'jit'
    collapse-after: 3

  - title: '🏗️ ARM64 / Platform Support'
    labels:
      - 'arm64'
      - 'platform'
      - 'windows'
      - 'macos'
      - 'linux'
    collapse-after: 5

  - title: '📚 Documentation'
    labels:
      - 'documentation'
      - 'docs'
    collapse-after: 3

  - title: '🧪 Testing'
    labels:
      - 'test'
      - 'ci'
      - 'regression'
    collapse-after: 3

  - title: '🔧 Maintenance'
    labels:
      - 'chore'
      - 'dependencies'
      - 'refactor'
    collapse-after: 3

change-template: '- $TITLE (#$NUMBER) @$AUTHOR'
change-title-escapes: '\<*_&'

version-resolver:
  major:
    labels:
      - 'major'
      - 'breaking'
  minor:
    labels:
      - 'minor'
      - 'feature'
      - 'enhancement'
  patch:
    labels:
      - 'patch'
      - 'fix'
      - 'bugfix'
      - 'bug'
      - 'documentation'
      - 'chore'
  default: patch

template: |
  **This is a running draft of what has merged since $PREVIOUS_TAG, not a planned
  release.** It is never published; the notes for a release are generated at tag
  time. The version in the archive names below is whatever the semver resolver
  guessed and is illustrative only.

  ## What's Changed

  $CHANGES

  ## 🎯 Highlights

  <!-- Add key highlights here before release -->

  ## 📦 Downloads

  Choose the appropriate build for your platform:

  Every file below is in the **Assets** section at the bottom of this release.

  | Platform | Architecture | Installer | Archive |
  |----------|--------------|-----------|---------|
  | **Windows** | x64 | `objeck-windows-x64_$RESOLVED_VERSION.msi` | `objeck-windows-x64_$RESOLVED_VERSION.zip` |
  | **Windows** | ARM64 | `objeck-windows-arm64_$RESOLVED_VERSION.msi` | `objeck-windows-arm64_$RESOLVED_VERSION.zip` |
  | **macOS** | Apple Silicon | `objeck-macos-arm64_$RESOLVED_VERSION.pkg` | `objeck-macos-arm64_$RESOLVED_VERSION.zip` |
  | **Linux** | x64 | — | `objeck-linux-x64_$RESOLVED_VERSION.tgz` |
  | **Linux** | ARM64 | — | `objeck-linux-arm64_$RESOLVED_VERSION.tgz` |

  Also published: `objeck-lsp_$RESOLVED_VERSION.zip` (language server), `SHA256SUMS` and its Ed25519 signature `SHA256SUMS.minisig`.

  Verify a download against `SHA256SUMS` before installing. `obu verify <archive> SHA256SUMS`
  checks the signature first and refuses a manifest it cannot verify, so download
  `SHA256SUMS.minisig` beside it; the public key is in `core/release/objeck-release.pub`.

  ## 🔗 Links

  - 📖 [Full Documentation](https://www.objeck.org)
  - 🎓 [Getting Started Guide](https://github.com/objeck/objeck-lang#quick-start)
  - 💬 [Discussions](https://github.com/objeck/objeck-lang/discussions)
  - 🐛 [Report Issues](https://github.com/objeck/objeck-lang/issues)

  ## 📝 Installation

  ### Linux / macOS
  ```bash
  # Extract archive
  tar xzf objeck-*.tgz
  cd objeck-lang

  # Add to PATH
  export PATH=$PATH:$(pwd)/bin

  # Verify installation
  obc --version
  ```

  ### Windows
  ```cmd
  REM Extract ZIP to C:\objeck-lang

  REM Add to PATH
  set PATH=%PATH%;C:\objeck-lang\bin

  REM Verify installation
  obc --version
  ```

  ---

  **Full Changelog**: https://github.com/objeck/objeck-lang/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
