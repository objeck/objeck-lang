name: Probe gc sqlitem (do not merge)

on:
  push:
    branches: [ 'probe/gc-sqlitem' ]

permissions:
  contents: read
  actions: read

jobs:
  probe:
    name: Probe ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-arm64
            os: ubuntu-24.04-arm
          - platform: macos-arm64
            os: macos-15
          - platform: linux-x64
            os: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux runtime dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y libmbedtls-dev unixodbc-dev libsqliteodbc libreadline-dev
      - name: Install macOS runtime dependencies
        if: runner.os == 'macOS'
        timeout-minutes: 10
        run: |
          for pkg in unixodbc readline coreutils; do
            brew list --versions "$pkg" >/dev/null 2>&1 || brew install "$pkg"
          done
      - name: Download deploy tree
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID=$(cat probe/run_id)
          echo "ci run $RUN_ID"
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json headSha,headBranch --jq '.headBranch + " " + .headSha'
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -n objeck-${{ matrix.platform }} -D tree
          chmod +x tree/bin/* || true
          tree/bin/obr 2>&1 | head -3 || true
      - name: Loop
        timeout-minutes: 85
        run: |
          chmod +x probe/loop.sh
          echo "=== new test, no verifier"
          VERIFY=0 CFGS=nursery OPTS=s3 probe/loop.sh "$PWD/tree" 30 150 jit_cond_value_minor_gc || true
          echo "=== new test, verifier"
          VERIFY=1 CFGS=nursery OPTS=s3 probe/loop.sh "$PWD/tree" 30 150 jit_cond_value_minor_gc || true
          echo "=== nightly failures, verifier"
          VERIFY=1 OPTS=s3 probe/loop.sh "$PWD/tree" 40 150 query_catalog_concurrent query_index_differential exit_with_live_threads || true
