name: Windows legs (reusable)

# The Windows x64 and ARM64 legs of ci-build.yml, called once per platform:
#
#   windows:
#     uses: ./.github/workflows/ci-windows.yml
#     with: { platform: windows-x64 }          (and windows-arm64)
#
# They used to be two legs of ci-build.yml's `build` matrix, one job each, and ran the whole
# regression suite twice (default JIT threshold, then every method compiled) one test at a time
# on a four-core hosted runner: 42 to 56 minutes on x64 and an hour on ARM64. A job cannot hand
# a part of itself to other jobs, so the leg is split here, and a reusable workflow is what lets
# each platform have its own `needs` graph (a matrix leg cannot wait for only its own siblings):
#
#   build        compile the toolchain, build the libraries, stage the deploy tree as an artifact
#   lang-obl     the Windows-built lang.obl equals the Linux build (needs only msbuild; parallel)
#   regression   SHARDS jobs, each takes every SHARDS-th test (REGRESSION_SHARD, run_regression.cmd)
#                and runs its slice twice: default JIT threshold, then OBJECK_JIT_THRESHOLD=1
#   vm-flags     run_vm_flag_tests.py
#   checks       debugger, DAP, llm_eval, compiler robustness, obi/obr parity and the other
#                single-purpose checks, and the objeck-<platform> artifact the nightly consumes
#   result       the one job ci-build.yml's `CI Status` reads. It fails unless every job above
#                succeeded AND tools/cicd/check_windows_shards.py finds a counts file from every
#                shard in both passes, adding up to every test in programs/regression: a skipped,
#                cancelled or lost shard cannot pass silently.
#
# Same tests, same flags, same pass/fail rules as before; only where they run changed.

on:
  workflow_call:
    inputs:
      platform:
        description: 'windows-x64 or windows-arm64'
        type: string
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ARCH: ${{ inputs.platform == 'windows-arm64' && 'ARM64' || 'x64' }}
  DEPLOY_SCRIPT: ${{ inputs.platform == 'windows-arm64' && 'deploy_windows.cmd arm64' || 'deploy_windows.cmd x64' }}
  # The number of regression shards. Keep in step with the `shard` list and the job name of
  # the regression job below (the result job also checks that every shard in 0..SHARDS-1 reported).
  SHARDS: 6

jobs:
  # ============================================
  # Build the toolchain and stage the deploy tree
  # ============================================
  build:
    name: Compile
    # Windows x64 is a pinned windows-2025-vs2026, which ships VS2026 (toolset v145).
    # The .vcxproj files select $(DefaultPlatformToolset) rather than a
    # hard-coded toolset, so they resolve to v145 here and to v143 on a
    # VS2022 developer box; VS2026 ships only v145 (no v143), so pinning
    # either version in the projects breaks one environment or the other.
    # Explicit label rather than windows-latest/windows-2025 to avoid
    # future silent image migrations.
    #
    # windows-11-arm is a NATIVE ARM64 runner. This leg used to build on
    # the x64 image and cross-compile, which meant it could not execute a
    # single thing it produced -- the whole test suite, the debugger tests
    # and the DAP tests were skipped, so an ARM64-only miscompile had
    # nothing standing in its way. Native build + native execution closes
    # that. It ships VS2022 (toolset v143) rather than VS2026's v145; the
    # .vcxproj files select $(DefaultPlatformToolset), so they follow the
    # image either way.
    runs-on: ${{ inputs.platform == 'windows-arm64' && 'windows-11-arm' || 'windows-2025-vs2026' }}
    # Backstop so a hung step can never tie up a runner for the default 6 hours.
    timeout-minutes: 60
    defaults:
      run:
        shell: cmd
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # The libraries, built once from source by the `libs` job (libs.yml). Today they are
    # also committed and `libs` fails on any byte of difference, so this overwrites each
    # file with an identical one; it is what the deploy scripts will find once the
    # .obl are no longer tracked (docs/DESIGN_OBL_FROM_SOURCE.md).
    - name: Download libraries
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: libs
        path: core/lib/

    # ============================================
    # Dependency Installation
    # ============================================

    # Windows setup
    - name: Setup Visual Studio (Windows)
      uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

    - name: Setup MSVC Environment (Windows)
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      with:
        arch: ${{ env.ARCH }}

    - name: Install Windows dependencies
      shell: pwsh
      run: |
        # Install mbedtls and nghttp2 via vcpkg. The installs download tools and
        # sources from external CDNs that intermittently 504 (a transient ninja
        # download failed a whole leg on 2026-06-06), so retry before giving up.
        #
        # The backoff rides out an OUTAGE, not just a blip. The previous version
        # made 3 attempts 20s apart -- about a 40-second window -- and on
        # 2026-09-21 all three drew the same 504 fetching zlib for ARM64, inside
        # 27 seconds. That reddened master, auto-filed #950, and cost a
        # diagnosis, on a dependency fetch that had nothing to do with the code.
        #
        # 5 attempts at 15s, 45s, 2m and 4m spans about seven minutes. It costs
        # nothing on success, and windows-arm64 is a shipping target whose leg
        # already runs 26 minutes -- spending a few more to avoid a false red is
        # the right trade.
        function Install-VcpkgPackage([string]$pkg) {
          $delays = @(15, 45, 120, 240)
          $max = $delays.Count + 1
          for($i = 1; $i -le $max; $i++) {
            vcpkg install $pkg
            if($LASTEXITCODE -eq 0) {
              return
            }
            if($i -lt $max) {
              $wait = $delays[$i - 1]
              Write-Output "vcpkg install $pkg failed (attempt $i/$max); retrying in ${wait}s..."
              Start-Sleep -Seconds $wait
            }
          }
          # Name the likely cause. The failure that reaches here looks identical
          # to a bad token or a broken config, and it is almost never either.
          throw "vcpkg install $pkg failed after $max attempts over ~7 minutes. This is usually an upstream CDN outage fetching sources, not a configuration problem -- check the curl status codes above before changing anything."
        }
        Install-VcpkgPackage "mbedtls:${{ env.ARCH }}-windows"
        Install-VcpkgPackage "nghttp2:${{ env.ARCH }}-windows"

        # The committed ARM64 OpenCV modules are a MODULAR build: opencv_core4
        # imports z.dll, and opencv_imgcodecs4 imports jpeg62/libpng16/tiff/
        # libwebp*. None of those codec DLLs were ever committed beside them, so
        # libobjk_opencv.dll failed to load with error 126 -- present, correctly
        # built, and missing a dependency two levels down. x64 never showed this
        # because it downloads opencv_world, which links the codecs IN.
        if("${{ env.ARCH }}" -eq "ARM64") {
          Install-VcpkgPackage "zlib:${{ env.ARCH }}-windows"
          Install-VcpkgPackage "libjpeg-turbo:${{ env.ARCH }}-windows"
          Install-VcpkgPackage "libpng:${{ env.ARCH }}-windows"
          Install-VcpkgPackage "tiff:${{ env.ARCH }}-windows"
          Install-VcpkgPackage "libwebp:${{ env.ARCH }}-windows"
        }

        # Set include/lib paths for Visual Studio
        $vcpkgRoot = "C:\vcpkg\installed\${{ env.ARCH }}-windows"
        echo "INCLUDE=$vcpkgRoot\include;$env:INCLUDE" >> $env:GITHUB_ENV
        echo "LIB=$vcpkgRoot\lib;$env:LIB" >> $env:GITHUB_ENV
        # Add vcpkg bin to PATH so nghttp2.dll is found at test runtime
        echo "$vcpkgRoot\bin" >> $env:GITHUB_PATH

        Write-Output "✅ Installed mbedtls and nghttp2 for ${{ env.ARCH }}"
        Write-Output "Set INCLUDE=$vcpkgRoot\include"
        Write-Output "Set LIB=$vcpkgRoot\lib"
        Write-Output "Added to PATH: $vcpkgRoot\bin"

    - name: Cache OpenCV DLLs (Windows x64)
      if: inputs.platform == 'windows-x64'
      id: opencv-cache
      # The cache is only an optimization — a transient cache-service error must
      # not fail the build. On a miss/error, cache-hit != 'true' and the download
      # step below fetches the DLLs anyway.
      continue-on-error: true
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: core/lib/opencv/win/x64/bin
        key: opencv-4.12.0-win-x64-dlls-licenses

    - name: Download OpenCV runtime DLLs (Windows x64)
      if: inputs.platform == 'windows-x64' && steps.opencv-cache.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $opencvVersion = "4.12.0"
        $binDir = "core\lib\opencv\win\x64\bin"
        New-Item -ItemType Directory -Force -Path $binDir | Out-Null

        $url = "https://github.com/opencv/opencv/releases/download/$opencvVersion/opencv-$opencvVersion-windows.exe"
        Write-Output "Downloading OpenCV $opencvVersion from $url ..."
        # same transient-CDN-failure class as the vcpkg installs: bounded retry
        $max = 3
        for($i = 1; $i -le $max; $i++) {
          try {
            Invoke-WebRequest -Uri $url -OutFile opencv-dl.exe
            break
          }
          catch {
            if($i -eq $max) { throw }
            Write-Output "OpenCV download failed (attempt $i/$max); retrying in 20s..."
            Start-Sleep -Seconds 20
          }
        }

        7z x opencv-dl.exe -oopencv-extract -y | Out-Null

        Copy-Item "opencv-extract\opencv\build\x64\vc16\bin\opencv_world4120.dll" $binDir
        Copy-Item "opencv-extract\opencv\build\x64\vc16\bin\opencv_videoio_ffmpeg4120_64.dll" $binDir

        # The package's license texts go beside the DLLs, inside the cache, so a
        # cache hit carries them too. deploy_windows.cmd ships them in
        # doc\licenses\opencv: OpenCV's LICENSE and etc\licenses, which covers what
        # opencv_world links in and the LGPL FFmpeg in opencv_videoio_ffmpeg.
        $licDir = "$binDir\licenses"
        New-Item -ItemType Directory -Force -Path $licDir | Out-Null
        $etc = Get-ChildItem opencv-extract -Recurse -Directory -Filter licenses | Where-Object { $_.FullName -match '\\etc\\licenses$' } | Select-Object -First 1
        if (-not $etc) { throw "The OpenCV package has no etc\licenses directory" }
        Copy-Item "$($etc.FullName)\*" $licDir
        $top = @("opencv-extract\opencv\LICENSE", "opencv-extract\opencv\build\LICENSE") | Where-Object { Test-Path $_ } | Select-Object -First 1
        if (-not $top) { throw "The OpenCV package has no LICENSE" }
        Copy-Item $top "$licDir\LICENSE"
        Get-ChildItem opencv-extract\opencv -Filter "LICENSE_FFMPEG*" | Copy-Item -Destination $licDir

        Remove-Item opencv-dl.exe -Force
        Remove-Item -Recurse opencv-extract -Force

        Write-Output "OpenCV DLLs installed:"
        Get-ChildItem $binDir

    # ============================================
    # ccache Setup
    # ============================================

    - name: Build toolchain
      working-directory: ./core/release
      env:
        CC: ${{ runner.os == 'Linux' && 'ccache gcc' || '' }}
        CXX: ${{ runner.os == 'Linux' && 'ccache g++' || '' }}
      run: ${{ env.DEPLOY_SCRIPT }}

    # TEMPORARY DIAGNOSTIC for #661. core_opencv and onnx_runtime_test fail on
    # windows-arm64 with error 126 -- the wrapper loads, one of its IMPORTS does
    # not. Three guesses have been wrong so far, all because the deploy log does
    # not echo per-file copies. This asks the runner directly instead.
    - name: Diagnose native library imports (windows-arm64)
      if: inputs.platform == 'windows-arm64'
      working-directory: ./core/release
      shell: cmd
      continue-on-error: true
      run: |
        echo ===== deploy-arm64\bin =====
        dir /b deploy-arm64\bin\*.dll
        echo ===== deploy-arm64\lib\native =====
        dir /b deploy-arm64\lib\native\*.dll
        echo ===== imports of libobjk_opencv.dll =====
        dumpbin /dependents deploy-arm64\lib\native\libobjk_opencv.dll
        echo ===== imports of libobjk_onnx.dll =====
        dumpbin /dependents deploy-arm64\lib\native\libobjk_onnx.dll
        echo ===== runtime presence =====
        if exist deploy-arm64\bin\msvcp140.dll (echo msvcp140 PRESENT) else (echo msvcp140 MISSING)
        if exist deploy-arm64\bin\vcruntime140.dll (echo vcruntime140 PRESENT) else (echo vcruntime140 MISSING)
        if exist deploy-arm64\bin\opencv_core4.dll (echo opencv_core4 PRESENT) else (echo opencv_core4 MISSING)
        if exist deploy-arm64\bin\onnxruntime.dll (echo onnxruntime PRESENT) else (echo onnxruntime MISSING)
        echo ===== what the opencv DLLs themselves import =====
        for %%d in (opencv_core4 opencv_imgproc4 opencv_imgcodecs4 opencv_highgui4 opencv_videoio4) do (
          echo --- %%d ---
          dumpbin /dependents deploy-arm64\bin\%%d.dll | findstr /i ".dll"
        )
        echo ===== onnx wrapper imports vs bin =====
        dumpbin /dependents deploy-arm64\bin\onnxruntime.dll | findstr /i ".dll"

    - name: Rebuild libraries (Windows)
      working-directory: ./core/compiler
      shell: bash
      run: |
        OBC="../release/${{ env.ARCH == 'ARM64' && 'deploy-arm64' || 'deploy-x64' }}/bin/obc.exe"
        if [ ! -f "$OBC" ]; then
          echo "Compiler not found at $OBC, skipping lib rebuild"
          exit 0
        fi

        echo "Rebuilding libraries with $OBC..."
        # The list lives in build_libs.sh, shared with update_version.sh; this
        # step used to carry a copy of all 31 lines.
        sh ./build_libs.sh "$OBC"
        echo "Libraries rebuilt successfully"

    - name: Update deploy with rebuilt libraries
      shell: bash
      working-directory: ./core/release
      run: |
        if [ -d "deploy-${{ env.ARCH }}" ]; then
          DEPLOY_LIB="deploy-${{ env.ARCH }}/lib"
        elif [ -d "deploy" ]; then
          DEPLOY_LIB="deploy/lib"
        else
          echo "Deploy directory not found, skipping lib copy"
          exit 0
        fi
        echo "Copying rebuilt libraries to $DEPLOY_LIB..."
        cp ../lib/*.obl "$DEPLOY_LIB/"
        echo "Done"

    - name: Set deploy directory
      id: deploy-dir
      shell: bash
      working-directory: ./core/release
      run: |
        if [ -d "deploy-${{ env.ARCH }}" ]; then
          echo "dir=deploy-${{ env.ARCH }}" >> $GITHUB_OUTPUT
        elif [ -d "deploy" ]; then
          echo "dir=deploy" >> $GITHUB_OUTPUT
        else
          echo "ERROR: Deploy directory not found"
          ls -la
          exit 1
        fi

    - name: Compile tests
      working-directory: ./core/release/${{ steps.deploy-dir.outputs.dir }}/bin
      shell: bash
      run: |
        if [ "${{ runner.os }}" = "Windows" ]; then
          OBC="./obc.exe"
        else
          OBC="./obc"
          chmod +x obc obr obd obi 2>/dev/null || true
        fi

        # Verify compiler exists
        if [ ! -f "$OBC" ]; then
          echo "ERROR: Compiler not found: $OBC"
          ls -la
          exit 1
        fi

        # Verify library directory
        LIB_DIR="../lib"
        if [ ! -d "$LIB_DIR" ]; then
          echo "ERROR: Library directory not found: $LIB_DIR"
          exit 1
        fi

        echo "Compiler found: $OBC"
        echo "Library directory: $LIB_DIR"

        # Set library path for macOS
        if [ "${{ runner.os }}" = "macOS" ]; then
          export DYLD_LIBRARY_PATH="$(pwd)/../lib:$DYLD_LIBRARY_PATH"
          echo "Set DYLD_LIBRARY_PATH for macOS"
        fi

        echo "Testing basic compilation..."
        echo "Working directory: $(pwd)"
        ls -la "$LIB_DIR" | head -20

        # Basic tests for all platforms
        # each example compiles with the -lib line in its own header, so a wrong
        # line in what readers copy fails here
        $OBC -src ../../../../programs/deploy/hello_0.obs || exit 1
        $OBC -src ../../../../programs/deploy/functions_3.obs || exit 1
        $OBC -src ../../../../programs/deploy/errors_6.obs || exit 1
        $OBC -lib xml -src ../../../../programs/deploy/xml_15.obs || exit 1

        echo "Basic tests compiled successfully"

        # Extended tests for Linux x64 only
        if [ "${{ inputs.platform }}" = "linux-x64" ]; then
          echo "Compiling extended tests..."
          $OBC -src ../../../../programs/deploy/values_1.obs || exit 1
          $OBC -src ../../../../programs/deploy/closures_8.obs || exit 1
          $OBC -lib cipher -src ../../../../programs/deploy/strings_10.obs || exit 1
          $OBC -src ../../../../programs/deploy/collections_11.obs || exit 1
          $OBC -lib regex -src ../../../../programs/deploy/regex_17.obs || exit 1
          $OBC -lib query,misc,net,json,regex,xml,csv,cipher -src ../../../../programs/deploy/sql_tables_18.obs || exit 1
          $OBC -lib csv,ml -src ../../../../programs/deploy/ml_outliers_27.obs || exit 1
          $OBC -lib nlp -src ../../../../programs/deploy/nlp_28.obs || exit 1
          $OBC -lib concurrent -src ../../../../programs/deploy/threads_12.obs || exit 1
          $OBC -lib cipher,net,gen_collect,net_h2 -src ../../../../programs/tests/prgm_http2.obs || exit 1
          $OBC -lib cipher,net,gen_collect,net_quic -src ../../../../programs/tests/prgm_http3.obs || exit 1
          $OBC -lib cipher,net,gen_collect,net_quic -src ../../../../programs/tests/http3_downgrade_test.obs || exit 1
          $OBC -lib cipher,net,gen_collect,net_h2 -src ../../../../programs/tests/http_header_echo_test.obs || exit 1
          echo "Extended tests compiled successfully"
        fi

    - name: Run tests
      working-directory: ./core/release/${{ steps.deploy-dir.outputs.dir }}/bin
      shell: bash
      run: |
        if [ "${{ runner.os }}" = "Windows" ]; then
          OBR="./obr.exe"
        else
          OBR="./obr"
        fi

        # Basic tests
        $OBR ../../../../programs/deploy/hello_0.obe
        $OBR ../../../../programs/deploy/functions_3.obe
        $OBR ../../../../programs/deploy/errors_6.obe
        $OBR ../../../../programs/deploy/xml_15.obe

        # Extended tests for Linux x64
        if [ "${{ inputs.platform }}" = "linux-x64" ]; then
          $OBR ../../../../programs/deploy/values_1.obe
          $OBR ../../../../programs/deploy/closures_8.obe
          $OBR ../../../../programs/deploy/strings_10.obe
          $OBR ../../../../programs/deploy/collections_11.obe
          $OBR ../../../../programs/deploy/regex_17.obe
          $OBR ../../../../programs/deploy/sql_tables_18.obe
          $OBR ../../../../programs/deploy/ml_outliers_27.obe
          $OBR ../../../../programs/deploy/nlp_28.obe
          # One run, no retry: the workers' locking makes the total exact, so a run that
          # exits non-zero, hangs or prints another total is a real failure to look at.
          # (A retry here hid failures, and the exit code alone missed a wrong total.)
          out=$(timeout 120 $OBR ../../../../programs/deploy/threads_12.obe 2>&1) || { echo "$out"; echo "threads_12.obe failed (exit status or timeout)"; exit 1; }
          echo "$out"
          if ! echo "$out" | grep -qx 'shared total: 5000050000'; then
            echo "threads_12.obe: the shared total is not 5000050000"
            exit 1
          fi
        fi
        # NOTE: HTTP/2 and HTTP/3 tests are intentionally NOT here. They depend
        # on live upstream servers and run as a separate non-gating step below.

    # The finished deploy tree goes to the jobs that test it (regression shards, VM flag tests,
    # the other checks), each of which starts from this archive instead of building. bin and lib
    # are everything the tests run; the vcpkg runtime directory is what this job put on PATH for
    # them (nghttp2 is copied into bin by the deploy script, but the ARM64 OpenCV codec DLLs are
    # not). One uncompressed zip: the files inside are already as compressed as they will get
    # and a single large file moves faster than hundreds of small ones.
    - name: Stage the deploy tree for the test jobs
      shell: pwsh
      run: |
        $deploy = "core/release/${{ steps.deploy-dir.outputs.dir }}"
        $stage = Join-Path $env:RUNNER_TEMP 'stage'
        New-Item -ItemType Directory -Force $stage | Out-Null
        Copy-Item "C:\vcpkg\installed\${{ env.ARCH }}-windows\bin" (Join-Path $stage 'vcpkg-bin') -Recurse
        tar -a -cf (Join-Path $env:RUNNER_TEMP 'deploy-tree.zip') -C $deploy bin lib -C $stage vcpkg-bin
        if ($LASTEXITCODE -ne 0) { throw "tar could not archive the deploy tree" }
        $size = (Get-Item (Join-Path $env:RUNNER_TEMP 'deploy-tree.zip')).Length / 1MB
        Write-Output ("deploy tree archive: {0:N1} MB" -f $size)
        "### Deploy tree archive, ${{ inputs.platform }}: $([math]::Round($size, 1)) MB" >> $env:GITHUB_STEP_SUMMARY

    - name: Upload the deploy tree
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: winstage-${{ inputs.platform }}
        path: ${{ runner.temp }}/deploy-tree.zip
        compression-level: 0
        retention-days: 3
        if-no-files-found: error

  # lang.obl built by the Windows toolchain must equal the Linux one. It needs msbuild and the
  # compiler's own sources only, so it runs beside everything else instead of in front of it.
  lang-obl:
    name: lang.obl matches the Linux build
    runs-on: ${{ inputs.platform == 'windows-arm64' && 'windows-11-arm' || 'windows-2025-vs2026' }}
    timeout-minutes: 30
    defaults:
      run:
        shell: cmd
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # The libraries, built once from source by the `libs` job (libs.yml). Today they are
    # also committed and `libs` fails on any byte of difference, so this overwrites each
    # file with an identical one; it is what the deploy scripts will find once the
    # .obl are no longer tracked (docs/DESIGN_OBL_FROM_SOURCE.md).
    - name: Download libraries
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: libs
        path: core/lib/

    # ============================================
    # Dependency Installation
    # ============================================

    # Windows setup
    - name: Setup Visual Studio (Windows)
      uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

    - name: Setup MSVC Environment (Windows)
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      with:
        arch: ${{ env.ARCH }}

    # Windows can build its own lang.obl: the Release-Sys configuration of compiler.vcxproj is
    # the _SYSTEM bootstrap compiler, the same sources the POSIX flow builds as sys_obc. The
    # result must equal the file in core/lib (the `libs` job's Linux build, which is also the
    # committed one today), byte for byte.
    - name: lang.obl built by the Windows _SYSTEM compiler equals the Linux build
      shell: cmd
      working-directory: ./core/compiler
      run: |
        call .\build_lang_windows.cmd ${{ env.ARCH }} %RUNNER_TEMP%\lang_windows.obl
        if errorlevel 1 exit /b 1
        fc /b %RUNNER_TEMP%\lang_windows.obl ..\lib\lang.obl
        if errorlevel 1 (
          echo ERROR: the Windows-built lang.obl differs from the library build
          exit /b 1
        )
        echo lang.obl: Windows build is byte-identical

  # ============================================
  # The regression suite, in SHARDS slices, both passes in each
  # ============================================
  regression:
    name: Regression shard ${{ matrix.shard }} of 6
    needs: build
    runs-on: ${{ inputs.platform == 'windows-arm64' && 'windows-11-arm' || 'windows-2025-vs2026' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    defaults:
      run:
        shell: cmd
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # The libraries, built once from source by the `libs` job (libs.yml). Today they are
    # also committed and `libs` fails on any byte of difference, so this overwrites each
    # file with an identical one; it is what the deploy scripts will find once the
    # .obl are no longer tracked (docs/DESIGN_OBL_FROM_SOURCE.md).
    - name: Download libraries
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: libs
        path: core/lib/

    # ============================================
    # Dependency Installation
    # ============================================

    - name: Download the deploy tree
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: winstage-${{ inputs.platform }}
        path: ${{ runner.temp }}/stage-download

    - name: Unpack the deploy tree
      shell: pwsh
      run: |
        $deploy = "core/release/deploy-${{ env.ARCH }}"
        $tmp = Join-Path $env:RUNNER_TEMP 'stage-unpacked'
        New-Item -ItemType Directory -Force $deploy, $tmp | Out-Null
        tar -xf (Join-Path $env:RUNNER_TEMP 'stage-download/deploy-tree.zip') -C $tmp
        if ($LASTEXITCODE -ne 0) { throw "tar could not unpack the deploy tree" }
        Move-Item "$tmp/bin" "$deploy/bin"
        Move-Item "$tmp/lib" "$deploy/lib"
        # what the build job had on PATH for the tests: the vcpkg runtime DLLs
        "$tmp/vcpkg-bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
        Get-ChildItem "$deploy/bin/obr.exe", "$deploy/bin/obc.exe" | ForEach-Object { Write-Output "$($_.Name) $($_.Length)" }

    # ARM64 only: the driver is compiled from source there, and needs cl and link on PATH.
    - name: Setup MSVC Environment (ARM64 ODBC driver build)
      if: env.ARCH == 'ARM64'
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      with:
        arch: ${{ env.ARCH }}

    # Christian Werner's sqliteodbc 0.99991, pinned by checksum. x64 lifts
    # sqlite3odbc.dll out of the upstream installer with 7-Zip (the installer
    # is never run); upstream ships no ARM64 build, so that leg compiles the
    # driver from the pinned source tarball and SQLite amalgamation with the
    # MSVC toolchain the step above put on PATH. Either way the DSN is a
    # per-user registry entry naming the DLL by path, needing no admin
    # rights, and the script connects through the Driver Manager before it
    # returns. The downloads are cached so an upstream outage cannot redden a
    # leg; the checksums are verified on a cache hit too. Windows PowerShell
    # rather than pwsh: the connection check uses System.Data.Odbc, which the
    # .NET Framework carries and PowerShell 7 does not bundle.
    - name: Cache SQLite ODBC downloads (Windows)
      continue-on-error: true
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: sqliteodbc-downloads
        key: sqliteodbc-0.99991-sqlite-3540100-${{ env.ARCH }}

    - name: Configure ODBC test DSN (Windows)
      shell: powershell
      run: ./tools/cicd/setup_sqlite_odbc.ps1 -Arch ${{ env.ARCH }} -Dir "$env:RUNNER_TEMP\sqliteodbc" -Downloads sqliteodbc-downloads

    # Two passes, as the single job ran them. The second runs whatever the first did, so a
    # failure in one cannot hide the other. The second compiles every method on its first call: the
    # default threshold compiles a method on its tenth call (or on entry when it has a loop), so most
    # of the suite runs interpreted and a JIT bug in a method called a few times never runs compiled
    # in the first pass. The frame-layout bug of #761 crashed mcp_debug_test only in this mode.
    # AMD64 and ARM64 are separate backends and Windows and POSIX take different branches inside
    # each, so both platforms run both passes.
    - name: Run regression tests, default JIT threshold
      working-directory: ./programs/regression
      shell: cmd
      env:
        REGRESSION_SHARD: ${{ matrix.shard }}/${{ env.SHARDS }}
        # Temporary: surface generic type-arg state to diagnose the intermittent
        # bad_generic_arg_mismatch miss (prints [generic-diag] lines during compile).
        OBJECK_DIAG_GENERICS: "1"
        OBJECK_REQUIRE_ODBC: "1"
      run: |
        call run_regression.cmd ${{ env.ARCH }} > "%RUNNER_TEMP%\regression_default.log" 2>&1
        set RC=%errorlevel%
        type "%RUNNER_TEMP%\regression_default.log"
        exit /b %RC%

    # What this shard ran, for the `result` job. The runner prints one "Results:" line; the number
    # of tests the shard was handed comes from the list the runner wrote, so a shard that stops
    # early (a crash, a timeout that kills the script) reports fewer tests than it was given.
    - name: Record shard counts (default)
      if: always()
      shell: bash
      env:
        PASS_TAG: default
      run: |
        out="$(cygpath -u "$RUNNER_TEMP")/shard-out"
        log="$(cygpath -u "$RUNNER_TEMP")/regression_${PASS_TAG}.log"
        mkdir -p "$out"
        cp "$log" "$out/" 2>/dev/null || true
        cp programs/regression/results/_failed_list.txt "$out/failed_${PASS_TAG}.txt" 2>/dev/null || true
        line=$(tr -d '\r' < "$log" 2>/dev/null | grep -E '^ +Results: [0-9]+ passed, [0-9]+ skipped, [0-9]+ failed' | tail -1 || true)
        expected=$(tr -d '\r' < programs/regression/results/_shard_tests.txt 2>/dev/null | grep -c . || true)
        if [ -z "$line" ]; then
          echo "::error::no 'Results:' line in the ${PASS_TAG} pass log; the runner did not finish"
          echo "passed=none" > "$out/counts_${PASS_TAG}.txt"
          exit 0
        fi
        read -r p s f <<< "$(echo "$line" | sed -E 's/^ +Results: ([0-9]+) passed, ([0-9]+) skipped, ([0-9]+) failed.*/\1 \2 \3/')"
        echo "passed=$p skipped=$s failed=$f expected=${expected:-0}" | tee "$out/counts_${PASS_TAG}.txt"
        echo "shard ${{ matrix.shard }}, ${PASS_TAG} pass: $p passed, $s skipped, $f failed of ${expected:-0}" >> "$GITHUB_STEP_SUMMARY"

    - name: Run regression tests, every method compiled on its first call
      working-directory: ./programs/regression
      shell: cmd
      if: success() || failure()
      env:
        REGRESSION_SHARD: ${{ matrix.shard }}/${{ env.SHARDS }}
        OBJECK_JIT_THRESHOLD: "1"
        OBJECK_REQUIRE_ODBC: "1"
      run: |
        call run_regression.cmd ${{ env.ARCH }} > "%RUNNER_TEMP%\regression_jit1.log" 2>&1
        set RC=%errorlevel%
        type "%RUNNER_TEMP%\regression_jit1.log"
        exit /b %RC%

    # What this shard ran, for the `result` job. The runner prints one "Results:" line; the number
    # of tests the shard was handed comes from the list the runner wrote, so a shard that stops
    # early (a crash, a timeout that kills the script) reports fewer tests than it was given.
    - name: Record shard counts (jit1)
      if: always()
      shell: bash
      env:
        PASS_TAG: jit1
      run: |
        out="$(cygpath -u "$RUNNER_TEMP")/shard-out"
        log="$(cygpath -u "$RUNNER_TEMP")/regression_${PASS_TAG}.log"
        mkdir -p "$out"
        cp "$log" "$out/" 2>/dev/null || true
        cp programs/regression/results/_failed_list.txt "$out/failed_${PASS_TAG}.txt" 2>/dev/null || true
        line=$(tr -d '\r' < "$log" 2>/dev/null | grep -E '^ +Results: [0-9]+ passed, [0-9]+ skipped, [0-9]+ failed' | tail -1 || true)
        expected=$(tr -d '\r' < programs/regression/results/_shard_tests.txt 2>/dev/null | grep -c . || true)
        if [ -z "$line" ]; then
          echo "::error::no 'Results:' line in the ${PASS_TAG} pass log; the runner did not finish"
          echo "passed=none" > "$out/counts_${PASS_TAG}.txt"
          exit 0
        fi
        read -r p s f <<< "$(echo "$line" | sed -E 's/^ +Results: ([0-9]+) passed, ([0-9]+) skipped, ([0-9]+) failed.*/\1 \2 \3/')"
        echo "passed=$p skipped=$s failed=$f expected=${expected:-0}" | tee "$out/counts_${PASS_TAG}.txt"
        echo "shard ${{ matrix.shard }}, ${PASS_TAG} pass: $p passed, $s skipped, $f failed of ${expected:-0}" >> "$GITHUB_STEP_SUMMARY"

    - name: Upload shard results
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: winshard-${{ inputs.platform }}-${{ matrix.shard }}
        path: ${{ runner.temp }}/shard-out
        retention-days: 14
        if-no-files-found: warn

