name: Probe net 1443 (Windows loopback)

# A probe, not a gate: runs only for pushes to probe/net-1443-* branches.
# exhaust.py, plain Python on loopback, 30,000 requests per close style:
# client closes first (Objeck today), server closes first, client resets,
# and 8 requests per connection. Counts TCP states (TIME_WAIT peak), connect
# errors and server ends left open.
on:
  push:
    branches: [ 'probe/net-1443-*' ]

permissions:
  contents: read

jobs:
  probe:
    name: close styles ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-2025-vs2026
          - platform: windows-arm64
            os: windows-11-arm
    defaults:
      run:
        shell: pwsh
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Close styles
      run: |
        foreach ($m in 'cfirst','sfirst','linger0','reuse8') {
          foreach ($k in 1..40) {
            $tw = (netstat -ano -p tcp | Select-String 'TIME_WAIT').Count
            if ($tw -lt 100) { break }
            Start-Sleep -Seconds 10
          }
          "TIME_WAIT before $m`: $tw"
          python tools/probe_1443/exhaust.py 30000 6 $m
        }
