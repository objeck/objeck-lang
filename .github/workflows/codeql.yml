# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
#
name: "CodeQL"

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: '39 13 * * 1'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Runner size impacts CodeQL analysis time. To learn more, please see:
    #   - https://gh.io/recommended-hardware-resources-for-running-codeql
    #   - https://gh.io/supported-runners-and-hardware-resources
    #   - https://gh.io/using-larger-runners (GitHub.com only)
    # Consider using larger runners or machines with greater resources for possible analysis time improvements.
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    timeout-minutes: ${{ (matrix.language == 'swift' && 120) || 360 }}
    permissions:
      # required for all workflows
      security-events: write

      # required to fetch internal or private CodeQL packs
      packages: read

      # only required for workflows in private repositories
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: c-cpp
          build-mode: manual
        - language: javascript-typescript
          build-mode: none
        - language: python
          build-mode: none
        # CodeQL supports the following values keywords for 'language': 'c-cpp', 'csharp', 'go', 'java-kotlin', 'javascript-typescript', 'python', 'ruby', 'swift'
        # Use `c-cpp` to analyze code written in C, C++ or both
        # Use 'java-kotlin' to analyze code written in Java, Kotlin or both
        # Use 'javascript-typescript' to analyze code written in JavaScript, TypeScript or both
        # To learn more about changing the languages that are analyzed or customizing the build mode for your analysis,
        # see https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/customizing-your-advanced-setup-for-code-scanning.
        # If you are analyzing a compiled language, you can modify the 'build-mode' for that language to customize how
        # your codebase is analyzed, see https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/codeql-code-scanning-for-compiled-languages
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    # Initializes the CodeQL tools for scanning.
    # Before CodeQL starts tracing, so a cache miss does not analyze AWS-LC.
    - if: matrix.build-mode == 'manual'
      name: QUIC dependencies
      uses: ./.github/actions/quic-deps

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        # If you wish to specify custom queries, you can do so here or in a config file.
        # By default, queries listed here will override any specified in a config file.
        # Prefix the list here with "+" to use these queries and those in the config file.

        # For more details on CodeQL's query packs, refer to: https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning#using-queries-in-ql-packs
        # queries: security-extended,security-and-quality

    # If the analyze step fails for one of the languages you are analyzing with
    # "We were unable to automatically build your code", modify the matrix above
    # to set the build mode to "manual" for that language. Then modify this step
    # to build your code.
    # ℹ️ Command-line programs to run using the OS shell.
    # 📚 See https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#jobsjob_idstepsrun
    - if: matrix.build-mode == 'manual'
      name: Build C and C++ code
      run: |
        # Skip apt-get upgrade — it pulls unrelated packages (e.g. the firefox
        # snap stub) that occasionally fail to install on the runner image and
        # break this job for reasons unrelated to our build.
        #
        # libopencv-dev and libmp3lame-dev: without them the opencv, onnx and
        # lame native libraries never built here -- so CodeQL never saw that
        # C++ -- and deploy_posix.sh now fails when a required library is missing.
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential git libmbedtls-dev unixodbc-dev \
          libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libsdl2-mixer-dev \
          libreadline-dev unzip libeigen3-dev \
          libopencv-dev libmp3lame-dev pkg-config
        cd core/release && ./deploy_posix.sh x64

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"

  # CodeQL writes a ~460 MB C/C++ TRAP cache per analysed commit, and its key
  # embeds the SHA -- so once master moves on, that entry can never be hit
  # again. Thirteen of them had accumulated to 5.9 GB, taking the repository to
  # 9.7 GB of its 10 GB Actions cache ceiling; past the ceiling GitHub evicts
  # whatever is oldest, which is how a release build lost its dependency caches
  # and gained about forty minutes (#940).
  #
  # Keep the newest few -- the CodeQL action restores by key PREFIX, so a recent
  # entry still warm-starts a new commit -- and drop the rest. Runs only on
  # master, after the analysis that created today's entry.
  prune-caches:
    name: Prune superseded CodeQL caches
    needs: analyze
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete TRAP caches for superseded commits
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          KEEP: '3'
        run: |
          set -euo pipefail

          gh api "repos/$REPO/actions/caches?per_page=100" \
            --jq '.actions_caches[] | select(.key | startswith("codeql-trap")) | "\(.created_at)\t\(.id)\t\(.size_in_bytes)\t\(.key)"' \
            | sort -r > all.tsv

          total=$(wc -l < all.tsv)
          echo "codeql-trap caches: $total (keeping newest $KEEP)"
          if [ "$total" -le "$KEEP" ]; then
            echo "nothing to prune"
            exit 0
          fi

          tail -n +$((KEEP + 1)) all.tsv | while IFS=$'\t' read -r created id size key; do
            echo "  deleting $key ($((size / 1048576)) MB, $created)"
            gh api -X DELETE "repos/$REPO/actions/caches/$id"
          done

          # Report the result rather than assuming it: a delete that silently
          # failed would otherwise look exactly like a successful prune.
          left=$(gh api "repos/$REPO/actions/caches?per_page=100" \
            --jq '[.actions_caches[] | select(.key | startswith("codeql-trap"))] | length')
          echo "codeql-trap caches remaining: $left"
          if [ "$left" -gt "$KEEP" ]; then
            echo "::error::prune left $left caches, expected at most $KEEP"
            exit 1
          fi
