name: Release Build

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 2026.2.1)'
        required: true
        type: string

jobs:
  # ============================================
  # Prepare Release Metadata
  # ============================================

  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_number: ${{ steps.version.outputs.version_number }}
      upload_url: ${{ steps.create_release.outputs.upload_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"  # Remove 'v' prefix
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Generate version number (remove dots and non-numeric suffixes)
          # Extract only numeric and dot parts (e.g., "2026.2.1-test" -> "2026.2.1")
          VERSION_NUMERIC=$(echo "$VERSION" | sed 's/[^0-9.].*$//')
          VERSION_NUMBER=$(echo "$VERSION_NUMERIC" | tr -d '.')
          echo "version_number=$VERSION_NUMBER" >> $GITHUB_OUTPUT

          echo "📦 Release version: $VERSION"
          echo "📊 Version number: $VERSION_NUMBER"

      - name: Update version files
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          VERSION_NUMBER="${{ steps.version.outputs.version_number }}"
          VERSION_WINDOWS=$(echo "$VERSION" | tr '.' ',')

          # Extract year from version
          YEAR=$(echo "$VERSION" | cut -d'.' -f1)

          # Update version.h
          cat > core/shared/version.h << EOF
          #pragma once

          #include "instrs.h"
          #include "traps.h"

          #define MAGIC_NUM_EXE 0xffbe // bitmask 'e'
          #define MAGIC_NUM_LIB 0xffb6 // bitmask 'k'

          #define VER_NUM $VERSION_NUMBER
          #define VERSION_STRING L"$VERSION"
          EOF

          echo "✅ Updated version.h with version $VERSION"

          # deploy_windows.cmd re-runs update_version.ps1, which REGENERATES
          # version.h from its own hardcoded version -- overwriting the tag-derived
          # one written above. If the .ps1 has not been bumped, Windows silently
          # builds a different version from Linux and macOS, and its binaries then
          # disagree with the committed .obl set on VER_NUM, which fails at runtime
          # for every program. Rewrite the .ps1 from the tag so the two cannot drift.
          PS1=core/release/update_version.ps1
          MAJOR=$(echo "$VERSION" | cut -d'.' -f1)
          MINOR=$(echo "$VERSION" | cut -d'.' -f2)
          PATCH=$(echo "$VERSION" | cut -d'.' -f3)
          sed -i "s/^\$year_end = .*/\$year_end = \"$MAJOR\"/;
                  s/^\$month_end = .*/\$month_end = \"$MINOR\"/;
                  s/^\$version = \"[0-9]*\"/\$version = \"$PATCH\"/" "$PS1"

          if ! grep -q "^\$version = \"$PATCH\"" "$PS1"; then
            echo "❌ Could not set the version in $PS1 -- Windows would build the wrong version"
            exit 1
          fi
          echo "✅ Synced $PS1 to $MAJOR.$MINOR.$PATCH"

      - name: Upload version metadata
        uses: actions/upload-artifact@v6
        with:
          name: version-metadata
          path: |
            core/shared/version.h
            core/release/update_version.ps1
          retention-days: 1

  # ============================================
  # Build All Platforms in Parallel
  # ============================================

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    # Backstop so a hung step can never tie up a runner for the 6-hour default.
    # ci-build.yml has carried this since it was added; the release build -- the
    # longer and more expensive of the two -- had none. Sized off real data: the
    # windows-arm64 leg legitimately takes ~70 min (vcpkg builds opencv4:arm64
    # from source on a cache miss), so 150 leaves ample headroom.
    timeout-minutes: 150

    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned to windows-2025-vs2026, which ships VS2026 (toolset v145).
          # The .vcxproj files select $(DefaultPlatformToolset), so they resolve
          # to v145 here and to v143 on a VS2022 developer box.
          # Windows x64
          - platform: windows-x64
            os: windows-2025-vs2026
            arch: x64
            deploy_script: deploy_windows.cmd x64 deploy
            shell: cmd
            artifact_pattern: "objeck-windows-x64_0.0.0.*"

          # Windows ARM64 (cross-compiled on x64 runner)
          - platform: windows-arm64
            os: windows-2025-vs2026
            arch: ARM64
            deploy_script: deploy_windows.cmd arm64 deploy
            shell: cmd
            artifact_pattern: "objeck-windows-arm64_0.0.0.*"

          # Linux x64
          - platform: linux-x64
            os: ubuntu-latest
            arch: x64
            deploy_script: ./deploy_posix.sh x64 deploy
            shell: bash
            artifact_pattern: "objeck-linux-x64_0.0.0.tgz"

          # Linux ARM64 - using GitHub-hosted ARM64 runners (now GA)
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            arch: arm64
            deploy_script: ./deploy_posix.sh arm64 deploy
            shell: bash
            artifact_pattern: "objeck-linux-arm64_0.0.0.tgz"

          # macOS ARM64
          - platform: macos-arm64
            os: macos-15
            arch: arm64
            deploy_script: ./deploy_macos_arm64.sh deploy
            shell: bash
            artifact_pattern: "objeck-macos-arm64_0.0.0.zip"

    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # The artifact carries core/shared/version.h and core/release/update_version.ps1,
      # so its root is 'core/' -- unpack there, not into core/shared/.
      - name: Download version metadata
        uses: actions/download-artifact@v4
        with:
          name: version-metadata
          path: core/

      # ============================================
      # Install Dependencies (Same as CI)
      # ============================================

      # Cache a USER-OWNED archive dir; restoring root-owned /var/cache/apt/archives
      # as the unprivileged runner fails with "tar: ...deb: Permission denied".
      - name: Cache APT packages (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v5
        with:
          path: ~/apt-cache
          key: ${{ runner.os }}-${{ matrix.arch }}-apt-release
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-apt-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          mkdir -p ~/apt-cache/partial
          sudo apt-get update
          sudo apt-get install -y -o Dir::Cache::archives="$HOME/apt-cache" -o APT::Sandbox::User=root \
            build-essential \
            libopencv-dev \
            libmbedtls-dev \
            libnghttp2-dev \
            libngtcp2-dev \
            libngtcp2-crypto-gnutls-dev \
            libnghttp3-dev \
            libgnutls28-dev \
            unixodbc-dev \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-ttf-dev \
            libsdl2-mixer-dev \
            libreadline-dev \
            libeigen3-dev \
            libmp3lame-dev
          sudo chown -R "$(id -u):$(id -g)" ~/apt-cache

      - name: Cache Homebrew (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/Homebrew
            /opt/homebrew/Cellar
          key: ${{ runner.os }}-brew-release
          restore-keys: |
            ${{ runner.os }}-brew-

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          # Install only formulae that aren't already present. The hosted runner
          # preinstalls newer gnutls/libnghttp3/cmake than these formulae, so a
          # plain `brew install` aborts with "already installed" (red CI error
          # annotations) even though the build is fine. Skip present packages and
          # install the rest, so genuine install failures still surface.
          for pkg in opencv onnxruntime mbedtls nghttp2 libnghttp3 gnutls cmake unixodbc sdl2 sdl2_image sdl2_ttf sdl2_mixer readline eigen lame; do
            if brew list --versions "$pkg" >/dev/null 2>&1; then
              echo "✓ $pkg already installed — skipping"
            else
              brew install "$pkg"
            fi
          done
          brew cleanup

          # Add Homebrew bin to PATH
          export PATH="/opt/homebrew/bin:$PATH"
          echo "/opt/homebrew/bin" >> $GITHUB_PATH

      - name: Build ngtcp2 with GnuTLS backend (macOS)
        if: runner.os == 'macOS'
        run: |
          NGTCP2_VER=$(brew list --versions libngtcp2 | awk '{print $2}')
          echo "Building ngtcp2 v${NGTCP2_VER} to match Homebrew libngtcp2"
          cd /tmp
          git clone --depth 1 --branch "v${NGTCP2_VER}" https://github.com/ngtcp2/ngtcp2.git
          cd ngtcp2
          git submodule update --init --depth 1
          mkdir build && cd build
          cmake -DCMAKE_INSTALL_PREFIX=/opt/homebrew \
                -DENABLE_GNUTLS=ON -DENABLE_OPENSSL=OFF \
                -DCMAKE_PREFIX_PATH="/opt/homebrew;/opt/homebrew/opt/gnutls" \
                -DBUILD_TESTING=OFF ..
          make -j$(sysctl -n hw.ncpu)
          make install DESTDIR=/tmp/ngtcp2-install
          sudo cp /tmp/ngtcp2-install/opt/homebrew/lib/libngtcp2_crypto_gnutls* /opt/homebrew/lib/
          sudo mkdir -p /opt/homebrew/include/ngtcp2
          sudo cp /tmp/ngtcp2-install/opt/homebrew/include/ngtcp2/* /opt/homebrew/include/ngtcp2/
          echo "ngtcp2 GnuTLS backend installed:"
          ls /opt/homebrew/lib/libngtcp2*

      - name: Select Xcode 16.3+ (macOS)
        if: runner.os == 'macOS'
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_16.[3-9]*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH=$(ls -d /Applications/Xcode_16.*.app 2>/dev/null | sort -V | tail -1)
          fi
          if [ -n "$XCODE_PATH" ]; then
            sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
            echo "Selected: $XCODE_PATH"
          fi
          xcodebuild -version

      - name: Setup Visual Studio (Windows)
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v3

      - name: Setup MSVC Environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        # mbedTLS and nghttp2 now come from vcpkg, resolved by
        # core/build/vcpkg.props. They used to be binaries committed under
        # core/lib/openssl/win/{x64,arm64}, which is why this step did nothing:
        # the projects listed those directories ahead of $(LibraryPath), so the
        # committed copies were what got linked, while the committed headers had
        # already drifted to a different version. This workflow builds the
        # RELEASE artifacts, so it needs the same install ci-build.yml does.
        run: |
          function Install-VcpkgPackage([string]$pkg) {
            $max = 3
            for ($i = 1; $i -le $max; $i++) {
              vcpkg install $pkg
              if ($LASTEXITCODE -eq 0) { return }
              if ($i -lt $max) {
                Write-Output "vcpkg install $pkg failed (attempt $i/$max); retrying in 20s..."
                Start-Sleep -Seconds 20
              }
            }
            throw "vcpkg install $pkg failed after $max attempts"
          }

          Install-VcpkgPackage "mbedtls:${{ matrix.arch }}-windows"
          Install-VcpkgPackage "nghttp2:${{ matrix.arch }}-windows"

          # PATH only, for the deploy script's nghttp2.dll copy. The compiler
          # and linker paths come from vcpkg.props, not the environment.
          $vcpkgRoot = "C:\vcpkg\installed\${{ matrix.arch }}-windows"
          echo "$vcpkgRoot\bin" >> $env:GITHUB_PATH

          Write-Output "Installed mbedtls and nghttp2 for ${{ matrix.arch }}"

      - name: Cache OpenCV DLLs (Windows x64)
        if: matrix.platform == 'windows-x64'
        id: opencv-cache-x64
        uses: actions/cache@v5
        with:
          path: core/lib/opencv/win/x64/bin
          key: opencv-4.12.0-win-x64-dlls

      - name: Download OpenCV runtime DLLs (Windows x64)
        if: matrix.platform == 'windows-x64' && steps.opencv-cache-x64.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $opencvVersion = "4.12.0"
          $binDir = "core\lib\opencv\win\x64\bin"
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null

          $url = "https://github.com/opencv/opencv/releases/download/$opencvVersion/opencv-$opencvVersion-windows.exe"
          Write-Output "Downloading OpenCV $opencvVersion from $url ..."
          Invoke-WebRequest -Uri $url -OutFile opencv-dl.exe

          7z x opencv-dl.exe -oopencv-extract -y | Out-Null

          Copy-Item "opencv-extract\opencv\build\x64\vc16\bin\opencv_world4120.dll" $binDir
          Copy-Item "opencv-extract\opencv\build\x64\vc16\bin\opencv_videoio_ffmpeg4120_64.dll" $binDir

          Remove-Item opencv-dl.exe -Force
          Remove-Item -Recurse opencv-extract -Force

          Write-Output "OpenCV DLLs installed:"
          Get-ChildItem $binDir

      - name: Cache OpenCV DLLs (Windows ARM64)
        if: matrix.platform == 'windows-arm64'
        id: opencv-cache-arm64
        uses: actions/cache@v5
        with:
          path: core/lib/opencv/win/arm64/bin
          key: opencv-4.12.0-win-arm64-dlls

      - name: Install OpenCV ARM64 runtime DLL via vcpkg
        if: matrix.platform == 'windows-arm64' && steps.opencv-cache-arm64.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
        run: |
          $binDir = "core\lib\opencv\win\arm64\bin"
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null

          Write-Output "Installing opencv4:arm64-windows via vcpkg (uses GHA binary cache)..."
          vcpkg install opencv4:arm64-windows --feature-flags=-manifests

          $vcpkgBin = "C:\vcpkg\installed\arm64-windows\bin"
          Get-ChildItem "$vcpkgBin\opencv_*4.dll" -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName $binDir
            Write-Output "Copied: $($_.Name)"
          }

          Write-Output "OpenCV ARM64 DLLs:"
          Get-ChildItem $binDir

      - name: Install WiX Toolset (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2
          Write-Output "✅ WiX Toolset installed"

      # ============================================
      # Build Full Release
      # Note: Bootstrap is skipped because version.h is already updated by prepare job
      # ============================================

      # Certificates are installed BEFORE the build, not after it. The build step
      # runs deploy_macos_arm64.sh, which both assembles the tree AND tars it into
      # the .tgz artifact -- so an identity that arrives afterwards can only ever
      # reach the .pkg. That is why tarball users received ad-hoc binaries that
      # macOS quarantines and silently refuses to run.
      - name: Install Apple signing certificate (macOS)
        if: matrix.platform == 'macos-arm64'
        env:
          APPLE_INSTALLER_CERT_BASE64: ${{ secrets.APPLE_INSTALLER_CERT_BASE64 }}
          APPLE_INSTALLER_CERT_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERT_PASSWORD }}
          APPLE_APP_CERT_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_APP_CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$APPLE_INSTALLER_CERT_BASE64" ]; then
            echo "Apple installer certificate not configured - .pkg will be unsigned"
            exit 0
          fi

          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import Developer ID Installer certificate
          CERT_PATH=$RUNNER_TEMP/installer_cert.p12
          echo -n "$APPLE_INSTALLER_CERT_BASE64" | base64 --decode -o "$CERT_PATH"
          security import "$CERT_PATH" -P "$APPLE_INSTALLER_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          rm "$CERT_PATH"

          # Import Developer ID Application certificate (for binary signing)
          if [ -n "$APPLE_APP_CERT_BASE64" ]; then
            APP_CERT_PATH=$RUNNER_TEMP/app_cert.p12
            echo -n "$APPLE_APP_CERT_BASE64" | base64 --decode -o "$APP_CERT_PATH"
            security import "$APP_CERT_PATH" -P "$APPLE_APP_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            rm "$APP_CERT_PATH"
          fi

          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productsign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "SIGNING_KEYCHAIN=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "Certificates installed."

      - name: Build release
        working-directory: ./core/release
        run: ${{ matrix.deploy_script }}

      - name: Verify required binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = if ("${{ matrix.arch }}" -eq "ARM64") { "deploy-arm64" } else { "deploy-x64" }
          $binDir = "core\release\$target\bin"
          $required = @("obr.exe", "obc.exe", "obd.exe", "obi.exe", "obb.exe", "obu.exe")
          $missing = @()
          foreach ($bin in $required) {
            if (-not (Test-Path "$binDir\$bin")) { $missing += $bin }
          }
          if ($missing.Count -gt 0) {
            Write-Error "❌ Missing binaries in $binDir`: $($missing -join ', ')"
            exit 1
          }
          Write-Output "✅ All required binaries present in $binDir"
          $apiDir = "core\release\$target\doc\api"
          $htmlCount = (Get-ChildItem -Path $apiDir -Filter "*.html" -Recurse -ErrorAction SilentlyContinue).Count
          if ($htmlCount -lt 50) {
            Write-Error "❌ API docs incomplete in $apiDir`: only $htmlCount HTML files (expected 50+)"
            exit 1
          }
          Write-Output "✅ API docs complete: $htmlCount HTML files"

      - name: Verify required binaries (POSIX)
        if: runner.os != 'Windows'
        run: |
          DEPLOY_DIR="core/release/deploy"
          REQUIRED="obr obc obd obi obb obu"
          MISSING=""
          for bin in $REQUIRED; do
            [ -f "$DEPLOY_DIR/bin/$bin" ] || MISSING="$MISSING $bin"
          done
          if [ -n "$MISSING" ]; then
            echo "❌ Missing binaries in $DEPLOY_DIR/bin:$MISSING"
            exit 1
          fi
          echo "✅ All required binaries present in $DEPLOY_DIR/bin"
          HTML_COUNT=$(find "$DEPLOY_DIR/doc/api" -name "*.html" 2>/dev/null | wc -l)
          if [ "$HTML_COUNT" -lt 50 ]; then
            echo "❌ API docs incomplete in $DEPLOY_DIR/doc/api: only $HTML_COUNT HTML files (expected 50+)"
            exit 1
          fi
          echo "✅ API docs complete: $HTML_COUNT HTML files"

      # Smoke test: the SHIPPED tree must actually work, not merely exist.
      #
      # Every check above only asserts that files are present. Nothing until now
      # ran the toolchain that is about to be published, so a release could ship
      # binaries that cannot compile or run anything and still go out green. The
      # sharpest case is VER_NUM: .obl files embed it and both the linker and the
      # VM reject a mismatch, so a compiler built from one version against a
      # library set from another fails on EVERY program -- silently, at the user's
      # machine rather than in CI.
      #
      # Only genuinely cross-compiled targets are skipped, since their binaries
      # cannot execute on the builder. That is Windows ARM64 alone: it is built on
      # an x64 runner, whereas linux-arm64 uses ubuntu-24.04-arm and macos-arm64
      # uses macos-15, both native.
      - name: Smoke test the shipped toolchain (POSIX)
        if: runner.os != 'Windows'
        run: |
          set -e
          DEPLOY_DIR="$(pwd)/core/release/deploy"
          export OBJECK_LIB_PATH="$DEPLOY_DIR/lib"
          export LD_LIBRARY_PATH="$DEPLOY_DIR/lib/native:${LD_LIBRARY_PATH:-}"
          export DYLD_LIBRARY_PATH="$DEPLOY_DIR/lib/native:${DYLD_LIBRARY_PATH:-}"

          cat > /tmp/smoke.obs <<'OBJECK'
          use Collection;
          class Smoke {
            function : Main(args : String[]) ~ Nil {
              m := Map->New()<String, String>;
              m->Insert("k", "v");
              v := m->Find("k");
              if(v <> Nil & v->Equals("v") & m->Size() = 1) {
                "SMOKE_OK"->PrintLine();
              };
            }
          }
          OBJECK

          "$DEPLOY_DIR/bin/obc" -src /tmp/smoke.obs -lib gen_collect -dest /tmp/smoke.obe
          OUT=$("$DEPLOY_DIR/bin/obr" /tmp/smoke.obe)
          echo "$OUT"
          if [ "$OUT" != "SMOKE_OK" ]; then
            echo "❌ The shipped toolchain did not run a trivial program correctly"
            exit 1
          fi

          # The reported version must be the tag's. A mismatch means some step
          # rebuilt version.h from a stale source, which also desyncs VER_NUM.
          VERSION="${{ needs.prepare.outputs.version }}"
          REPORTED=$("$DEPLOY_DIR/bin/obc" -version 2>&1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
          if [ -n "$REPORTED" ] && [ "$REPORTED" != "$VERSION" ]; then
            echo "❌ Shipped obc reports $REPORTED but the tag is $VERSION"
            exit 1
          fi
          echo "✅ Shipped toolchain compiles, runs and reports ${REPORTED:-$VERSION}"

      - name: Smoke test the shipped toolchain (Windows)
        if: runner.os == 'Windows' && matrix.arch != 'ARM64'
        shell: pwsh
        run: |
          $target = "deploy-x64"
          $deploy = Join-Path (Get-Location) "core\release\$target"
          $env:OBJECK_LIB_PATH = "$deploy\lib"
          $env:PATH = "$deploy\lib\native;$deploy\bin;$env:PATH"

          @'
          use Collection;
          class Smoke {
            function : Main(args : String[]) ~ Nil {
              m := Map->New()<String, String>;
              m->Insert("k", "v");
              v := m->Find("k");
              if(v <> Nil & v->Equals("v") & m->Size() = 1) {
                "SMOKE_OK"->PrintLine();
              };
            }
          }
          '@ | Set-Content -Encoding utf8 "$env:TEMP\smoke.obs"

          & "$deploy\bin\obc.exe" -src "$env:TEMP\smoke.obs" -lib gen_collect -dest "$env:TEMP\smoke.obe"
          if($LASTEXITCODE -ne 0) { Write-Error "shipped obc failed to compile a trivial program"; exit 1 }

          $out = & "$deploy\bin\obr.exe" "$env:TEMP\smoke.obe"
          Write-Output $out
          if($out -notmatch "SMOKE_OK") {
            Write-Error "The shipped toolchain did not run a trivial program correctly"
            exit 1
          }

          # Windows regenerates version.h via update_version.ps1 during deploy, so
          # this is where a drift between the .ps1 and the tag would surface.
          $version = "${{ needs.prepare.outputs.version }}"
          $reported = (& "$deploy\bin\obc.exe" -version 2>&1 | Select-String -Pattern '\d+\.\d+\.\d+' | ForEach-Object { $_.Matches[0].Value } | Select-Object -First 1)
          if($reported -and $reported -ne $version) {
            Write-Error "Shipped obc reports $reported but the tag is $version"
            exit 1
          }
          Write-Output "✅ Shipped toolchain compiles, runs and reports $(if($reported){$reported}else{$version})"

      # ============================================
      # Code Signing (Windows)
      # ============================================

      # No code signing here, deliberately.
      #
      # The signing certificate lives on a SafeNet eToken (see the SAC client and
      # OV instructions in the signing-keys archive), so its private key is
      # non-exportable and no PFX+password can reproduce it. A GitHub-hosted
      # runner has no USB token, so CI cannot sign at all.
      #
      # This step used to run `signtool sign /f <pfx> /p <password>`, which is the
      # wrong mechanism for a token and failed on every artifact while warning and
      # continuing -- so every Windows installer from v2026.4.0 through v2026.8.2
      # shipped unsigned while the notes claimed otherwise. deploy_windows.cmd
      # separately attempts `signtool ... /a`, which is the RIGHT mechanism and
      # works locally with the token plugged in, but also cannot work on a runner.
      #
      # Signing is a post-publish step run by a human:
      #     tools\cicd\sign_release.cmd <version>
      # which downloads the published MSIs, signs them with the token, verifies
      # with `signtool verify /pa`, and re-uploads with --clobber.


      # ============================================
      # macOS .pkg Installer + Signing + Notarization
      # ============================================

      - name: Create macOS .pkg installer
        if: matrix.platform == 'macos-arm64'
        working-directory: ./core/release
        env:
          APPLE_INSTALLER_CERT_BASE64: ${{ secrets.APPLE_INSTALLER_CERT_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          chmod +x create_macos_pkg.sh

          # Determine signing identity
          SIGN_ID=""
          if [ -n "$APPLE_INSTALLER_CERT_BASE64" ]; then
            SIGN_ID=$(security find-identity -v -p basic "$SIGNING_KEYCHAIN" 2>/dev/null | grep "Developer ID Installer" | head -1 | sed 's/.*"\(.*\)".*/\1/' || true)
            if [ -n "$SIGN_ID" ]; then
              echo "Found installer identity: $SIGN_ID"
            else
              echo "Warning: Installer certificate imported but identity not found"
            fi
          fi

          # Determine notarization
          NOTARIZE_FLAG=""
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_TEAM_ID" ] && [ -n "$APPLE_APP_PASSWORD" ]; then
            NOTARIZE_FLAG="notarize"
          fi

          OUTPUT_DIR=~/Desktop ./create_macos_pkg.sh "$VERSION" "$SIGN_ID" "$NOTARIZE_FLAG"

          echo "macOS .pkg created:"
          ls -lh ~/Desktop/objeck-macos-arm64_*.pkg || true

      - name: Notarize macOS archive
        if: matrix.platform == 'macos-arm64'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          # The .zip exists because a .tgz cannot be submitted to the notary
          # service, so tarball users could never receive anything macOS would
          # run without clearing quarantine by hand.
          ZIP=$(find ~/Desktop -name "objeck-macos-arm64_*.zip" -type f | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "No macOS .zip found to notarize"
            exit 1
          fi

          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_TEAM_ID" ] || [ -z "$APPLE_APP_PASSWORD" ]; then
            echo "No notarization credentials configured - skipping"
            exit 0
          fi

          "$GITHUB_WORKSPACE/tools/cicd/notarize.sh" "$ZIP"

      - name: Clean up macOS keychain
        if: matrix.platform == 'macos-arm64' && always()
        run: |
          if [ -f "$RUNNER_TEMP/app-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
          fi

      # ============================================
      # Find and Upload Artifacts
      # ============================================

      - name: Find release artifacts (Windows)
        if: runner.os == 'Windows'
        id: artifacts-win
        shell: pwsh
        run: |
          $buildDir = "$env:GITHUB_WORKSPACE\Objeck-Build"
          $files = Get-ChildItem -Path $buildDir -Recurse -Include ${{ matrix.artifact_pattern }}

          if ($files.Count -eq 0) {
            Write-Error "No artifacts found matching pattern: ${{ matrix.artifact_pattern }}"
            exit 1
          }

          # Collect all matching file paths (newline-separated for multi-path upload)
          $paths = @()
          foreach ($file in $files) {
            Write-Output "Found: $($file.FullName)"
            $paths += $file.FullName
          }

          # Write multiline output for upload step
          $pathsStr = $paths -join "`n"
          echo "artifact_paths<<EOF" >> $env:GITHUB_OUTPUT
          echo $pathsStr >> $env:GITHUB_OUTPUT
          echo "EOF" >> $env:GITHUB_OUTPUT

      - name: Find release artifacts (POSIX)
        if: runner.os != 'Windows'
        id: artifacts-posix
        shell: bash
        run: |
          ARTIFACT=$(find ~/Desktop -name "${{ matrix.artifact_pattern }}" -type f | head -n 1)

          if [ -z "$ARTIFACT" ]; then
            echo "❌ No artifacts found matching pattern: ${{ matrix.artifact_pattern }}"
            exit 1
          fi

          echo "✅ Found: $ARTIFACT"

          # For macOS, also include .pkg installer if it exists
          ALL_PATHS="$ARTIFACT"
          if [ "${{ matrix.platform }}" = "macos-arm64" ]; then
            PKG=$(find ~/Desktop -name "objeck-macos-arm64_*.pkg" -type f | head -n 1)
            if [ -n "$PKG" ]; then
              echo "✅ Found .pkg: $PKG"
              ALL_PATHS="$ALL_PATHS"$'\n'"$PKG"
            fi
            # Deprecated, one release only: macOS copies of obu built before the
            # switch ask for a .tgz asset by name and would find nothing without
            # it. Drop this once a release has shipped with obu asking for .zip.
            TGZ=$(find ~/Desktop -name "objeck-macos-arm64_*.tgz" -type f | head -n 1)
            if [ -n "$TGZ" ]; then
              echo "✅ Found legacy .tgz: $TGZ"
              ALL_PATHS="$ALL_PATHS"$'\n'"$TGZ"
            fi
          fi

          echo "artifact_paths<<EOF" >> $GITHUB_OUTPUT
          echo "$ALL_PATHS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Upload release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.platform }}
          path: |
            ${{ runner.os == 'Windows' && steps.artifacts-win.outputs.artifact_paths || steps.artifacts-posix.outputs.artifact_paths }}
          retention-days: 7

  # ============================================
  # Build LSP Package
  # ============================================

  build-lsp:
    name: Build LSP Package
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # The artifact carries core/shared/version.h and core/release/update_version.ps1,
      # so its root is 'core/' -- unpack there, not into core/shared/.
      - name: Download version metadata
        uses: actions/download-artifact@v4
        with:
          name: version-metadata
          path: core/

      # Cache a USER-OWNED archive dir; restoring root-owned /var/cache/apt/archives
      # as the unprivileged runner fails with "tar: ...deb: Permission denied".
      - name: Cache APT packages
        uses: actions/cache@v5
        with:
          path: ~/apt-cache
          key: ${{ runner.os }}-x64-apt-release
          restore-keys: |
            ${{ runner.os }}-x64-apt-

      - name: Install Linux dependencies
        run: |
          mkdir -p ~/apt-cache/partial
          sudo apt-get update
          sudo apt-get install -y -o Dir::Cache::archives="$HOME/apt-cache" -o APT::Sandbox::User=root \
            build-essential \
            libopencv-dev \
            libmbedtls-dev \
            libnghttp2-dev \
            libngtcp2-dev \
            libngtcp2-crypto-gnutls-dev \
            libnghttp3-dev \
            libgnutls28-dev \
            unixodbc-dev \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-ttf-dev \
            libsdl2-mixer-dev \
            libreadline-dev \
            libeigen3-dev \
            libmp3lame-dev
          sudo chown -R "$(id -u):$(id -g)" ~/apt-cache

      - name: Build Linux x64 toolchain
        working-directory: ./core/release
        run: ./deploy_posix.sh x64 deploy

      - name: Build LSP server
        working-directory: ./tools/lsp/server
        env:
          OBJECK_ROOT: ../../..
        run: ./build_server.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install VS Code extension dependencies
        working-directory: ./tools/lsp/clients/vscode
        run: npm install

      - name: Update extension version
        working-directory: ./tools/lsp/clients/vscode
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          jq --arg v "$VERSION" '.version = $v' package.json > package.json.tmp && mv package.json.tmp package.json
          echo "✅ Extension version set to $VERSION"

      - name: Package VS Code extension
        working-directory: ./tools/lsp/clients/vscode
        run: npx vsce package --out objeck-lsp.vsix

      - name: Assemble LSP zip
        run: |
          LSP_DIR="objeck-lsp"
          mkdir -p "$LSP_DIR/bin" "$LSP_DIR/lib"

          # Server bytecode
          cp tools/lsp/clients/vscode/server/objeck_lsp.obe "$LSP_DIR/"

          # Runtime binary and standard libraries
          cp core/release/deploy/bin/obr "$LSP_DIR/bin/"
          cp core/release/deploy/lib/*.obl "$LSP_DIR/lib/"

          # Editor client configs
          cp -r tools/lsp/clients/vim "$LSP_DIR/"
          cp -r tools/lsp/clients/neovim "$LSP_DIR/"
          cp -r tools/lsp/clients/emacs "$LSP_DIR/"
          cp -r tools/lsp/clients/helix "$LSP_DIR/"
          cp -r tools/lsp/clients/sublime "$LSP_DIR/"

          # VS Code extension
          cp tools/lsp/clients/vscode/objeck-lsp.vsix "$LSP_DIR/"

          # Scripts
          cp -r tools/lsp/scripts "$LSP_DIR/"

          # Use 0.0.0 so the version rename tool in release-publish picks it up
          zip -r "objeck-lsp_0.0.0.zip" "$LSP_DIR"
          echo "✅ LSP package created: objeck-lsp_0.0.0.zip"

      - name: Upload LSP artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-lsp
          path: objeck-lsp_0.0.0.zip
          retention-days: 7

      - name: Upload VS Code extension artifact
        uses: actions/upload-artifact@v6
        with:
          name: vscode-extension
          path: tools/lsp/clients/vscode/objeck-lsp.vsix
          retention-days: 7

  # ============================================
  # Generate API Documentation
  # ============================================

  build-docs:
    name: Generate API Docs
    needs: prepare
    runs-on: ubuntu-latest
    # Skip for pre-release builds (test, rc, beta, alpha, etc.)
    # Pre-compiled libraries won't match pre-release versions
    # Only generate docs for official releases (no hyphen in version)
    if: "!contains(needs.prepare.outputs.version, '-')"

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # The artifact carries core/shared/version.h and core/release/update_version.ps1,
      # so its root is 'core/' -- unpack there, not into core/shared/.
      - name: Download version metadata
        uses: actions/download-artifact@v4
        with:
          name: version-metadata
          path: core/

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libopencv-dev \
            libmbedtls-dev \
            unixodbc-dev \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-ttf-dev \
            libsdl2-mixer-dev \
            libreadline-dev \
            libeigen3-dev \
            libmp3lame-dev \
            libnghttp2-dev \
            libngtcp2-dev \
            libngtcp2-crypto-gnutls-dev \
            libnghttp3-dev \
            libgnutls28-dev

      - name: Build compiler and runtime
        run: |
          cd core/release
          ./deploy_posix.sh x64

      - name: Recompile standard libraries
        working-directory: ./core/compiler
        run: |
          echo "Recompiling standard libraries with new compiler (update_version.sh)..."
          chmod +x update_version.sh
          ./update_version.sh
          echo "✅ Standard libraries recompiled"

          # Copy freshly compiled libraries to deploy directory
          cp ../lib/*.obl ../release/deploy/lib/
          echo "✅ Libraries copied to deploy"

      - name: Generate API documentation
        working-directory: ./core/release/deploy/bin
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          export OBJECK_LIB_PATH=$(pwd)/../lib

          # code_doc writes every page to a HARDCODED '../html/' -- relative to
          # obr's cwd, so core/release/deploy/html -- and it does NOT create that
          # directory. doc_html.obs builds its paths as GetClassLink(.., "../html/")
          # and opens them with FileWriter, which fails silently when the directory
          # is absent: the run prints "Writing API files...", spins through every
          # class, exits 0, and writes nothing.
          #
          # This step only ever created docs/api and then looked there, so on POSIX
          # it generated zero pages on every release. Nothing noticed because the old
          # packaging gate counted entries inside the tracked docs/api.zip, which the
          # checkout always supplies -- that is the undiagnosed cause of v2026.8.0's
          # docs shipping as the docs for v2026.8.1 and v2026.8.2. The current gate
          # counts generated files instead, so it finally failed here rather than
          # shipping stale docs a fourth time.
          #
          # code_doc64.cmd has always done this mkdir-then-copy; the POSIX path never
          # did. Mirror it.
          rm -rf ../html
          mkdir -p ../html
          mkdir -p ../../../../docs/api

          ./obc -src ../../../lib/code_doc/doc_html.obs,../../../lib/code_doc/doc_parser.obs \
            -lib cipher,json,xml,misc,net -dest code_doc.obe

          ./obr code_doc.obe \
            ../../../lib/code_doc/templates \
            "$VERSION" \
            ../../../compiler/lib_src/lang.obs \
            ../../../compiler/lib_src/regex.obs \
            ../../../compiler/lib_src/json_stream.obs \
            ../../../compiler/lib_src/json.obs \
            ../../../compiler/lib_src/xml.obs \
            ../../../compiler/lib_src/cipher.obs \
            ../../../compiler/lib_src/odbc.obs \
            ../../../compiler/lib_src/csv.obs \
            ../../../compiler/lib_src/query.obs \
            ../../../compiler/lib_src/sdl2.obs \
            ../../../compiler/lib_src/sdl_game.obs \
            ../../../compiler/lib_src/sdl_gl.obs \
            ../../../compiler/lib_src/gen_collect.obs \
            ../../../compiler/lib_src/concurrent.obs \
            ../../../compiler/lib_src/net_common.obs \
            ../../../compiler/lib_src/net.obs \
            ../../../compiler/lib_src/net_secure.obs \
            ../../../compiler/lib_src/net_server.obs \
            ../../../compiler/lib_src/net_h2.obs \
            ../../../compiler/lib_src/net_quic.obs \
            ../../../compiler/lib_src/web_server.obs \
            ../../../compiler/lib_src/rss.obs \
            ../../../compiler/lib_src/misc.obs \
            ../../../compiler/lib_src/diags.obs \
            ../../../compiler/lib_src/ml_core.obs \
            ../../../compiler/lib_src/ml_linear.obs \
            ../../../compiler/lib_src/ml_tree.obs \
            ../../../compiler/lib_src/ml_bayes.obs \
            ../../../compiler/lib_src/ml_neighbors.obs \
            ../../../compiler/lib_src/ml_cluster.obs \
            ../../../compiler/lib_src/ml_data.obs \
            ../../../compiler/lib_src/ai_search.obs \
            ../../../compiler/lib_src/ai_game.obs \
            ../../../compiler/lib_src/ai_optimize.obs \
            ../../../compiler/lib_src/ai_rl.obs \
            ../../../compiler/lib_src/openai.obs \
            ../../../compiler/lib_src/gemini.obs \
            ../../../compiler/lib_src/ollama.obs \
            ../../../compiler/lib_src/json_rpc.obs \
            ../../../compiler/lib_src/opencv.obs \
            ../../../compiler/lib_src/onnx.obs \
            ../../../compiler/lib_src/nlp.obs \
            ../../../compiler/lib_src/lame.obs

          # Move the generated tree to where the packaging step looks, and bring the
          # stylesheet and logos across as code_doc64.cmd does -- without style/ every
          # page renders unstyled.
          cp -r ../html/. ../../../../docs/api/
          mkdir -p ../../../../docs/api/style
          cp ../../../lib/code_doc/templates/resources/* ../../../../docs/api/style/

          echo "generated $(find ../../../../docs/api -name '*.html' | wc -l) HTML pages"

      - name: Package API documentation
        working-directory: ./docs
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"

          # Count what code_doc ACTUALLY generated, before any zip exists. The old
          # gate counted entries inside api.zip -- but docs/api.zip is tracked, so a
          # copy is always present from the checkout, and `zip -r` UPDATES it in
          # place rather than creating it fresh. When generation produced nothing,
          # zip wrote only the bare directory entry ("updating: api/ (stored 0%)")
          # and the gate then counted the 439 STALE entries already in the archive
          # and passed. That shipped v2026.8.0's docs as the docs for v2026.8.1 and
          # v2026.8.2 -- every non-windows-x64 deploy script unzips this committed
          # file straight into the shipped doc/ tree.
          GEN_COUNT=$(find api -name '*.html' 2>/dev/null | wc -l)
          if [ "$GEN_COUNT" -lt 50 ]; then
            echo "::error::code_doc generated only $GEN_COUNT HTML files (expected 50+)"
            exit 1
          fi

          # Build the archive FRESH. Never update the checked-in one.
          rm -f api.zip
          zip -r api.zip api/ > /dev/null

          HTML_COUNT=$(unzip -l api.zip | grep -c "\.html$" || true)
          if [ "$HTML_COUNT" -ne "$GEN_COUNT" ]; then
            echo "::error::packaged $HTML_COUNT HTML files but generated $GEN_COUNT -- archive does not match the generated tree"
            exit 1
          fi

          # Content, not just shape: assert the pages carry THIS release's version.
          # A well-formed archive built against the wrong version passes every
          # structural check, which is precisely how the stale docs went unnoticed.
          PAGE=$(find api -name '*.html' | head -1)
          STAMP=$(grep -o 'class="version">v[0-9.]*' "$PAGE" | head -1 | sed 's/.*>//')
          if [ -z "$STAMP" ]; then
            echo "::error::no version stamp found in $PAGE -- treat as failure, not a pass"
            exit 1
          fi
          if [ "$STAMP" != "v$VERSION" ]; then
            echo "::error::api docs stamp $STAMP but this release is v$VERSION"
            exit 1
          fi

          echo "✅ API documentation packaged: $HTML_COUNT HTML files, stamped $STAMP"

      - name: Commit api.zip to repo
        run: |
          cp docs/api.zip /tmp/api.zip
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git checkout -f master
          cp /tmp/api.zip docs/api.zip
          git add docs/api.zip
          git diff --cached --quiet && echo "api.zip unchanged" || \
            git commit -m "chore: update api.zip for v${{ needs.prepare.outputs.version }} [skip ci]"
          git push origin master || echo "Push skipped (no changes)"

      - name: Upload API docs
        uses: actions/upload-artifact@v6
        with:
          name: api-docs
          path: docs/api.zip
          retention-days: 7

  # ============================================
  # Release Summary
  # ============================================

  summary:
    name: Build Summary
    needs: [prepare, build, build-lsp, build-docs]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Generate build summary
        run: |
          echo "# 🚀 Release Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.prepare.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Version Number:** ${{ needs.prepare.outputs.version_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Build Status" >> $GITHUB_STEP_SUMMARY
          echo "- Windows x64: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Windows ARM64: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Linux x64: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Linux ARM64: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- macOS ARM64: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- LSP Package: ${{ needs.build-lsp.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- API Docs: ${{ needs.build-docs.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.build.result }}" = "success" ] && \
             [ "${{ needs.build-lsp.result }}" = "success" ] && \
             [ "${{ needs.build-docs.result }}" = "success" ]; then
            echo "✅ **All builds completed successfully!**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Next step: Run release-publish workflow to create GitHub Release" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Some builds failed. Please review logs.**" >> $GITHUB_STEP_SUMMARY
          fi
