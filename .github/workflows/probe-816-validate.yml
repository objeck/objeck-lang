name: probe-816-validate

# Validates the #816 conservative-mark fix on ubuntu-24.04-arm, where the P3b loop
# failed 24/150 before it: builds obr from this branch (the fix plus the fixture)
# and runs the loop 150 times. lib/ and obc come from master's CI build of the
# fix's base commit. Throwaway branch; never merged.

on:
  push:
    branches: [probe/816-validate]

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libmbedtls-dev zlib1g-dev

      - name: QUIC dependencies
        uses: ./.github/actions/quic-deps

      - name: Build obr from this branch
        run: |
          cd core/vm
          make -f make/Makefile.arm64 -j4 > build.log 2>&1 || { tail -60 build.log; exit 1; }
          ls -la obr
          grep -q "IsYoungObjectStart" arch/memory.h && echo "fix present in source"

      - name: Master's lib and obc (same base commit)
        uses: actions/download-artifact@v4
        with:
          name: objeck-linux-arm64
          run-id: 34789417040
          github-token: ${{ github.token }}
          path: tree

      - name: Fixture
        run: |
          chmod +x tree/bin/*
          cp core/vm/obr tree/bin/obr-fix
          export OBJECK_LIB_PATH="$PWD/tree/lib"
          tree/bin/obc -src programs/tests/map_insert_stress_816_mt.obs -lib gen_collect -opt s3 -dest mt.obe
          [ -f mt.obe ] || { echo "compile failed"; exit 1; }

      - name: 150 runs of P3b + frequent GC, every method compiled
        run: |
          set +e
          export OBJECK_LIB_PATH="$PWD/tree/lib"
          export OBJECK_JIT_THRESHOLD=1
          fail=0; start=$SECONDS; first=""
          for i in $(seq 1 150); do
            timeout 120 tree/bin/obr-fix --gc-threshold=64k mt.obe 20000 > last.txt 2>&1
            code=$?
            if [ $code -ne 0 ] || ! grep -q PASS last.txt; then
              fail=$((fail + 1)); [ -z "$first" ] && first="run $i exit $code: $(head -c 200 last.txt | tr '\n' ' ')"
            fi
          done
          line="| linux-arm64 fix P3b-gc64k jit1 | 150 | $fail fail | ${first:-none} | $((SECONDS - start)) s |"
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"
          exit 0
