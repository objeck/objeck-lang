name: CI Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# A new push to a pull request cancels the run still going for its older commit (every merge of master into a
# branch used to leave a full CI run behind it, which is what queued 70+ runs). Runs on master, tags and
# schedules are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every core/lib/*.obl built from source on one Linux job; the other jobs download them.
  libs:
    name: Libraries
    uses: ./.github/workflows/libs.yml

  build:
    name: Build ${{ matrix.platform }}
    needs: libs
    runs-on: ${{ matrix.os }}
    # Backstop so a hung test/step can never tie up a runner for the default
    # 6 hours (per-test timeouts in run_regression.sh are the first line of
    # defense; this caps the whole job). The Windows legs are not here: they are
    # the `windows` job below, split into parallel jobs by ci-windows.yml.
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds
          - platform: linux-x64
            # Pinned: ubuntu-latest became 26.04 on 2026-10-31, which links OpenCV 4.10 and mbedTLS 3.x
            # and would ship binaries older distributions cannot run (runtime_deps.json describes 24.04).
            os: ubuntu-24.04
            arch: x64
            deploy_script: ./deploy_posix.sh x64
            shell: bash

          # Linux ARM64 - using GitHub-hosted ARM64 runners (public preview)
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            arch: arm64
            deploy_script: ./deploy_posix.sh arm64
            shell: bash

          # macOS build (ARM64 native on Apple Silicon)
          - platform: macos-arm64
            os: macos-15
            arch: arm64
            deploy_script: ./deploy_macos_arm64.sh
            shell: bash

    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # The libraries, built once from source by the `libs` job (libs.yml). Today they are
    # also committed and `libs` fails on any byte of difference, so this overwrites each
    # file with an identical one; it is what the deploy scripts will find once the
    # .obl are no longer tracked (docs/DESIGN_OBL_FROM_SOURCE.md).
    - name: Download libraries
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: libs
        path: core/lib/

    # ============================================
    # Dependency Installation
    # ============================================

    # Linux dependencies with caching. Cache a USER-OWNED archive dir (~/apt-cache)
    # rather than the root-owned /var/cache/apt/archives -- restoring the latter as
    # the unprivileged runner fails with "tar: ...deb: Permission denied" (it can't
    # overwrite the root-owned .debs), which silently disabled the cache and spammed
    # the log with libopencv-*.deb errors. apt downloads into ~/apt-cache via
    # Dir::Cache::archives, so a cache hit skips re-downloading.
    - name: Cache APT packages (Linux)
      if: runner.os == 'Linux'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/apt-cache
        key: ${{ runner.os }}-${{ matrix.arch }}-apt-${{ hashFiles('.github/workflows/ci-build.yml') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.arch }}-apt-

    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      run: |
        mkdir -p ~/apt-cache/partial
        sudo bash tools/cicd/apt_harden.sh
        sudo apt-get update
        sudo apt-get install -y -o Dir::Cache::archives="$HOME/apt-cache" -o APT::Sandbox::User=root \
          build-essential \
          libopencv-dev \
          libmbedtls-dev \
          unixodbc-dev \
          libsqliteodbc \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-ttf-dev \
          libsdl2-mixer-dev \
          libegl1 \
          libegl-mesa0 \
          libgl1-mesa-dri \
          libreadline-dev \
          libeigen3-dev \
          libmp3lame-dev \
          ccache \
          expect
        # apt writes the .debs as root; make them runner-owned so the cache-save
        # step (which runs unprivileged) can read them without permission errors.
        sudo chown -R "$(id -u):$(id -g)" ~/apt-cache

    # The ODBC regression tests (odbc_sqlite_test, odbc_whole_values,
    # odbc_prepared_reuse, query_source_odbc, native_lib_gc_park's ODBC half)
    # open the objeck_sqlite_test data source: an in-memory SQLite database
    # behind the sqliteodbc driver. Each leg sets it up its own way -- this
    # ini on Linux, Homebrew plus ~/.odbc.ini on macOS, a per-user registry
    # DSN on Windows -- and every regression step below sets
    # OBJECK_REQUIRE_ODBC, under which a test that cannot open the data
    # source FAILS instead of printing SKIP. Until 2026-10 only Linux had the
    # data source, so three of the five legs skipped every ODBC test and
    # reported green; the require flag is what keeps that from recurring
    # silently.
    - name: Configure ODBC test DSN (Linux)
      if: runner.os == 'Linux'
      run: |
        echo '[objeck_sqlite_test]' >> ~/.odbc.ini
        echo 'Description=Objeck ODBC regression test DSN' >> ~/.odbc.ini
        echo 'Driver=SQLite3' >> ~/.odbc.ini
        echo 'Database=:memory:' >> ~/.odbc.ini

    # macOS dependencies with caching
    - name: Cache Homebrew downloads (macOS)
      if: runner.os == 'macOS'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/Library/Caches/Homebrew
          !~/Library/Caches/Homebrew/Backup
        key: ${{ runner.os }}-brew-downloads-${{ hashFiles('.github/workflows/ci-build.yml') }}
        restore-keys: |
          ${{ runner.os }}-brew-downloads-

    - name: Install macOS dependencies
      if: runner.os == 'macOS'
      run: |
        # A Backup/ restored from the downloads cache breaks relinking: when installing a
        # formula unlinks a conflicting one (openssl@3 over the image's openssl@4), brew
        # moves the old links into Backup/, and a stale Backup/bin/openssl there is "the
        # same file" -- sdl2_mixer's install failed that way on 2026-10-30.
        rm -rf ~/Library/Caches/Homebrew/Backup
        # Install only formulae that aren't already present. The hosted runner
        # preinstalls newer versions of some of these formulae (cmake), so a
        # plain `brew install` aborts with "already installed" (red CI error
        # annotations) even though the build is fine. Skip present packages and
        # install the rest, so genuine install failures still surface.
        for pkg in \
          cmake \
          unixodbc \
          sqliteodbc \
          sdl2 \
          sdl2_image \
          sdl2_ttf \
          sdl2_mixer \
          readline \
          eigen \
          ccache; do
          if brew list --versions "$pkg" >/dev/null 2>&1; then
            echo "✓ $pkg already installed — skipping"
          else
            brew install "$pkg"
          fi
        done
        brew cleanup

        # Add Homebrew bin to PATH (immediate + persistent)
        export PATH="/opt/homebrew/bin:$PATH"
        echo "/opt/homebrew/bin" >> $GITHUB_PATH


    - name: Select Xcode 16.3+ (macOS)
      if: runner.os == 'macOS'
      run: |
        # objectVersion 90 (matrix.xcodeproj) requires Xcode 16.3+
        XCODE_PATH=$(ls -d /Applications/Xcode_16.[3-9]*.app 2>/dev/null | sort -V | tail -1)
        if [ -z "$XCODE_PATH" ]; then
          XCODE_PATH=$(ls -d /Applications/Xcode_16.*.app 2>/dev/null | sort -V | tail -1)
        fi
        if [ -n "$XCODE_PATH" ]; then
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          echo "Selected: $XCODE_PATH"
        fi
        xcodebuild -version

    - name: Install Apple signing certificate
      if: runner.os == 'macOS'
      env:
        CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
        P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      run: |
        if [ -z "$CERTIFICATE_BASE64" ] || [ -z "$P12_PASSWORD" ] || [ -z "$KEYCHAIN_PASSWORD" ]; then
          echo "Apple signing secrets not configured - skipping"
          exit 0
        fi

        CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
        echo -n "$CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH

        KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
        security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
        security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

        security import $CERTIFICATE_PATH -P "$P12_PASSWORD" \
          -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
        security set-key-partition-list -S apple-tool:,apple:,codesign:,productsign: \
          -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
        security list-keychains -d user -s $KEYCHAIN_PATH

        rm "$CERTIFICATE_PATH"
        echo "Apple signing certificate installed."

    # obr links AWS-LC, ngtcp2, nghttp3 and nghttp2 statically: restore them
    # from cache or build them with tools/deps/build_quic_deps.sh.
    # macOS runs the build scripts with its own shells, and /bin/sh and /bin/bash
    # there are bash 3.2, which rejects syntax bash 5 accepts: a bare case pattern
    # inside $(...) parses as its closing paren. deploy_macos_arm64.sh once stopped
    # parsing that way while bash -n passed everywhere else.
    - name: Shell scripts parse under macOS bash 3.2
      if: runner.os == 'macOS'
      shell: bash
      run: |
        bad=0
        for s in core/release/*.sh tools/cicd/*.sh tools/deps/*.sh; do
          case "$(head -1 "$s")" in
            '#!/bin/sh'*) interp=/bin/sh ;;
            *) interp=/bin/bash ;;
          esac
          if ! out=$("$interp" -n "$s" 2>&1); then
            echo "::error file=$s::$interp -n failed: $out"
            bad=1
          fi
        done
        exit $bad

    - name: QUIC dependencies
      if: runner.os != 'Windows'
      uses: ./.github/actions/quic-deps

    # The macOS package carries static OpenCV, mbedTLS and libiodbc, the prebuilt
    # ONNX Runtime and a shared LAME inside itself: restore them from cache or
    # build them with tools/deps/build_macos_deps.sh.
    - name: macOS bundled libraries
      if: runner.os == 'macOS'
      uses: ./.github/actions/macos-bundle-deps

    # libobjk_odbc.dylib carries libiodbc statically, and iODBC reads a user's
    # data sources from ~/.odbc.ini (ODBCINI names the file explicitly); the
    # script points the DSN at Homebrew's libsqlite3odbc.dylib by full path.
    # After the bundled libraries, because the script proves the connection
    # through that very libiodbc (under $OBJECK_DEPS/macos-bundle/iodbc).
    - name: Configure ODBC test DSN (macOS)
      if: runner.os == 'macOS'
      run: |
        bash tools/cicd/setup_sqlite_odbc.sh
        echo "ODBCINI=$HOME/.odbc.ini" >> "$GITHUB_ENV"

    - name: Cache ccache
      if: runner.os != 'Windows'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.ccache
        key: ${{ runner.os }}-${{ matrix.arch }}-ccache-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.arch }}-ccache-

    - name: Setup ccache
      if: runner.os != 'Windows'
      run: |
        which ccache || { echo "ccache not found in PATH"; exit 1; }
        # PIN the cache directory, or nothing is ever cached between runs.
        #
        # The step above caches ~/.ccache. ccache 4.x uses that path only if it
        # ALREADY EXISTS, and otherwise $XDG_CACHE_HOME/ccache (~/.cache/ccache).
        # The directory only exists if a cache was restored, and a cache is only
        # saved if the directory has content -- so once there is no entry there
        # can never be one. Measured on 2026-10-13: zero ccache entries in the
        # repo, every run logging
        #   Cache not found for input keys: Linux-arm64-ccache-<sha>, Linux-arm64-ccache-
        # no matching "Cache saved with key" in post-job cleanup, and
        # `ccache --show-stats` reporting 0.0 / 0.5 GB with a 14.71% hit rate
        # from within the single build. Every CI compile has been cold.
        #
        # CCACHE_DIR in $GITHUB_ENV covers the build steps that follow; the
        # export covers the three commands below, which run before it takes
        # effect. mkdir -p is what actually breaks the cycle on a cold repo.
        echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
        export CCACHE_DIR="$HOME/.ccache"
        mkdir -p "$CCACHE_DIR"
        ccache --max-size=500M
        ccache --set-config=compression=true
        ccache --zero-stats
        ccache --show-config | grep -E '^\(.*\) cache_dir' || true

    # ============================================
    # Build Compiler Bootstrap (Linux x64 only)
    # ============================================

    - name: Build bootstrap (Linux x64 only)
      if: matrix.platform == 'linux-x64'
      working-directory: ./core/compiler
      run: ./update_version.sh

    # ============================================
    # Build Toolchain
    # ============================================

    - name: Build toolchain
      working-directory: ./core/release
      env:
        CC: ${{ runner.os == 'Linux' && 'ccache gcc' || '' }}
        CXX: ${{ runner.os == 'Linux' && 'ccache g++' || '' }}
      run: ${{ matrix.deploy_script }}

    # Prove the macOS distribution is self-contained.
    #
    # The deploy bundles SDL2 into lib/sdl and rewrites install names to @rpath,
    # replacing the old instructions that told users to untar a tarball into
    # /usr/local. The deploy script already fails if an absolute SDL2 path
    # survives, but "no absolute paths" and "actually loads from our tree" are
    # different claims -- this runner has Homebrew SDL2 at /opt/homebrew, so a
    # broken @rpath could still be masked by a lucky fallback.
    #
    # DYLD_PRINT_LIBRARIES makes dyld name every library it loads, so we can
    # assert WHICH libSDL2 was used. That is as close as CI can get to the thing
    # we cannot test here: unpacking a release on a Mac with no Homebrew.
    - name: Verify macOS SDL2 bundling
      if: matrix.platform == 'macos-arm64'
      working-directory: ./core/release/deploy
      run: |
        echo "--- libobjk_sdl.dylib dependencies ---"
        otool -L lib/native/libobjk_sdl.dylib | sed 's/^/  /'

        if otool -L lib/native/libobjk_sdl.dylib | grep -q "/usr/local/lib/libSDL2"; then
          echo "FAIL: still references /usr/local/lib for SDL2"
          exit 1
        fi

        echo "--- bundled dylibs ---"
        ls -1 lib/sdl/*.dylib | sed 's/^/  /'

        # Every @rpath dependency must exist in lib/sdl
        for dep in $(otool -L lib/native/libobjk_sdl.dylib | awk '/@rpath\/libSDL2/ {print $1}'); do
          base=$(basename "$dep")
          if [ ! -f "lib/sdl/$base" ]; then
            echo "FAIL: $base is needed via @rpath but is not in lib/sdl"
            exit 1
          fi
        done

        # Which libSDL2 does dyld actually pick? Run the GL test and look.
        echo "--- runtime resolution ---"
        cd bin
        # Compile it here: this step runs before the suite's own compile step,
        # so the .obe does not exist yet.
        ./obc -src ../../../../programs/regression/gl_context_test.obs \
              -lib cipher,collect,xml,json,sdl2,sdl_gl -dest /tmp/glt.obe
        DYLD_PRINT_LIBRARIES=1 OBJECK_GL_REQUIRED=1 ./obr /tmp/glt.obe 2>&1 \
          | grep -i "libSDL2" | head -5 | sed 's/^/  /' > /tmp/sdl_loaded.txt || true
        cat /tmp/sdl_loaded.txt

        if grep -q "/opt/homebrew" /tmp/sdl_loaded.txt; then
          echo "FAIL: loaded SDL2 from Homebrew, not from the distribution."
          echo "      The @rpath bundling is not doing its job; an end user"
          echo "      without Homebrew would get a load failure."
          exit 1
        fi
        if [ ! -s /tmp/sdl_loaded.txt ]; then
          echo "NOTE: dyld printed no libSDL2 line; cannot confirm the source."
        else
          echo "OK: SDL2 resolved from inside the distribution"
        fi

    # ============================================
    # Rebuild Libraries (non-bootstrap platforms)
    # ============================================

    - name: Rebuild libraries (Linux ARM64)
      if: matrix.platform == 'linux-arm64'
      working-directory: ./core/compiler
      run: |
        chmod +x update_version_arm.sh
        ./update_version_arm.sh

    - name: Rebuild libraries (macOS ARM64)
      if: matrix.platform == 'macos-arm64'
      working-directory: ./core/compiler
      run: |
        chmod +x update_version_arm.sh
        ./update_version_arm.sh

    - name: Update deploy with rebuilt libraries
      if: matrix.platform != 'linux-x64'
      shell: bash
      working-directory: ./core/release
      run: |
        if [ -d "deploy-${{ matrix.arch }}" ]; then
          DEPLOY_LIB="deploy-${{ matrix.arch }}/lib"
        elif [ -d "deploy" ]; then
          DEPLOY_LIB="deploy/lib"
        else
          echo "Deploy directory not found, skipping lib copy"
          exit 0
        fi
        echo "Copying rebuilt libraries to $DEPLOY_LIB..."
        cp ../lib/*.obl "$DEPLOY_LIB/"
        echo "Done"

    - name: Show ccache stats
      if: runner.os != 'Windows'
      run: ccache --show-stats

    # ============================================
    # Determine Deploy Directory
    # ============================================

    - name: Set deploy directory
      id: deploy-dir
      shell: bash
      working-directory: ./core/release
      run: |
        if [ -d "deploy-${{ matrix.arch }}" ]; then
          echo "dir=deploy-${{ matrix.arch }}" >> $GITHUB_OUTPUT
        elif [ -d "deploy" ]; then
          echo "dir=deploy" >> $GITHUB_OUTPUT
        else
          echo "ERROR: Deploy directory not found"
          ls -la
          exit 1
        fi

    # The system libraries this tree links must be exactly the ones
    # core/release/runtime_deps.json declares -- the list the docs gate holds
    # every install instruction to. A new dependency fails here until it is
    # declared (and so documented); a declared one nothing links fails too.
    - name: Declared runtime dependencies match the build (POSIX)
      if: runner.os != 'Windows'
      shell: bash
      run: python3 tools/cicd/check_docs_deps.py --artifacts "core/release/${{ steps.deploy-dir.outputs.dir }}" --platform ${{ matrix.platform }}

    # #893: the linux-arm64 tree must run on a baseline ARMv8.0 CPU with no SVE. The
    # makefiles used -mcpu=native, this runner has SVE2, and so the published 9.4
    # tarball died with SIGILL ("cnth" at Execute+64) on a Raspberry Pi 4/5, Graviton2,
    # Snapdragon X or Apple silicon under Linux -- while every test here passed,
    # because the tests ran on the machine that built it. QEMU user-mode emulation of
    # a Cortex-A72 (ARMv8.0-A, the Pi 4's core) rejects any instruction newer than
    # that baseline, in the compiled VM and in JIT-emitted code alike.
    - name: Runs on a baseline ARMv8.0 CPU without SVE (linux-arm64)
      if: matrix.platform == 'linux-arm64'
      shell: bash
      run: |
        sudo bash tools/cicd/apt_harden.sh
        sudo apt-get install -y -q qemu-user >/dev/null 2>&1 || {
          sudo apt-get update -q >/dev/null && sudo apt-get install -y -q qemu-user >/dev/null; }
        TREE="$PWD/core/release/${{ steps.deploy-dir.outputs.dir }}"
        export OBJECK_LIB_PATH="$TREE/lib"
        CPU="qemu-aarch64 -cpu cortex-a72"
        work=$(mktemp -d)
        cat > "$work/baseline.obs" <<'OBS'
        class Baseline {
          function : Main(args : String[]) ~ Nil {
            "baseline cpu ok"->PrintLine();
          }
        }
        OBS
        $CPU "$TREE/bin/obc" -src "$work/baseline.obs" -dest "$work/baseline.obe"
        out=$($CPU "$TREE/bin/obr" "$work/baseline.obe")
        if [ "$out" != "baseline cpu ok" ]; then
          echo "::error::obr did not run on an emulated Cortex-A72 (no SVE): '$out'"
          exit 1
        fi
        # a JIT-heavy test in both modes: JIT-emitted code must stay within ARMv8.0 too
        $CPU "$TREE/bin/obc" -src programs/regression/core_arithmetic.obs -lib cipher,collect,xml,json -dest "$work/arith.obe"
        for jit in off 1; do
          if ! $CPU "$TREE/bin/obr" --jit=$jit "$work/arith.obe" > "$work/out.txt" 2>&1; then
            cat "$work/out.txt"
            echo "::error::core_arithmetic failed on a Cortex-A72 (--jit=$jit)"
            exit 1
          fi
          if grep -q FAIL "$work/out.txt"; then
            cat "$work/out.txt"
            echo "::error::core_arithmetic reported FAIL on a Cortex-A72 (--jit=$jit)"
            exit 1
          fi
        done
        echo "obc and obr run on an emulated Cortex-A72 (ARMv8.0-A, no SVE), JIT off and on"

    # ============================================
    # Test Suite
    # ============================================

    - name: Compile tests
      working-directory: ./core/release/${{ steps.deploy-dir.outputs.dir }}/bin
      shell: bash
      run: |
        if [ "${{ runner.os }}" = "Windows" ]; then
          OBC="./obc.exe"
        else
          OBC="./obc"
          chmod +x obc obr obd obi 2>/dev/null || true
        fi

        # Verify compiler exists
        if [ ! -f "$OBC" ]; then
          echo "ERROR: Compiler not found: $OBC"
          ls -la
          exit 1
        fi

        # Verify library directory
        LIB_DIR="../lib"
        if [ ! -d "$LIB_DIR" ]; then
          echo "ERROR: Library directory not found: $LIB_DIR"
          exit 1
        fi

        echo "Compiler found: $OBC"
        echo "Library directory: $LIB_DIR"

        # Set library path for macOS
        if [ "${{ runner.os }}" = "macOS" ]; then
          export DYLD_LIBRARY_PATH="$(pwd)/../lib:$DYLD_LIBRARY_PATH"
          echo "Set DYLD_LIBRARY_PATH for macOS"
        fi

        echo "Testing basic compilation..."
        echo "Working directory: $(pwd)"
        ls -la "$LIB_DIR" | head -20

        # Basic tests for all platforms
        # each example compiles with the -lib line in its own header, so a wrong
        # line in what readers copy fails here
        $OBC -src ../../../../programs/deploy/hello_0.obs || exit 1
        $OBC -src ../../../../programs/deploy/functions_3.obs || exit 1
        $OBC -src ../../../../programs/deploy/errors_6.obs || exit 1
        $OBC -lib xml -src ../../../../programs/deploy/xml_15.obs || exit 1

        echo "Basic tests compiled successfully"

        # Extended tests for Linux x64 only
        if [ "${{ matrix.platform }}" = "linux-x64" ]; then
          echo "Compiling extended tests..."
          $OBC -src ../../../../programs/deploy/values_1.obs || exit 1
          $OBC -src ../../../../programs/deploy/closures_8.obs || exit 1
          $OBC -lib cipher -src ../../../../programs/deploy/strings_10.obs || exit 1
          $OBC -src ../../../../programs/deploy/collections_11.obs || exit 1
          $OBC -lib regex -src ../../../../programs/deploy/regex_17.obs || exit 1
          $OBC -lib query,misc,net,json,regex,xml,csv,cipher -src ../../../../programs/deploy/sql_tables_18.obs || exit 1
          $OBC -lib csv,ml -src ../../../../programs/deploy/ml_outliers_27.obs || exit 1
          $OBC -lib nlp -src ../../../../programs/deploy/nlp_28.obs || exit 1
          $OBC -lib concurrent -src ../../../../programs/deploy/threads_12.obs || exit 1
          $OBC -lib cipher,net,gen_collect,net_h2 -src ../../../../programs/tests/prgm_http2.obs || exit 1
          $OBC -lib cipher,net,gen_collect,net_quic -src ../../../../programs/tests/prgm_http3.obs || exit 1
          $OBC -lib cipher,net,gen_collect,net_quic -src ../../../../programs/tests/http3_downgrade_test.obs || exit 1
          $OBC -lib cipher,net,gen_collect,net_h2 -src ../../../../programs/tests/http_header_echo_test.obs || exit 1
          echo "Extended tests compiled successfully"
        fi

    - name: Run tests
      working-directory: ./core/release/${{ steps.deploy-dir.outputs.dir }}/bin
      shell: bash
      run: |
        if [ "${{ runner.os }}" = "Windows" ]; then
          OBR="./obr.exe"
        else
          OBR="./obr"
        fi

        # Basic tests
        $OBR ../../../../programs/deploy/hello_0.obe
        $OBR ../../../../programs/deploy/functions_3.obe
        $OBR ../../../../programs/deploy/errors_6.obe
        $OBR ../../../../programs/deploy/xml_15.obe

        # Extended tests for Linux x64
        if [ "${{ matrix.platform }}" = "linux-x64" ]; then
          $OBR ../../../../programs/deploy/values_1.obe
          $OBR ../../../../programs/deploy/closures_8.obe
          $OBR ../../../../programs/deploy/strings_10.obe
          $OBR ../../../../programs/deploy/collections_11.obe
          $OBR ../../../../programs/deploy/regex_17.obe
          $OBR ../../../../programs/deploy/sql_tables_18.obe
          $OBR ../../../../programs/deploy/ml_outliers_27.obe
          $OBR ../../../../programs/deploy/nlp_28.obe
          # One run, no retry: the workers' locking makes the total exact, so a run that
          # exits non-zero, hangs or prints another total is a real failure to look at.
          # (A retry here hid failures, and the exit code alone missed a wrong total.)
          out=$(timeout 120 $OBR ../../../../programs/deploy/threads_12.obe 2>&1) || { echo "$out"; echo "threads_12.obe failed (exit status or timeout)"; exit 1; }
          echo "$out"
          if ! echo "$out" | grep -qx 'shared total: 5000050000'; then
            echo "threads_12.obe: the shared total is not 5000050000"
            exit 1
          fi
        fi
        # NOTE: HTTP/2 and HTTP/3 tests are intentionally NOT here. They depend
        # on live upstream servers and run as a separate non-gating step below.

    # Measures how often threads_12 goes wrong on the runner, so a flake is a number in the
    # job summary rather than a retry nobody sees. Non-gating: the gating run is above.
    - name: threads_12 flake rate (non-gating)
      if: matrix.platform == 'linux-x64'
      continue-on-error: true
      working-directory: ./core/release/${{ steps.deploy-dir.outputs.dir }}/bin
      shell: bash
      run: |
        runs=50
        bad=0
        for i in $(seq 1 $runs); do
          # into a variable first: grep -q on a pipe can close it early and fail obr with SIGPIPE
          out=$(timeout 120 ./obr ../../../../programs/deploy/threads_12.obe 2>&1) || out=""
          if ! echo "$out" | grep -qx 'shared total: 5000050000'; then
            bad=$((bad + 1))
          fi
        done
        echo "threads_12: $bad of $runs runs wrong or failed" | tee -a "$GITHUB_STEP_SUMMARY"
        if [ "$bad" -ne 0 ]; then
          echo "::warning::threads_12 went wrong in $bad of $runs runs"
        fi

    # ============================================
    # Regression Tests
    # ============================================

    - name: Build native ONNX library (Linux x64)
      if: matrix.platform == 'linux-x64'
      working-directory: ./core/lib/onnx/eq
      shell: bash
      run: |
        # The C++ that actually talks to ONNX Runtime was built by NO job on any
        # platform -- CI only compiled onnx.obs -> onnx.obl. That blind spot is how
        # ONNX came to be completely broken on Linux and MSYS2 (the CUDA arm called
        # AppendExecutionProvider("CUDA", ...), which ORT rejects, and the catch
        # returned without setting the session handle, so it surfaced as a silently
        # null session rather than an error).
        #
        # Both arms are built deliberately: they are separate #elif branches, so a
        # build of one proves nothing about the other. A broken CUDA branch once
        # passed a clean Windows build for exactly that reason -- Windows compiles
        # only the DML arm.
        chmod +x build.sh
        for mode in cpu cuda; do
          echo "=== build.sh $mode ==="
          rm -f libobjk_onnx.so
          ./build.sh "$mode"
          if [ ! -f libobjk_onnx.so ]; then
            echo "::error::native ONNX build ($mode) produced no library"
            exit 1
          fi
          echo "  libobjk_onnx.so: $(stat -c%s libobjk_onnx.so) bytes"
        done

    - name: Run regression tests (POSIX)
      if: runner.os != 'Windows'
      working-directory: ./programs/regression
      # Temporary: surface generic type-arg state to diagnose the intermittent
      # bad_generic_arg_mismatch miss (prints [generic-diag] lines during compile).
      env:
        OBJECK_DIAG_GENERICS: "1"
        # Turns gl_context_test.obs from "skip when no GL" into "fail when
        # no GL". These three legs do reach a 3.3 core context -- Linux via
        # Mesa offscreen/EGL, macOS via cocoa -- so losing it is a
        # regression, not an environment quirk. Windows runs the .cmd step
        # below and keeps skipping: its stock GL is 1.1, so a 3.3 core
        # request cannot succeed without Mesa being installed there.
        OBJECK_GL_REQUIRED: "1"
        # Same for the ODBC tests: every leg has the objeck_sqlite_test data
        # source (see "Configure ODBC test DSN"), so a skip is a broken setup.
        OBJECK_REQUIRE_ODBC: "1"
      run: |
        chmod +x run_regression.sh
        ARCH="${{ matrix.arch }}"
        echo "Running regression tests for architecture: $ARCH"
        ./run_regression.sh $ARCH

    # A second pass with every method compiled on its first call. The default
    # threshold compiles a method on its tenth call (or on entry when it has a
    # loop), so most of the suite runs interpreted and a JIT bug in a method
    # called a few times never runs compiled here. The frame-layout bug of
    # #761 (a declared-but-unreferenced local shifted every lower slot under
    # the collector) crashed mcp_debug_test only in this mode, and only this
    # mode had never run in CI. Every leg runs it. It used to be one x64 leg
    # per OS, on the grounds that the bug class is platform-independent, but
    # AMD64 and ARM64 are separate backends and Windows and POSIX take
    # different branches inside each: #781's constant-character store wrote
    # 8 bytes on ARM64 and on Linux x64 through two different helpers, and
    # the ARM64 legs had never run this mode. The suite takes about three
    # minutes a leg, so the pass costs minutes.
    - name: Run regression tests with every method compiled (POSIX)
      if: runner.os != 'Windows'
      working-directory: ./programs/regression
      env:
        OBJECK_JIT_THRESHOLD: "1"
        OBJECK_GL_REQUIRED: "1"
        OBJECK_REQUIRE_ODBC: "1"
      run: ./run_regression.sh ${{ matrix.arch }}

    - name: Run debugger tests (POSIX)
      if: runner.os != 'Windows'
      working-directory: ./programs/regression
      run: |
        chmod +x run_debugger_tests.sh
        ARCH="${{ matrix.arch }}"
        echo "Running debugger tests for architecture: $ARCH"
        ./run_debugger_tests.sh $ARCH

    - name: Run DAP tests (POSIX)
      if: runner.os != 'Windows'
      working-directory: ./programs/regression
      run: |
        ARCH="${{ matrix.arch }}"
        BIN="../../core/release/deploy-$ARCH/bin"
        if [ ! -d "$BIN" ]; then BIN="../../core/release/deploy/bin"; fi
        echo "Running DAP tests with bin: $BIN"
        python3 run_dap_tests.py "$BIN"

    # VM flags: interpreter/JIT equivalence, value validation, one usage text.
    - name: Run VM flag tests (POSIX)
      if: runner.os != 'Windows'
      working-directory: ./programs/regression
      run: |
        ARCH="${{ matrix.arch }}"
        BIN="../../core/release/deploy-$ARCH/bin"
        if [ ! -d "$BIN" ]; then BIN="../../core/release/deploy/bin"; fi
        python3 run_vm_flag_tests.py "$BIN"

    # llm_eval is a research harness (tools/llm_eval), not a shipped library: its tests
    # compile the source together with each test instead of linking an .obl.
    - name: Run llm_eval harness tests (POSIX)
      if: runner.os != 'Windows'
      run: |
        ARCH="${{ matrix.arch }}"
        BIN="core/release/deploy-$ARCH/bin"
        if [ ! -d "$BIN" ]; then BIN="core/release/deploy/bin"; fi
        python3 tools/llm_eval/run_tests.py "$BIN"

    # GC root coverage (advisory): 30 generated programs that keep references live in loops,
    # pending expression temporaries, inlined callees, ?-> regions, fields and threads, run
    # interpreted, default-JIT, compile-everything and under a 64k nursery with the roots audit
    # and the heap verifier; every run must print what an uncollected run printed.
    # tools/gc_roots/README.md. Advisory until it has run clean long enough to rule out flakiness.
    - name: GC root coverage, 30 seeds (advisory, POSIX)
      if: runner.os != 'Windows'
      continue-on-error: true
      timeout-minutes: 20
      run: |
        ARCH="${{ matrix.arch }}"
        BIN="core/release/deploy-$ARCH/bin"
        if [ ! -d "$BIN" ]; then BIN="core/release/deploy/bin"; fi
        rc=0
        python3 tools/gc_roots/run_roots.py --bin "$BIN" --mode ci --count 30 --start "$(date -u +%Y%m%d)" -j 4 --out gc_roots_out || rc=$?
        if [ "$rc" != "0" ]; then
          echo "::warning title=GC root coverage::advisory run diverged or failed (exit $rc); not blocking. Seeds: $(cat gc_roots_out/summary.json 2>/dev/null | tr -d '\n ')"
          cat gc_roots_out/seed_*/report.txt 2>/dev/null | head -60 || true
        fi
        exit $rc

    - name: Upload GC root coverage findings
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: gc-roots-findings-${{ runner.os }}-${{ matrix.arch }}
        path: gc_roots_out/
        if-no-files-found: ignore
        retention-days: 14

    # Negative testing of the compiler front end. Valid programs are broken in sixteen ways and
    # hostile files (deep nesting, random bytes, 20000 errors, a call nested 30 deep to a method
    # that does not exist) are compiled: no crash, no hang, and the error must be on or beside
    # the mutation without a cascade. Nesting used to overflow the compiler's stack and the
    # nested call took exponential time; the gates are in the script's header.
    - name: Compiler robustness, mutation and stress (POSIX)
      if: runner.os != 'Windows'
      working-directory: ./programs/regression
      run: |
        ARCH="${{ matrix.arch }}"
        BIN="../../core/release/deploy-$ARCH/bin"
        if [ ! -d "$BIN" ]; then BIN="../../core/release/deploy/bin"; fi
        python3 run_compiler_robustness.py "$BIN"

    # obi evaluates code in-process through the module build -- also the embedding
    # API -- a separate compilation of the VM sources with its own macros and link
    # line. It lacked HTTP/2 and HTTP/3 for as long as obr has had them, and nothing
    # noticed (#897). Run one program under both and fail if they disagree. Parity,
    # not presence: a leg without HTTP/3 in either binary is consistent and passes.
    - name: obi matches obr on compiled-in protocols (POSIX)
      if: runner.os != 'Windows'
      working-directory: ./programs/regression
      run: |
        ARCH="${{ matrix.arch }}"
        BIN="../../core/release/deploy-$ARCH/bin"
        if [ ! -d "$BIN" ]; then BIN="../../core/release/deploy/bin"; fi
        python3 check_obi_obr_parity.py "$BIN"

    # API.Inference over a real HTTP round trip, both protocols.
    #
    # programs/regression/inference_client_test.obs asserts the request body
    # through Client->DescribeRequest, which needs no server -- so it cannot
    # establish that a server ACCEPTS that body, or that a real response is
    # parsed back into the right tensors. tools/cicd/mock_inference_server.py is
    # a strict mock of KServe v2 and TensorFlow Serving v1 that rejects anything
    # malformed with a 400, and the suite asserts that it rejected NOTHING.
    #
    # Demonstrated to catch what the offline test cannot: making the v2 response
    # reader take only the first output tensor leaves the DescribeRequest test
    # passing and fails this one.
    #
    # GATING, unlike the network tests below: it reaches nothing but 127.0.0.1,
    # so there is no upstream to go down. Every platform, because whether the
    # HTTP client behaves the same everywhere is the question -- and Windows
    # loopback has its own history (#669).
    - name: API.Inference round trip (POSIX)
      if: runner.os != 'Windows'
      run: |
        ARCH="${{ matrix.arch }}"
        BIN="core/release/deploy-$ARCH/bin"
        if [ ! -d "$BIN" ]; then BIN="core/release/deploy/bin"; fi
        LIB="$(dirname "$BIN")/lib"
        OBJECK_LIB_PATH="$LIB" "$BIN/obc" \
          -src programs/tests/inference_round_trip.obs \
          -lib models,inference,net,json,cipher,gen_collect \
          -dest programs/tests/inference_round_trip.obe
        python3 tools/cicd/mock_inference_server.py --selftest
        python3 tools/cicd/test_inference_round_trip.py "$BIN"

    # A library that uses the array copy constructor (`Int->New[src]`) built fine
    # and then killed obc on the program build: the .obl carried the callee's
    # library-local ids, the consuming build missed them and dereferenced a
    # map::end(). SIGSEGV, no message, no output file (#958). No shipped library
    # uses the construct, so the regression suite never reached it -- this builds
    # one that does, for all four element types, then links and runs it.
    - name: a library's array copy constructor survives linking (POSIX)
      if: runner.os != 'Windows'
      working-directory: ./programs/regression
      run: |
        ARCH="${{ matrix.arch }}"
        BIN="../../core/release/deploy-$ARCH/bin"
        if [ ! -d "$BIN" ]; then BIN="../../core/release/deploy/bin"; fi
        python3 check_lib_array_copy.py "$BIN"

    # A library built with `-debug` carries a line number in every instruction.
    # The .obl writer puts it after the type byte and the reader took it before,
    # so the library linked into scrambled code and the program was refused at
    # load. Every shipped library is built without -debug, so nothing reached it.
    - name: a library built with -debug links and runs (POSIX)
      if: runner.os != 'Windows'
      working-directory: ./programs/regression
      run: |
        ARCH="${{ matrix.arch }}"
        BIN="../../core/release/deploy-$ARCH/bin"
        if [ ! -d "$BIN" ]; then BIN="../../core/release/deploy/bin"; fi
        python3 check_lib_debug_symbols.py "$BIN"

    # An .obe compiled by another toolchain version is refused by the loader
    # before it runs; the message must name both versions, say which side is
    # stale and say to recompile. Built by patching a fresh .obe's VER_NUM, so
    # both directions are covered and nothing committed rots at the next bump.
    - name: obr refuses an .obe from another toolchain version with a clear message (POSIX)
      if: runner.os != 'Windows'
      working-directory: ./programs/regression
      run: |
        ARCH="${{ matrix.arch }}"
        BIN="../../core/release/deploy-$ARCH/bin"
        if [ ! -d "$BIN" ]; then BIN="../../core/release/deploy/bin"; fi
        python3 check_obe_version_mismatch.py "$BIN"

    # The library reader checks every read against the end of the inflated file; a damaged
    # .obl must end in an error message, never an out-of-bounds read or a crash.
    - name: obc refuses a truncated or corrupt library with a clear message (POSIX)
      if: runner.os != 'Windows'
      working-directory: ./programs/regression
      run: |
        ARCH="${{ matrix.arch }}"
        BIN="../../core/release/deploy-$ARCH/bin"
        if [ ! -d "$BIN" ]; then BIN="../../core/release/deploy/bin"; fi
        python3 check_obl_truncated.py "$BIN"

    # A function value packs the class and method ids into 16-bit fields. A method id >=
    # 32768 used to sign-extend into the class and tag bits; ids past 65535 now fail the build.
    - name: a function reference to a high method id works; past 65535 is refused (POSIX)
      if: runner.os != 'Windows'
      working-directory: ./programs/regression
      run: |
        ARCH="${{ matrix.arch }}"
        BIN="../../core/release/deploy-$ARCH/bin"
        if [ ! -d "$BIN" ]; then BIN="../../core/release/deploy/bin"; fi
        python3 check_funcref_range.py "$BIN"

    # The MCP server library speaks newline-delimited JSON-RPC on standard input and output:
    # a scripted client starts a server process and covers the handshake, every method, the
    # JSON-RPC errors, a request cancelled in flight and megabyte messages (no network).
    - name: the MCP server answers a scripted stdio client (POSIX)
      if: runner.os != 'Windows'
      working-directory: ./programs/regression
      run: |
        ARCH="${{ matrix.arch }}"
        BIN="../../core/release/deploy-$ARCH/bin"
        if [ ! -d "$BIN" ]; then BIN="../../core/release/deploy/bin"; fi
        python3 mcp_stdio_test.py "$BIN"

    # The typed client generator (tools/mcp/mcp_stubs.obs): it reads a server's tools over stdio, writes
    # Objeck source, and that source equals a golden file, compiles with a program that calls it, and runs.
    - name: the MCP stub generator writes a client that compiles and works (POSIX)
      if: runner.os != 'Windows'
      working-directory: ./programs/regression
      run: |
        ARCH="${{ matrix.arch }}"
        BIN="../../core/release/deploy-$ARCH/bin"
        if [ ! -d "$BIN" ]; then BIN="../../core/release/deploy/bin"; fi
        python3 mcp_stubs_test.py "$BIN"

    # '@tool' doc comments (docs/design/MCP_FIRST_CLASS.md): what the compiler says about a tool it cannot make,
    # and what the scanner must leave alone (tags in strings and other comments, CRLF, a megabyte comment).
    - name: the MCP tool tag diagnostics hold (POSIX)
      if: runner.os != 'Windows'
      working-directory: ./programs/regression
      run: |
        ARCH="${{ matrix.arch }}"
        BIN="../../core/release/deploy-$ARCH/bin"
        if [ ! -d "$BIN" ]; then BIN="../../core/release/deploy/bin"; fi
        python3 mcp_tool_tags_diag_test.py "$BIN"

    # 'obr --mcp' and 'obr --mcp-http' (docs/design/MCP_FIRST_CLASS.md, Stage 3): a program's tools, resources and prompts
    # served with no server code; stdio in three execution modes, hostile input, HTTP, the refusals.
    - name: obr --mcp serves a program's tools (POSIX)
      if: runner.os != 'Windows'
      working-directory: ./programs/regression
      run: |
        ARCH="${{ matrix.arch }}"
        BIN="../../core/release/deploy-$ARCH/bin"
        if [ ! -d "$BIN" ]; then BIN="../../core/release/deploy/bin"; fi
        python3 mcp_launch_test.py "$BIN"

    # A build of several files reports each file's errors together, in the order the
    # files were given, rather than interleaved by line number.
    - name: obc reports a multi-file build's errors file by file (POSIX)
      if: runner.os != 'Windows'
      working-directory: ./programs/regression
      run: |
        ARCH="${{ matrix.arch }}"
        BIN="../../core/release/deploy-$ARCH/bin"
        if [ ! -d "$BIN" ]; then BIN="../../core/release/deploy/bin"; fi
        python3 check_multifile_diagnostics.py "$BIN"

    # OBJECK_TLS_INSECURE_SKIP_VERIFY disables certificate verification process-wide; the first
    # secure client connection prints one stderr warning.
    - name: obr warns once when TLS verification is switched off (POSIX)
      if: runner.os != 'Windows'
      working-directory: ./programs/regression
      run: |
        ARCH="${{ matrix.arch }}"
        BIN="../../core/release/deploy-$ARCH/bin"
        if [ ! -d "$BIN" ]; then BIN="../../core/release/deploy/bin"; fi
        python3 check_tls_insecure_warning.py "$BIN"

    # A jump to a label the optimizer cannot find, or a label defined twice, is an internal
    # compiler error and must stop the build, not be read through a dangling iterator.
    # The label pass has a test hook (OBJECK_TEST_LABEL_FAULT) that simulates both.
    - name: obc refuses a lost or duplicated jump label (POSIX)
      if: runner.os != 'Windows'
      working-directory: ./programs/regression
      run: |
        ARCH="${{ matrix.arch }}"
        BIN="../../core/release/deploy-$ARCH/bin"
        if [ ! -d "$BIN" ]; then BIN="../../core/release/deploy/bin"; fi
        python3 check_label_fatal.py "$BIN"

    # Deeply nested source (parentheses, blocks, calls, subscripts, unary operators, generic types at 100, 250,
    # 500 and 5000 levels) is compiled or refused with "Nesting is too deep", never a crash or a hang. The
    # level the limit trips at is a stack budget and moves with the parser's frames, so no level or column
    # is pinned. 100 nested subscripts never finished compiling before the index analysis was made linear.
    - name: obc compiles or refuses deep nesting, never crashes (POSIX)
      if: runner.os != 'Windows'
      working-directory: ./programs/regression
      run: |
        ARCH="${{ matrix.arch }}"
        BIN="../../core/release/deploy-$ARCH/bin"
        if [ ! -d "$BIN" ]; then BIN="../../core/release/deploy/bin"; fi
        python3 check_nesting_limit.py "$BIN"

    # Select statements hand out jump label ids in a fixed order. They used to take three
    # `++conditional_label` from one argument list, whose evaluation order C++ leaves open: g++
    # went right to left, Apple clang left to right, so the same source compiled to different
    # jump operands on arm64 than on x64 (8 of the libraries differed from the committed set).
    # This compiles a fixture of select statements at -opt s0 with -asm and compares the listing
    # with one produced on x64, so the leg that builds with a different compiler notices.
    - name: select statements emit the same jump labels on every compiler (POSIX)
      if: runner.os != 'Windows'
      working-directory: ./programs/regression
      run: |
        ARCH="${{ matrix.arch }}"
        BIN="../../core/release/deploy-$ARCH/bin"
        if [ ! -d "$BIN" ]; then BIN="../../core/release/deploy/bin"; fi
        python3 check_select_label_order.py "$BIN"

    # Large generated programs (thousands of classes, methods, statements, literals, interpolated
    # strings) are answered within a generous ceiling: a change that makes a shape of source
    # quadratic shows up as minutes here. 16,000 interpolated strings in one method took 73 s.
    - name: obc answers large generated programs within a ceiling (POSIX)
      if: runner.os != 'Windows'
      working-directory: ./programs/regression
      run: |
        ARCH="${{ matrix.arch }}"
        BIN="../../core/release/deploy-$ARCH/bin"
        if [ ! -d "$BIN" ]; then BIN="../../core/release/deploy/bin"; fi
        python3 check_compile_time_ceiling.py "$BIN"

    # With OBJECK_LIB_PATH unset the library directory is resolved against the executable,
    # not the working directory.
    - name: obc and obr find their libraries from another working directory (POSIX)
      if: runner.os != 'Windows'
      working-directory: ./programs/regression
      run: |
        ARCH="${{ matrix.arch }}"
        BIN="../../core/release/deploy-$ARCH/bin"
        if [ ! -d "$BIN" ]; then BIN="../../core/release/deploy/bin"; fi
        python3 check_lib_path_anchor.py "$BIN"

    # Named arguments reach a library method through the parameter names its .obl
    # records; skipping a middle default goes through the method's mask forwarder,
    # which only a library build generates. No shipped library has a method that
    # exercises it without native code, so this builds one (#1244, phase 2).
    - name: named arguments reach a library's methods (POSIX)
      if: runner.os != 'Windows'
      working-directory: ./programs/regression
      run: |
        ARCH="${{ matrix.arch }}"
        BIN="../../core/release/deploy-$ARCH/bin"
        if [ ! -d "$BIN" ]; then BIN="../../core/release/deploy/bin"; fi
        python3 check_lib_named_args.py "$BIN"

    # A library records where its methods' own type parameters stand, so a call
    # into it infers them: a library generic function returns its caller's type,
    # not its bound (#1242, phase 2). This builds such a library.
    - name: a library's generic methods infer their type arguments (POSIX)
      if: runner.os != 'Windows'
      working-directory: ./programs/regression
      run: |
        ARCH="${{ matrix.arch }}"
        BIN="../../core/release/deploy-$ARCH/bin"
        if [ ! -d "$BIN" ]; then BIN="../../core/release/deploy/bin"; fi
        python3 check_lib_generic_methods.py "$BIN"

    # A chain of calls on a library generic class ('source->AddString(..)->
    # AddInt(..)', each returning ObjectSource<T>) keeps the receiver's type
    # arguments; the second call was checked against the raw 'T'. Only a
    # library build shows it, so this builds one.
    - name: a library generic class's call chain keeps its type arguments (POSIX)
      if: runner.os != 'Windows'
      working-directory: ./programs/regression
      run: |
        ARCH="${{ matrix.arch }}"
        BIN="../../core/release/deploy-$ARCH/bin"
        if [ ! -d "$BIN" ]; then BIN="../../core/release/deploy/bin"; fi
        python3 check_lib_generic_chain.py "$BIN"

    # `Vector[]<T>` as a parameter built fine inside a library and resolved for
    # callers inside it, but a program that linked the library was told the method
    # did not exist: the signature came back out of the .obl with its array
    # dimension missing, so `Vector[]<IntRef>` read as `Vector<IntRef>` (#998).
    # ParseGenerics leaves the index ON the closing '>' and ParseParameters did
    # not step past it, so the dimension scan saw '>' where it wanted '*'. Return
    # position went through ParseType, which already consumed it -- which is why
    # the same type worked as a return value and failed as a parameter. Only a
    # library round trip shows it; in one program nothing is ever encoded.
    - name: a generic array parameter survives the .obl round trip (POSIX)
      if: runner.os != 'Windows'
      working-directory: ./programs/regression
      run: |
        ARCH="${{ matrix.arch }}"
        BIN="../../core/release/deploy-$ARCH/bin"
        if [ ! -d "$BIN" ]; then BIN="../../core/release/deploy/bin"; fi
        python3 check_generic_array_param.py "$BIN"

    # Every prompt in the REPL read a line without checking the read. At EOF the
    # two loops spun forever instead of leaving, and the one-shot prompts acted on
    # a line nobody typed (#917). Each invocation here reaches a prompt whose input
    # has ended, and has to exit 0 on its own.
    - name: obi exits at stdin EOF (POSIX)
      if: runner.os != 'Windows'
      working-directory: ./programs/regression
      run: |
        ARCH="${{ matrix.arch }}"
        BIN="../../core/release/deploy-$ARCH/bin"
        if [ ! -d "$BIN" ]; then BIN="../../core/release/deploy/bin"; fi
        python3 check_obi_stdin_eof.py "$BIN"

    # Console->ReadLine returned an empty string at the end of input, forever, so a
    # loop on `line <> Nil` never ended. It now returns Nil there and "" only for a
    # blank line. The regression runner cannot set a test's stdin, so this feeds
    # each case in.
    - name: Console ReadLine returns Nil at EOF (POSIX)
      if: runner.os != 'Windows'
      working-directory: ./programs/regression
      run: |
        ARCH="${{ matrix.arch }}"
        BIN="../../core/release/deploy-$ARCH/bin"
        if [ ! -d "$BIN" ]; then BIN="../../core/release/deploy/bin"; fi
        python3 check_console_eof.py "$BIN"

    # Console->ReadBuffer into a Char[] copied to the start of the array and ignored
    # the offset (as did the file, pipe and socket variants). The runner cannot set
    # a test's stdin, so this feeds it in.
    - name: Console ReadBuffer honours the offset (POSIX)
      if: runner.os != 'Windows'
      working-directory: ./programs/regression
      run: |
        ARCH="${{ matrix.arch }}"
        BIN="../../core/release/deploy-$ARCH/bin"
        if [ ! -d "$BIN" ]; then BIN="../../core/release/deploy/bin"; fi
        python3 check_console_read_offset.py "$BIN"

    # Console->WriteBuffer of a Byte[] wrote from the start of the array and ignored
    # the offset (found by the Char[] / Byte[] length audit). The runner cannot
    # capture a test's own standard output, so this reads it.
    - name: Console WriteBuffer honours the offset (POSIX)
      if: runner.os != 'Windows'
      working-directory: ./programs/regression
      run: |
        ARCH="${{ matrix.arch }}"
        BIN="../../core/release/deploy-$ARCH/bin"
        if [ ! -d "$BIN" ]; then BIN="../../core/release/deploy/bin"; fi
        python3 check_console_write_offset.py "$BIN"

    # obu updater: offline end-to-end against fake releases (no network). Builds
    # obu with the test hooks, then exercises 'check' -- which runs everywhere,
    # Windows included -- plus the update/rollback swap and the command-injection
    # PoC wherever obu implements the in-place swap.
    #
    # Windows had NO updater coverage before this: 'check' is the only command
    # supported there, and it used to bypass the OBU_RELEASE_JSON_FILE hook
    # entirely, so there was nothing offline to test. On Windows the update
    # suite reports PENDING and asserts the not-supported contract instead, so
    # this step fails loudly if that message changes without the suite being
    # switched on.
    - name: Run updater tests
      if: matrix.platform == 'linux-x64'
      shell: bash
      run: |
        if [ "${{ runner.os }}" != "Windows" ]; then export CXX=g++; fi
        PY=python3
        command -v python3 >/dev/null 2>&1 || PY=python
        "$PY" core/utils/updater/test_update.py

        # And the signature verification added for #723 phase 3. Separate from
        # the suite above because it holds a different thing: not that obu can
        # install a release, but that it refuses one whose manifest was
        # substituted. Both directions are asserted -- a real signature
        # accepted, and a missing, tampered, truncated, unparseable or prehashed
        # one rejected, plus a tampered trusted comment -- because a verifier
        # that always returns true is a silent total failure, and a suite of
        # reject cases alone would pass against one that always returns false.
        #
        # The fixtures are signed with the release key and committed; a
        # signature is public data, so this needs no secret and no minisign.
        # The binary under test is the RELEASE build -- no OBU_TEST_HOOKS, so
        # it trusts only the key compiled into it, which is what makes the
        # accept case meaningful. The paths differ per platform: deploy_posix.sh
        # builds in place under core/utils/updater, MSBuild writes under
        # vs/<plat>/Release. Checked in order, and an empty result is an ERROR,
        # not a skip -- a guard that quietly finds no binary is no guard.
        # The suffix is explicit because `test -f` is not trustworthy here:
        # MSYS's stat() falls back to <name>.exe, so [ -f .../bin/obu ] is TRUE
        # on Windows when only obu.exe exists -- and the extensionless path then
        # reaches Python, which opens files natively and cannot find it.
        SFX=
        if [ "${{ runner.os }}" = "Windows" ]; then SFX=.exe; fi
        OBU_BIN=
        for cand in core/release/deploy-${{ matrix.arch }}/bin/obu$SFX \
                    core/release/deploy/bin/obu$SFX \
                    core/utils/updater/obu$SFX \
                    core/utils/updater/vs/x64/Release/obu.exe \
                    core/utils/updater/vs/ARM64/Release/obu.exe; do
          if [ -f "$cand" ]; then OBU_BIN="$cand"; break; fi
        done
        if [ -z "$OBU_BIN" ]; then
          echo "No obu binary found to verify against; the build step above should have produced one."
          exit 1
        fi
        echo "Verifying signature handling with $OBU_BIN"
        "$PY" tools/cicd/test_obu_verify.py "$OBU_BIN"

    # cov_scan.sh's large-submission flow, against a mock Coverity Scan. Above
    # 500 MB the single-shot form POST stops working and the script switches to
    # initialize -> PUT -> enqueue; the capture is at about a third of that, so
    # a normal run never reaches the code. Without this it would first execute
    # on the day it is needed (#941). Runs on Linux only -- cov_scan.cmd still
    # refuses an oversized archive with a message naming the limit.
    - name: Coverity large-submission flow (mock)
      if: matrix.platform == 'linux-x64'
      run: python3 core/release/cov_scan_test.py

    # PtrSet is the old generation's membership structure: a fault here is a
    # use-after-free or a lost object, not a wrong answer, so it is tested on its
    # own rather than only through the collector. Covers growth, erase-during-
    # iteration (the sweep's pattern), tombstone reuse, and count() being safe to
    # call with a value that is not a pointer -- which ForwardedAddr relies on.
    - name: Old-generation set unit tests
      if: runner.os != 'Windows'
      run: |
        g++ -O2 -std=c++17 -Wall -Wextra -o /tmp/ptr_set_test core/vm/arch/ptr_set_test.cpp
        /tmp/ptr_set_test

    # The old generation's free-block cache hands out the head of a size class's
    # list without checking it, so the class rounding rules are its correctness:
    # a request maps to a class at least its size, a freed block to one at most
    # its size. A slip in either hands an object a block too small for it.
    - name: Free-block size class unit tests
      if: runner.os != 'Windows'
      run: |
        g++ -O2 -std=c++17 -Wall -Wextra -o /tmp/size_class_test core/vm/arch/size_class_test.cpp
        /tmp/size_class_test

    # Both JIT backends divide by a constant with a multiply by a "magic" pair
    # (magic_div.h). A wrong pair is a wrong quotient in compiled code only, so
    # the pair is checked against the machine's division for every divisor the
    # method covers, INT64_MIN and INT64_MAX included.
    - name: JIT constant-division unit tests
      if: runner.os != 'Windows'
      run: |
        g++ -O2 -std=c++17 -Wall -Wextra -o /tmp/magic_div_test core/vm/arch/jit/magic_div_test.cpp
        /tmp/magic_div_test

    # Pure-logic unit test for the phi3 token sampler (no ONNX Runtime/model).
    - name: Run ONNX sampling unit test (POSIX)
      if: matrix.platform == 'linux-x64'
      shell: bash
      run: |
        g++ -std=c++17 -Wall -Wextra -O2 \
          core/lib/onnx/eq/test/test_phi3_sampling.cpp -o /tmp/test_phi3_sampling
        /tmp/test_phi3_sampling

    # Pure-logic unit test for the SCRFD anchor decode (no ONNX Runtime/model).
    # Face detection returned zero results for every image at every threshold
    # from v2026.5.3 through v2026.8.1 -- the stride guard compared a row count
    # against an element count -- and nothing could catch it: no ONNX demo runs
    # in CI, and the InsightFace models are excluded by .gitignore. This test
    # needs neither, and fails on that exact defect.
    - name: Run ONNX SCRFD decode unit test (POSIX)
      if: matrix.platform == 'linux-x64'
      shell: bash
      run: |
        g++ -std=c++17 -Wall -Wextra -O2 \
          core/lib/onnx/eq/test/test_scrfd_decode.cpp -o /tmp/test_scrfd_decode
        /tmp/test_scrfd_decode

    # Cache the SCRFD detector so the integration check below does not refetch
    # ~17 MB on every run. Keyed by release tag: the asset is immutable.
    - name: Cache InsightFace SCRFD model (linux-x64)
      if: matrix.platform == 'linux-x64'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /tmp/face-assets
        # Word-like on purpose: a token such as "det10g" mixes letters and
        # digits enough for gitleaks' generic-api-key rule to score it as a
        # secret and fail the Secret Scan on a plain cache key.
        key: insightface-scrfd-detector-v0.7

    # Integration check for the ONNX face pipeline (quarantined / non-gating).
    #
    # The unit test above covers the decode in isolation. It cannot see the seam
    # where the real defect lived: whether the MODEL's actual output tensors
    # still match what the decoder expects. Face detection returned zero results
    # for every image from v2026.5.3 through v2026.8.1 at exactly that seam.
    #
    # The InsightFace models (191 MB) and test photographs are excluded from the
    # repository by .gitignore, so this step fetches what it needs. It is
    # continue-on-error for the same reason the network tests are: an upstream
    # outage must not redden the whole matrix, while the step's own badge and
    # the run summary still surface a real regression.
    - name: Run ONNX face detection integration test (non-gating)
      if: matrix.platform == 'linux-x64'
      continue-on-error: true
      shell: bash
      run: |
        set -o pipefail
        ASSETS=/tmp/face-assets
        mkdir -p "$ASSETS"

        # SCRFD detector only -- the 167 MB ArcFace recognizer is not needed to
        # prove the detect path decodes real model output.
        if [ ! -f "$ASSETS/det_10g.onnx" ]; then
          echo "Fetching buffalo_l (SCRFD detector)..."
          curl -fsSL --retry 3 --retry-delay 5 -o "$ASSETS/buffalo_l.zip" \
            https://github.com/deepinsight/insightface/releases/download/v0.7/buffalo_l.zip || {
              echo "SKIP: could not download buffalo_l.zip (upstream unavailable)"; exit 0; }
          unzip -o -j "$ASSETS/buffalo_l.zip" '*det_10g.onnx' -d "$ASSETS" >/dev/null || {
              echo "SKIP: buffalo_l.zip did not contain det_10g.onnx"; exit 0; }
          rm -f "$ASSETS/buffalo_l.zip"
        fi

        # A face photograph. Public domain (US federal government work).
        if [ ! -f "$ASSETS/face.jpg" ]; then
          curl -fsSL --retry 3 --retry-delay 5 -o "$ASSETS/face.jpg" \
            https://upload.wikimedia.org/wikipedia/commons/8/8d/President_Barack_Obama.jpg || {
              echo "SKIP: could not download the test photograph"; exit 0; }
        fi

        DEPLOY="$(pwd)/core/release/${{ steps.deploy-dir.outputs.dir }}"
        export OBJECK_LIB_PATH="$DEPLOY/lib"
        export LD_LIBRARY_PATH="$DEPLOY/lib/native:${LD_LIBRARY_PATH:-}"

        cd programs/frameworks/opencv_onnx
        "$DEPLOY/bin/obc" -src test_face_detect.obs \
          -lib opencv,onnx,cipher,json -dest /tmp/test_face_detect.obe

        # Exit non-zero on a real failure so the step badge reflects reality;
        # continue-on-error keeps it from reddening the matrix.
        "$DEPLOY/bin/obr" /tmp/test_face_detect.obe "$ASSETS/det_10g.onnx" "$ASSETS/face.jpg" 1

    # ============================================
    # Network Tests (quarantined / non-gating)
    #
    # HTTP/2 (nghttp2) and HTTP/3 (ngtcp2/QUIC) tests hit LIVE upstream servers
    # and fail for reasons outside this repo: upstream 5xx/429, or UDP egress
    # blocked on the runner. continue-on-error keeps a transient outage from
    # reding the whole matrix; the step's own badge + the run summary still
    # surface real regressions so they aren't silently ignored.
    # ============================================

    - name: Run network tests (non-gating)
      if: matrix.platform == 'linux-x64'
      continue-on-error: true
      working-directory: ./core/release/${{ steps.deploy-dir.outputs.dir }}/bin
      shell: bash
      run: |
        if [ "${{ runner.os }}" = "Windows" ]; then
          OBR="./obr.exe"
          # These .obe are pre-built only on linux-x64 (see "Compile tests").
          # Build them here rather than in the gating step so a missing library
          # cannot redden the build -- this step is continue-on-error.
          ./obc.exe -lib cipher,net,gen_collect,net_h2 -src ../../../../programs/tests/prgm_http2.obs || true
          ./obc.exe -lib cipher,net,gen_collect,net_quic -src ../../../../programs/tests/prgm_http3.obs || true
          ./obc.exe -lib cipher,net,gen_collect,net_quic -src ../../../../programs/tests/http3_downgrade_test.obs || true
          ./obc.exe -lib cipher,net,gen_collect,net_h2 -src ../../../../programs/tests/http_header_echo_test.obs || true
        else
          OBR="./obr"
        fi
        status=0

        {
          echo "### Network tests (non-gating) — ${{ matrix.platform }}"
          echo ""
          echo "| Result | Test | Note |"
          echo "| :----: | :--- | :--- |"
        } >> "$GITHUB_STEP_SUMMARY"

        run_net() {
          local name="$1" obe="$2" out
          echo "=== $name ==="
          if [ ! -f "$obe" ]; then
            echo "| ⏭️ | $name | not built on this platform |" >> "$GITHUB_STEP_SUMMARY"
            return
          fi
          if ! out=$("$OBR" "$obe" 2>&1); then
            echo "$out"
            echo "| ⚠️ | $name | VM exited non-zero (upstream/network?) |" >> "$GITHUB_STEP_SUMMARY"
            status=1
            return
          fi
          echo "$out"
          if echo "$out" | grep -q "FAIL"; then
            echo "| ❌ | $name | reported FAIL |" >> "$GITHUB_STEP_SUMMARY"
            status=1
          elif echo "$out" | grep -q "SKIP"; then
            # Not a pass. The test ran but never exercised the protocol -- no
            # engine compiled in, or no route to the host. Surfaced so absent
            # coverage cannot masquerade as green.
            echo "| ⏭️ | $name | SKIPPED - protocol not exercised |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| ✅ | $name | passed |" >> "$GITHUB_STEP_SUMMARY"
          fi
        }

        run_net "HTTP/2" ../../../../programs/tests/prgm_http2.obe
        run_net "HTTP/3" ../../../../programs/tests/prgm_http3.obe
        run_net "HTTP/3 downgrade" ../../../../programs/tests/http3_downgrade_test.obe
        run_net "Header echo" ../../../../programs/tests/http_header_echo_test.obe
        echo "" >> "$GITHUB_STEP_SUMMARY"

        if [ $status -ne 0 ]; then
          echo "::warning::Network tests reported failures (non-gating); see run summary"
        fi
        # Exit non-zero so the step badge reflects reality; continue-on-error
        # above keeps the overall job green.
        exit $status

    # A crash in a regression test reaches the log as one line -- "runtime error
    # (exit 134)" -- with no frames. macOS writes a full backtrace for every
    # SIGABRT/SIGSEGV to DiagnosticReports, so collecting those turns a
    # macOS-only crash from a guess-and-push-to-CI loop into a single read.
    # onnx_runtime_test's teardown abort was diagnosed without one; the next
    # one should not have to be.
    # Install the package this build produces on this runner, with Homebrew moved
    # aside, the way a user's Mac gets it. v2026.6.3 through v2026.9.2 shipped an
    # obr that could not start without Homebrew libraries and a hand-built ngtcp2
    # backend, and no CI job ever installed the package.
    - name: macOS package install test
      if: matrix.platform == 'macos-arm64'
      shell: bash
      run: |
        cd core/release
        OUTPUT_DIR="$RUNNER_TEMP/pkg" ./create_macos_pkg.sh 0.0.0
        bash ../../tools/cicd/macos_install_test.sh "$RUNNER_TEMP/pkg/objeck-macos-arm64_0.0.0.pkg" "$GITHUB_WORKSPACE/programs/regression"

    - name: Collect macOS crash reports (on failure)
      if: failure() && matrix.platform == 'macos-arm64'
      continue-on-error: true
      run: |
        dest=programs/regression/results/crash-reports
        mkdir -p "$dest"
        for d in "$HOME/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports; do
          [ -d "$d" ] || continue
          find "$d" -maxdepth 1 -type f -name '*.ips' -exec cp {} "$dest/" \; 2>/dev/null || true
          find "$d" -maxdepth 1 -type f -name '*.crash' -exec cp {} "$dest/" \; 2>/dev/null || true
        done
        count=$(ls -1 "$dest" 2>/dev/null | wc -l | tr -d ' ')
        echo "collected $count crash report(s)"
        if [ "$count" = "0" ]; then
          echo "::warning::No crash reports found; the failure may not have been a crash"
        fi

    - name: Upload regression logs (on failure)
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: regression-logs-${{ matrix.platform }}
        path: programs/regression/results/**
        retention-days: 7
        if-no-files-found: ignore

    # Every example that ships compiles with the '-lib' line README.md prints
    # beside it. The table is what a reader copies, so a wrong column is a
    # broken first experience of the language -- and nothing checked it before:
    # check_examples_index.py verifies an example is LISTED, not that the
    # listing works. Linux x64 only, since the examples are platform-neutral
    # and the SDL/ODBC ones only need to link, not run.
    - name: Shipped examples compile with their documented libraries
      if: matrix.platform == 'linux-x64'
      env:
        OBJECK_LIB_PATH: ${{ github.workspace }}/core/release/${{ steps.deploy-dir.outputs.dir }}/lib
      run: python3 programs/deploy/build_examples.py

    # ============================================
    # API Documentation (Linux x64 only)
    # ============================================

    - name: Generate API documentation
      if: matrix.platform == 'linux-x64'
      working-directory: ./core/release/${{ steps.deploy-dir.outputs.dir }}/bin
      run: |
        mkdir -p ../../../../docs/api
        ./obc -src ../../../lib/code_doc/doc_html.obs,../../../lib/code_doc/doc_parser.obs \
          -lib cipher,json,xml,misc,net -dest code_doc.obe

        set -o pipefail
        ./obr code_doc.obe \
          ../../../lib/code_doc/templates \
          ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0' }} \
          ../../../compiler/lib_src/lang.obs \
          ../../../compiler/lib_src/regex.obs \
          ../../../compiler/lib_src/json_stream.obs \
          ../../../compiler/lib_src/json.obs \
          ../../../compiler/lib_src/xml.obs \
          ../../../compiler/lib_src/cipher.obs \
          ../../../compiler/lib_src/odbc.obs \
          ../../../compiler/lib_src/csv.obs \
          ../../../compiler/lib_src/math.obs \
          ../../../compiler/lib_src/query.obs \
          ../../../compiler/lib_src/query_server.obs \
          ../../../compiler/lib_src/query_ml.obs \
          ../../../compiler/lib_src/query_odbc.obs \
          ../../../compiler/lib_src/query_vision.obs \
          ../../../compiler/lib_src/sdl2.obs \
          ../../../compiler/lib_src/sdl_game.obs \
          ../../../compiler/lib_src/sdl_gl.obs \
          ../../../compiler/lib_src/gen_collect.obs \
          ../../../compiler/lib_src/concurrent.obs \
          ../../../compiler/lib_src/actor.obs \
          ../../../compiler/lib_src/net_common.obs \
          ../../../compiler/lib_src/net.obs \
          ../../../compiler/lib_src/net_secure.obs \
          ../../../compiler/lib_src/net_h2.obs \
          ../../../compiler/lib_src/net_quic.obs \
          ../../../compiler/lib_src/net_server.obs \
          ../../../compiler/lib_src/rss.obs \
          ../../../compiler/lib_src/misc.obs \
          ../../../compiler/lib_src/diags.obs \
          ../../../compiler/lib_src/ml_core.obs \
          ../../../compiler/lib_src/ml_linear.obs \
          ../../../compiler/lib_src/ml_tree.obs \
          ../../../compiler/lib_src/ml_bayes.obs \
          ../../../compiler/lib_src/ml_neighbors.obs \
          ../../../compiler/lib_src/ml_cluster.obs \
          ../../../compiler/lib_src/ml_data.obs \
          ../../../compiler/lib_src/ml_svm.obs \
          ../../../compiler/lib_src/ml_outlier.obs \
          ../../../compiler/lib_src/ml_embed.obs \
          ../../../compiler/lib_src/ml_lab.obs \
          ../../../compiler/lib_src/ml_boost.obs \
          ../../../compiler/lib_src/ml_vector.obs \
          ../../../compiler/lib_src/ml_report.obs \
          ../../../compiler/lib_src/ml_verify.obs \
          ../../../compiler/lib_src/ml_timeseries.obs \
          ../../../compiler/lib_src/ml_timeseries_models.obs \
          ../../../compiler/lib_src/ml_timeseries_arima.obs \
          ../../../compiler/lib_src/ml_timeseries_eval.obs \
          ../../../compiler/lib_src/ml_cnn.obs \
          ../../../compiler/lib_src/nlp_topics_text.obs \
          ../../../compiler/lib_src/nlp_topics_lda.obs \
          ../../../compiler/lib_src/nlp_topics_metrics.obs \
          ../../../compiler/lib_src/nlp_topics_viz.obs \
          ../../../compiler/lib_src/plot.obs \
          ../../../compiler/lib_src/plot_sdl.obs \
          ../../../compiler/lib_src/stats.obs \
          ../../../compiler/lib_src/telemetry.obs \
          ../../../compiler/lib_src/ai_search.obs \
          ../../../compiler/lib_src/ai_game.obs \
          ../../../compiler/lib_src/ai_optimize.obs \
          ../../../compiler/lib_src/ai_rl.obs \
          ../../../compiler/lib_src/openai.obs \
          ../../../compiler/lib_src/gemini.obs \
          ../../../compiler/lib_src/ollama.obs \
          ../../../compiler/lib_src/anthropic.obs \
          ../../../compiler/lib_src/llm_util.obs \
          ../../../compiler/lib_src/agent.obs \
          ../../../compiler/lib_src/actor_agents.obs \
          ../../../compiler/lib_src/mcp.obs \
          ../../../compiler/lib_src/mcp_agent.obs \
          ../../../compiler/lib_src/rag.obs \
          ../../../compiler/lib_src/rag_adapters.obs \
          ../../../compiler/lib_src/json_rpc.obs \
          ../../../compiler/lib_src/models.obs \
          ../../../compiler/lib_src/opencv.obs \
          ../../../compiler/lib_src/onnx.obs \
          ../../../compiler/lib_src/inference.obs \
          ../../../compiler/lib_src/nlp.obs \
          ../../../compiler/lib_src/nlp_onnx.obs \
          ../../../compiler/lib_src/ml_clip.obs \
          ../../../compiler/lib_src/ai_hub.obs \
          ../../../compiler/lib_src/lame.obs \
          ../../../compiler/lib_src/web_server.obs 2>&1 | tee code_doc.log
        # A doc comment the parser rejects drops its member from the API reference, and
        # code_doc still exits 0: two GLWindow members shipped undocumented for weeks that
        # way (issue #729), and a bundle comment with a code fence (mcp_agent.obs) passed
        # because it prints '*** Unable to parse bundle block' rather than an ERROR line.
        # check_code_doc_log.py knows every failure output. Refuse to package such a build.
        python3 ../../../../tools/cicd/check_code_doc_log.py code_doc.log

    # Proves the guard above can fail: a bundle comment with a code fence must be flagged,
    # and every library source must be clean.
    - name: Code doc guard catches a bad bundle comment
      if: matrix.platform == 'linux-x64'
      run: python3 tools/cicd/check_code_doc_log.py --fixture core/release/${{ steps.deploy-dir.outputs.dir }}/bin

    - name: Package API documentation
      if: matrix.platform == 'linux-x64'
      working-directory: ./docs
      run: |
        zip -r api.zip api/

    - name: Upload API documentation
      if: matrix.platform == 'linux-x64'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: api-docs
        path: docs/api.zip
        retention-days: 7

    - name: Clean up signing keychain
      if: always() && runner.os == 'macOS'
      run: |
        if [ -f "$RUNNER_TEMP/app-signing.keychain-db" ]; then
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
        fi

    # ============================================
    # Upload Build Artifacts
    # ============================================

    - name: Upload build artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: objeck-${{ matrix.platform }}
        path: |
          core/release/${{ steps.deploy-dir.outputs.dir }}/bin/*
          core/release/${{ steps.deploy-dir.outputs.dir }}/lib/*
        retention-days: 7

  # The Windows legs: ci-windows.yml builds the toolchain once per platform, then runs the
  # regression suite as parallel shards (both passes in each), the VM flag tests, the debugger and
  # DAP tests and the other checks as their own jobs. They are a separate workflow, not matrix legs of
  # `build`, because a matrix leg cannot wait for only its own platform's sibling jobs. Check names
  # read "Build windows-x64 / Compile", "... / Regression shard 3 of 6" and "... / Result".
  windows:
    name: Build ${{ matrix.platform }}
    needs: libs
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-x64, windows-arm64]
    uses: ./.github/workflows/ci-windows.yml
    with:
      platform: ${{ matrix.platform }}

  # ============================================
  # Editor tooling: formatter, LSP server, VS Code extension
  # ============================================

  # No `needs:` — this runs alongside the platform matrix and finishes long
  # before it, so tooling breakage surfaces early. It builds only core/vm and
  # core/compiler (the perf-gate.yml dependency set: no OpenCV/SDL/ODBC) and
  # pairs them with the .obl libraries committed under core/lib.
  tools:
    name: Tools (formatter, LSP, VS Code extension)
    needs: libs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download libraries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: libs
          path: core/lib/

      # First, because it needs nothing built and fails in seconds. Five files
      # hard-code the list of core/compiler/lib_src/*.obs and nothing keeps them
      # in step; they had already drifted unnoticed -- one list was missing two
      # libraries and still named a third that had been deleted, so the counts
      # matched while the API docs and the editor index were both incomplete.
      - name: Library lists agree with lib_src
        run: python3 tools/cicd/check_doc_lists.py

      # Same family, found the same way -- by noticing something documented was
      # not in the reference. doc_parser.obs parses a doc comment's code fence
      # last and then requires the comment to end, so anything written after the
      # ``` block is discarded; for a method that drops the member from the API
      # docs entirely, with the build still exiting 0. Twenty comments were in
      # that state, and GL->GetLastError(), Mesh->GetRadius() and
      # Texture->Checker() were missing from the shipped v2026.8.4 reference.
      - name: Doc comments end with their code fence
        run: python3 tools/cicd/check_doc_fences.py

      # Same class of guard, same cost: nothing built, fails in seconds. The
      # regression runners score a test on its exit code alone, so one that
      # prints "FAIL: ..." and then returns normally from Main is counted as a
      # PASS. 125 of the 168 asserting tests were in exactly that state, and two
      # were failing while it went unnoticed -- a run reporting "195 passed,
      # 3 skipped, 2 failed" was really 193/3/4, and the four real failures were
      # all one open defect that had looked confined to a single test.
      - name: Regression tests can report failure
        run: python3 tools/cicd/check_test_exit_codes.py

      # Same class of guard. '# JIT_DISABLE' on its own line runs a test with the
      # JIT off. The runners used to match it as a substring, which turned off the
      # JIT for five tests whose comments merely mentioned it, and twenty real
      # opt-outs never said why (2026-09-09). Every directive now needs a stated
      # reason, and prose may not quote the marker.
      - name: JIT opt-outs are directives with a stated reason
        run: python3 tools/cicd/check_jit_optouts.py

      # An intrinsic is wired through traps.h, the scanner, the parser, the code
      # generator and the VM's ProcessTrap, and nothing connected them: a missing
      # ProcessTrap case builds, links, and kills the first program that runs the
      # trap, and an edit to the dead second copy of the parser (deleted in this
      # change) changed nothing. Enumerators with no VM case need a written reason.
      # The --test run mutates the real sources and fails unless each break is caught.
      - name: Every VM trap has a handler and every intrinsic is parsed
        run: |
          python3 tools/cicd/check_trap_handlers.py --test
          python3 tools/cicd/check_trap_handlers.py
          python3 tools/cicd/gen_trap_signatures.py --check

      # What an opcode carries was written out by hand in the writer, both readers,
      # the label passes, the inliner and the loader's checks, and nothing compared
      # them. core/shared/instr_info.h is the one description; this fails when a site
      # disagrees with it (docs/INSTRUCTION_SET.md). ADVISORY for now: continue-on-error
      # keeps a mismatch from reddening the job while the first findings are triaged.
      # The --test run breaks each site in memory and fails unless the checker notices.
      - name: The instruction table agrees with every site that restates it (advisory)
        continue-on-error: true
        run: |
          python3 tools/cicd/check_instr_table.py --test
          python3 tools/cicd/check_instr_table.py

      # Same class of guard, for a rule that was previously prose only. A native
      # library may store an object it ALLOCATED anywhere -- those go straight to
      # the old generation and never move. An object it RECEIVED may be young, so
      # storing one into an allocated container needs the write barrier or the next
      # minor GC moves the object and leaves the pointer dangling (#864).
      #
      # docs/native_interface.md forbade that store outright, and core/lib/onnx did
      # it anyway at three sites for as long as those entry points have existed. It
      # never bit only because callers keep the labels array alive. A prohibition
      # nothing checks is not a guard.
      #
      # The scan carries a positive control: it fails unless it re-finds those three
      # stores AND each is barriered, because a clean zero from a scanner that
      # cannot see a known positive is indistinguishable from a clean tree -- which
      # is exactly how the first version of this audit reported all-clear.
      - name: Native libraries barrier the objects they receive
        run: python3 tools/cicd/check_native_write_barrier.py

      - name: The native write-barrier scan can still detect an unbarriered store
        run: python3 tools/cicd/test_check_native_write_barrier.py

      # Modelled on the scan above, and carrying a positive control for the same
      # reason: pointed at a truncated or wrong file, a check without one reports a
      # clean index, which is indistinguishable from a clean tree. Nine cases, one
      # of them the trap that a regenerating CI step can compare the fresh index
      # against itself and pass unconditionally. Nothing built.
      - name: The API index check can still detect a stale index
        run: python3 tools/cicd/test_check_api_index.py

      # The weekly traffic snapshot (tools/release-stats) merges GitHub's 14-day window into
      # a growing CSV; this checks the parsing and the merge without a network or a token.
      - name: Traffic snapshot merge logic
        run: python3 tools/release-stats/test_snapshot_traffic.py

      # tools/hpc/alderaan: the Slurm job-array helper and the scaling report, tested with
      # sbatch/singularity shims and a Python "program" -- no scheduler, no container, no VM.
      - name: HPC sweep helper and scaling harness
        run: |
          python3 tools/hpc/alderaan/tests/test_objeck_slurm.py
          python3 tools/hpc/alderaan/tests/test_scaling.py

      # Same class of guard, for programs/regression/run_differential.py. Its
      # markers take a test out of part of the s0/s3 x JIT comparison, so each
      # one that removes coverage needs a stated reason, and the
      # nondeterministic-output marker is capped at 5% of the suite. The same
      # lint governs the two markers that take a test out of a nightly verifier
      # step: each reason must name the run whose log shows the failure, and at
      # most five tests may opt out at all. The unit tests
      # run the runner against fake obc/obr executables: nothing built.
      - name: Differential and verifier markers have a stated reason
        run: python3 tools/cicd/check_diff_markers.py

      - name: Differential runner catches divergence
        run: python3 programs/regression/test_run_differential.py

      # Same class of guard. The examples in programs/deploy are copied wholesale
      # into a release, and welcome.obs is the only map a user gets. An unindexed
      # example reaches users undocumented; an index naming a file that is gone
      # is a lie. Both have happened here (2026-09-09): a scratch file and a JIT
      # bug reproduction shipped as teaching material, and two examples shared
      # one number.
      - name: Shipped examples are all indexed
        run: python3 tools/cicd/check_examples_index.py

      # programs/regression/checkers_engine.obs is generated: the regression runners
      # compile one file per test, and the checkers example is several, so the test is
      # those files joined. A stale copy would test yesterday's example.
      - name: Checkers regression test matches the example sources
        run: python3 programs/examples/checkers/make_regression_test.py --check

      # Same class of guard. Every Windows deploy starts by regenerating tracked
      # files from their .in templates (update_version.ps1), so an edit made to a
      # generated file instead of its template is thrown away by every build that
      # matters. The search_index.json check in code_doc64.cmd was exactly that:
      # committed to the .cmd, absent from code_doc64.in, and never run by a
      # Windows deploy (2026-09-13).
      - name: Generated files match their .in templates
        run: python3 tools/cicd/check_version_templates.py

      # Every package install in these workflows goes through apt_harden.sh, which puts a
      # retrying apt-get ahead of the real one (2026-11-11: the runners could not resolve the
      # Ubuntu mirrors for hours and every job that installs packages failed, on PRs that had
      # nothing to do with packages). These tests run the retry and mirror-fallback logic
      # against a fake apt-get, so it is proven before a real outage has to prove it.
      - name: CI package installs retry a network failure
        run: bash tools/cicd/test_apt_harden.sh

      # The linker and the runtime refuse a library whose first integer is not
      # the toolchain's VER_NUM, so a version bump that does not rebuild and
      # commit every core/lib/*.obl ships a tree that cannot link (v2026.9.x,
      # #1010). Read straight from the committed bytes; nothing is built. The
      # self-test comes first for the usual reason: a check that can only say
      # "ok" has not checked anything.
      - name: Libraries carry the toolchain version
        run: |
          python3 tools/cicd/check_obl_versions.py --test
          python3 tools/cicd/check_obl_versions.py

      # Same class again, and the one with the worst failure mode. obu refuses a
      # manifest whose signature does not verify (#723 phase 3), so a tool that
      # replaces a published SHA256SUMS and leaves SHA256SUMS.minisig alone does
      # not weaken the release -- it makes it uninstallable, for everyone. Two
      # tools did exactly that, because Windows MSI signing happens after
      # publication and rewrites the installer bytes. The self-test runs too: a
      # guard whose matching has quietly stopped matching reports success.
      - name: Every SHA256SUMS upload is re-signed
        run: |
          python3 tools/cicd/check_manifest_resign.py --test
          python3 tools/cicd/check_manifest_resign.py

      # obu's refusal message sends the user to README.md to check the release
      # key out of band (#723 phase 4). A rotation that updates the .pub and not
      # the README leaves a shipped message pointing at the WRONG key, which is
      # worse than publishing none: someone who follows it concludes a forged
      # release is genuine, or a genuine one forged.
      - name: README publishes the committed release public key
        run: |
          KEY=$(sed -n 2p core/release/objeck-release.pub)
          if [ -z "$KEY" ]; then
            echo "::error::core/release/objeck-release.pub has no key on line 2"
            exit 1
          fi
          if ! grep -qF "$KEY" README.md; then
            echo "::error::README.md does not publish the key in core/release/objeck-release.pub"
            echo "obu tells users the public half is published there; see #723 phase 4."
            exit 1
          fi
          echo "README publishes $(sed -n 1p core/release/objeck-release.pub)"

      # Install instructions drift from what the binaries link: v2026.9.2's notes
      # told macOS users to install two formulas while obr needed four more, one
      # of which Homebrew does not ship. Every package a doc names must be in
      # core/release/runtime_deps.json, which the build legs check against the
      # built trees.
      - name: Docs name only the dependencies Objeck needs
        run: python3 tools/cicd/check_docs_deps.py --docs

      # Same class of guard, for the links between pages. A rename or a deleted
      # page leaves relative links and #anchors that nothing complains about until
      # a reader meets the 404; a path spelled with the wrong case works on Windows
      # and macOS and fails on GitHub. Checks every Markdown file git knows against
      # git's own file list and each page's headings, with no network access. The
      # second step proves the checker can still fail. Known-broken links live in
      # tools/cicd/doc_links_known.txt, and an entry whose link resolves is an error.
      - name: Markdown links and anchors resolve
        run: python3 tools/cicd/check_doc_links.py

      - name: The link check can still detect a broken link
        run: python3 tools/cicd/check_doc_links.py --test

      # The site pages under docs/web (the guides and the rendered docs) are
      # generated from Markdown. Editing the Markdown and forgetting to run the
      # script leaves objeck.org showing the old text; this fails until it is run.
      - name: Site pages match their Markdown
        run: python3 tools/docs/guides_to_html.py --check

      # The code samples on the site are files in docs/site/examples, each with the
      # output it printed; the pages are built from them. This checks the files agree
      # (a toolchain run with --toolchain DIR compiles and runs them) and that the
      # highlighter still produces the expected token classes.
      - name: Site code samples are consistent and highlight
        run: |
          python3 tools/cicd/check_site_examples.py
          python3 tools/docs/test_objeck_highlight.py

      # Same class of guard, for both halves of what the benchmark harness does.
      # Every number on docs/performance.md was measured at the input printed
      # beside it, and perf-results/run_benchmarks.sh holds the input the harness
      # actually uses. Nothing kept them in step: the harness ran binarytrees at
      # depth 21 while every table said 17 (2026-09-22), which for an exponential
      # workload is roughly 16x -- enough to turn a run planned from the page into
      # a multi-hour one, and to make anything it measured incomparable to the
      # page it would have been written into. The set drifts the same way and was
      # not covered: programs/tests/perf/ held bench_tco.obs and
      # bench_spectralnorm_native.obs while the harness listed neither, so a
      # cross-build comparison covered 10 benchmarks and reported on 12
      # (2026-09-15). Both directions now fail here.
      - name: Benchmark set and inputs match the documented ones
        run: python3 tools/cicd/check_benchmark_inputs.py

      - name: Benchmark set/input check catches drift
        run: python3 tools/cicd/test_check_benchmark_inputs.py

      # Same reason, same cost: nothing built, fails in seconds. A native call
      # whose name is written as a literal at the call site allocates a String
      # on every call -- 1655ns against 130ns for the same call with the name
      # held in a field. Holding them is a whole-tree edit that one regenerated
      # library silently undoes: core/lib/sdl/code_gen emits sdl2.obs, and its
      # emitter writes the literal form.
      - name: Native call names are held, not re-allocated
        run: python3 tools/cicd/hoist_native_names.py --check core/compiler/lib_src/*.obs

      - name: Install build deps
        run: |
          sudo bash tools/cicd/apt_harden.sh
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libmbedtls-dev zlib1g-dev libreadline-dev ccache

      # obr links AWS-LC, ngtcp2, nghttp3 and nghttp2 statically: restore them
      # from cache or build them with tools/deps/build_quic_deps.sh.
      - name: QUIC dependencies
        uses: ./.github/actions/quic-deps

      - name: Cache ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-tools-ccache-${{ github.sha }}
          restore-keys: ${{ runner.os }}-tools-ccache-

      - name: Setup ccache
        # Pin CCACHE_DIR to the path cached above -- see the matrix job's Setup
        # ccache step for why ~/.ccache is otherwise never written or saved.
        run: |
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          export CCACHE_DIR="$HOME/.ccache"
          mkdir -p "$CCACHE_DIR"
          ccache --max-size=500M
          ccache --set-config=compression=true

      - name: Build Objeck (obc + obr)
        working-directory: core/vm
        env: { CC: ccache gcc, CXX: ccache g++ }
        run: |
          cp make/Makefile.amd64 Makefile
          make -j$(nproc)
          cd ../compiler
          cp make/Makefile.amd64 Makefile
          make -j$(nproc) OBJECK_LIB_PATH=///".///"

      - name: Assemble deploy tree
        run: |
          # The tooling scripts probe core/release/deploy-x64 then deploy,
          # so materialize that layout rather than teaching each script a
          # bin-dir argument.
          DEPLOY=core/release/deploy-x64
          mkdir -p "$DEPLOY/bin" "$DEPLOY/lib"
          cp core/compiler/obc core/vm/obr "$DEPLOY/bin"/
          chmod +x "$DEPLOY/bin/obc" "$DEPLOY/bin/obr"
          cp core/lib/*.obl "$DEPLOY/lib"/
          cp core/lib/*.ini "$DEPLOY/lib"/ 2>/dev/null || true
          "$DEPLOY/bin/obc" -version | head -1 || true

      - name: Build native diagnostics library
        run: |
          # The language server reaches its analyzer through
          # DllProxy->New("libobjk_diags"). Without the native library the
          # server still answers initialize and advertises capabilities, but
          # every analysis-backed handler returns null and no diagnostics are
          # ever published -- which is exactly how this job first failed.
          cd core/lib/diags
          bash build_linux.sh diags
          mkdir -p ../../release/deploy-x64/lib/native
          cp diags.so ../../release/deploy-x64/lib/native/libobjk_diags.so

      # API.OpenAI's image entry points and its text ones differ only in a
      # generic type argument, which overload resolution does not distinguish,
      # so an image call that does not otherwise pin the image implementation
      # compiles to a call to the text one and the picture is never sent (#901).
      # Nothing at run time shows it without an API key, and nothing at compile
      # time shows it without reading the emitted calls.
      - name: API.OpenAI image calls reach the image implementation
        run: python3 tools/cicd/check_openai_image_dispatch.py core/release/deploy-x64/bin/obc core/lib

      - name: Formatter regression
        run: bash tools/lsp/server/format_code/run_regression.sh

      - name: Build LSP server
        run: bash tools/lsp/server/build_server.sh

      - name: LSP regression
        run: python3 tools/lsp/tests/run_lsp_tests.py core/release/deploy-x64/bin

      # Same family of guard, found the same way: by noticing something shipped was
      # not in the editor index. objk_apis.json is what the language server answers
      # completions and hover from, and the copy under clients/vscode is packaged
      # into the .vsix -- the one users actually get. Both are tracked, both are
      # generated, and nothing regenerated or verified either, so the index changed
      # only when someone remembered. They had not: regenerating on 2026-10-07 took
      # API.Onnx from 48 entries to 58, so the whole generic run API (#1047) shipped
      # with no completions, and several System.ML releases before it had too.
      # check_doc_lists.py does not cover this -- a library can be in all six lists
      # and still absent from the index, which is the state the tree was in (#1050).
      #
      # It compares the CLASS SET, not the bytes: the index is emitted by an Objeck
      # program run on whatever machine the maintainer used, and a guard that reddens
      # CI over whitespace gets disabled. Missing classes are what drifts.
      - name: Editor API index is current
        run: |
          # gen_json.sh rewrites both tracked copies IN PLACE, so keep the committed
          # ones and name them explicitly below. Comparing against the tracked path
          # after regeneration would compare the fresh index with itself and pass
          # however stale the committed one was.
          cp tools/lsp/server/objk_apis.json "$RUNNER_TEMP/committed.json"
          cp tools/lsp/clients/vscode/server/objk_apis.json "$RUNNER_TEMP/packaged.json"
          sh tools/lsp/server/doc_json/gen_json.sh
          python3 tools/cicd/check_api_index.py \
            --committed "$RUNNER_TEMP/committed.json" \
            --packaged "$RUNNER_TEMP/packaged.json" \
            --regenerated tools/lsp/server/objk_apis.json

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      - name: VS Code extension — install, compile, lint
        working-directory: tools/lsp/clients/vscode
        run: |
          npm ci
          npm run compile
          npm run lint

  # ============================================
  # Loader fuzz (advisory)
  # ============================================

  # A short libFuzzer + ASan/UBSan run of the .obe loader against the linux-x64
  # deploy tree this run just built. ADVISORY: `continue-on-error` keeps the job
  # green when it finds something, and it is deliberately not in the `status`
  # job's `needs`, so it can never block a merge. A finding is reported as a
  # warning annotation and in the job summary. The nightly (nightly-hardening.yml)
  # runs the same driver for 30 minutes and files issues; this is the early look.
  loader-fuzz:
    name: Loader fuzz (advisory)
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 45
    # pull-requests: read is for the file list the first step asks for.
    permissions:
      contents: read
      pull-requests: read
    env:
      TREE: core/release/deploy-x64
    steps:
      # The fuzz exercises the .obe loader (core/vm, core/shared), fed with programs the compiler
      # emits (core/compiler, programs/regression) by the driver in tools/fuzz. A pull request that
      # touches none of those cannot change what it finds, and the nightly run (nightly-hardening.yml,
      # 30 minutes) covers every change on master anyway, so such a pull request skips the 8 minutes.
      # Every other case runs it: a push, and any failure to read the file list (fail open). The job
      # still reports success when skipped, as it does when advisory findings exist.
      - name: Decide whether this change can reach the loader
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          run=true
          if [ "$EVENT" = "pull_request" ]; then
            if files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename' 2>/dev/null) && [ -n "$files" ]; then
              if echo "$files" | grep -qE '^(core/|programs/regression/|tools/fuzz/|\.github/workflows/ci-build\.yml$)'; then
                echo "A changed file can reach the loader or the fuzz inputs: running the fuzz."
              else
                run=false
                echo "No changed file is under core/, programs/regression/, tools/fuzz/ or this workflow: skipping the fuzz."
                echo "### Loader fuzz skipped: no loader-relevant file changed (nightly covers master)" >> "$GITHUB_STEP_SUMMARY"
              fi
            else
              echo "Could not read the pull request's file list: running the fuzz."
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the fuzz toolchain
        if: steps.gate.outputs.run == 'true'
        timeout-minutes: 10
        run: |
          sudo bash tools/cicd/apt_harden.sh
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-rt-18-dev zlib1g-dev libmbedtls-dev

      - name: Download the deploy tree built by this run
        if: steps.gate.outputs.run == 'true'
        timeout-minutes: 10
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: objeck-linux-x64
          path: ${{ env.TREE }}

      - name: Fuzz the bytecode loader (5 minutes)
        if: steps.gate.outputs.run == 'true'
        timeout-minutes: 30
        run: |
          set -o pipefail
          chmod +x "$TREE"/bin/* 2>/dev/null || true
          rc=0
          python3 tools/fuzz/loader/run_nightly.py --bin "$TREE/bin" --work "$RUNNER_TEMP/loader-fuzz" \
            --minutes 5 --seed "$GITHUB_RUN_ID" --out loader-fuzz-out | tee loader-fuzz.log || rc=$?
          if [ "$rc" != "0" ]; then
            echo "::warning title=Loader fuzz::advisory run found something or failed (exit $rc); not blocking. See the job summary."
            {
              echo "### Loader fuzz (advisory): exit $rc"
              echo '```'
              grep -E '^(FAIL|  (seed|target|reduced):)' loader-fuzz.log || tail -20 loader-fuzz.log
              echo '```'
              echo "Reproduce with the saved input from the artifact; see tools/fuzz/loader/README.md."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

      - name: Upload any saved inputs
        if: steps.gate.outputs.run == 'true' && always()
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: loader-fuzz-advisory
          path: loader-fuzz-out/
          if-no-files-found: ignore
          retention-days: 14

  # ============================================
  # Build Status Summary
  # ============================================

  status:
    name: CI Status
    runs-on: ubuntu-24.04
    needs: [libs, build, windows, tools]
    if: always()
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Report build status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ needs.libs.result }}" = "success" ] \
             && [ "${{ needs.build.result }}" = "success" ] \
             && [ "${{ needs.windows.result }}" = "success" ] \
             && [ "${{ needs.tools.result }}" = "success" ]; then
            echo "✅ All platform builds and tooling checks succeeded"
            echo "### ✅ CI — all platform builds and tooling checks succeeded" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "❌ Build result: ${{ needs.build.result }}, windows result: ${{ needs.windows.result }}, tools result: ${{ needs.tools.result }}"
          {
            echo "### ❌ CI — build ${{ needs.build.result }}, windows ${{ needs.windows.result }}, tools ${{ needs.tools.result }}"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # fail-fast is off, so the rolled-up result hides which platforms
          # broke. Ask the API for the specific failed matrix legs by name.
          failed=$(gh run view "${{ github.run_id }}" --repo "${{ github.repository }}" \
            --json jobs -q '.jobs[] | select(.conclusion=="failure") | .name' 2>/dev/null || true)
          if [ -n "$failed" ]; then
            echo "Failed jobs:"
            echo "$failed" | sed 's/^/  ❌ /'
            {
              echo "| Failed job |"
              echo "| :--------- |"
              echo "$failed" | sed 's/.*/| & |/'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 1

      # A red master is a release blocker, so it is recorded where the maintainer
      # sees it: one tracking issue per pipeline, plus a phone push when the
      # NTFY_TOPIC secret exists. Pull requests report through their own checks.
      - name: Checkout notification action
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          path: notify-src

      - name: Notify master failure
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: ./notify-src/.github/actions/notify-failure
        with:
          workflow: CI Build (master)
          details: "build: ${{ needs.build.result }}, windows: ${{ needs.windows.result }}, tools: ${{ needs.tools.result }}. The run summary names each failed job."
          ntfy-topic: ${{ secrets.NTFY_TOPIC }}
          github-token: ${{ github.token }}
