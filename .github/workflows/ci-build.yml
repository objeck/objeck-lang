name: CI Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    # Backstop so a hung test/step can never tie up a runner for the default
    # 6 hours (per-test timeouts in run_regression.sh are the first line of
    # defense; this caps the whole job).
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows builds
          # Pinned to windows-2025-vs2026, which ships VS2026 (toolset v145).
          # The .vcxproj files select $(DefaultPlatformToolset) rather than a
          # hard-coded toolset, so they resolve to v145 here and to v143 on a
          # VS2022 developer box; VS2026 ships only v145 (no v143), so pinning
          # either version in the projects breaks one environment or the other.
          # Explicit label rather than windows-latest/windows-2025 to avoid
          # future silent image migrations.
          - platform: windows-x64
            os: windows-2025-vs2026
            arch: x64
            deploy_script: deploy_windows.cmd x64
            shell: cmd

          - platform: windows-arm64
            os: windows-2025-vs2026
            arch: ARM64
            deploy_script: deploy_windows.cmd arm64
            shell: cmd

          # Linux builds
          - platform: linux-x64
            os: ubuntu-latest
            arch: x64
            deploy_script: ./deploy_posix.sh x64
            shell: bash

          # Linux ARM64 - using GitHub-hosted ARM64 runners (public preview)
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            arch: arm64
            deploy_script: ./deploy_posix.sh arm64
            shell: bash

          # macOS build (ARM64 native on Apple Silicon)
          - platform: macos-arm64
            os: macos-15
            arch: arm64
            deploy_script: ./deploy_macos_arm64.sh
            shell: bash

    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    # ============================================
    # Dependency Installation
    # ============================================

    # Linux dependencies with caching. Cache a USER-OWNED archive dir (~/apt-cache)
    # rather than the root-owned /var/cache/apt/archives -- restoring the latter as
    # the unprivileged runner fails with "tar: ...deb: Permission denied" (it can't
    # overwrite the root-owned .debs), which silently disabled the cache and spammed
    # the log with libopencv-*.deb errors. apt downloads into ~/apt-cache via
    # Dir::Cache::archives, so a cache hit skips re-downloading.
    - name: Cache APT packages (Linux)
      if: runner.os == 'Linux'
      uses: actions/cache@v5
      with:
        path: ~/apt-cache
        key: ${{ runner.os }}-${{ matrix.arch }}-apt-${{ hashFiles('.github/workflows/**') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.arch }}-apt-

    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      run: |
        mkdir -p ~/apt-cache/partial
        sudo apt-get update
        sudo apt-get install -y -o Dir::Cache::archives="$HOME/apt-cache" -o APT::Sandbox::User=root \
          build-essential \
          libopencv-dev \
          libmbedtls-dev \
          libnghttp2-dev \
          libngtcp2-dev \
          libngtcp2-crypto-gnutls-dev \
          libnghttp3-dev \
          libgnutls28-dev \
          unixodbc-dev \
          libsqliteodbc \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-ttf-dev \
          libsdl2-mixer-dev \
          libegl1 \
          libegl-mesa0 \
          libgl1-mesa-dri \
          libreadline-dev \
          libeigen3-dev \
          libmp3lame-dev \
          ccache \
          expect
        # apt writes the .debs as root; make them runner-owned so the cache-save
        # step (which runs unprivileged) can read them without permission errors.
        sudo chown -R "$(id -u):$(id -g)" ~/apt-cache

    - name: Configure ODBC test DSN (Linux)
      if: runner.os == 'Linux'
      run: |
        echo '[objeck_sqlite_test]' >> ~/.odbc.ini
        echo 'Description=Objeck ODBC regression test DSN' >> ~/.odbc.ini
        echo 'Driver=SQLite3' >> ~/.odbc.ini
        echo 'Database=:memory:' >> ~/.odbc.ini

    # macOS dependencies with caching
    - name: Cache Homebrew downloads (macOS)
      if: runner.os == 'macOS'
      uses: actions/cache@v5
      with:
        path: ~/Library/Caches/Homebrew
        key: ${{ runner.os }}-brew-downloads-${{ hashFiles('.github/workflows/**') }}
        restore-keys: |
          ${{ runner.os }}-brew-downloads-

    - name: Install macOS dependencies
      if: runner.os == 'macOS'
      run: |
        # Install only formulae that aren't already present. The hosted runner
        # preinstalls newer gnutls/libnghttp3/cmake than these formulae, so a
        # plain `brew install` aborts with "already installed" (red CI error
        # annotations) even though the build is fine. Skip present packages and
        # install the rest, so genuine install failures still surface.
        for pkg in \
          opencv@4 \
          onnxruntime \
          mbedtls \
          nghttp2 \
          libnghttp3 \
          gnutls \
          cmake \
          unixodbc \
          sdl2 \
          sdl2_image \
          sdl2_ttf \
          sdl2_mixer \
          readline \
          eigen \
          lame \
          ccache; do
          if brew list --versions "$pkg" >/dev/null 2>&1; then
            echo "✓ $pkg already installed — skipping"
          else
            brew install "$pkg"
          fi
        done
        brew cleanup

        # Add Homebrew bin to PATH (immediate + persistent)
        export PATH="/opt/homebrew/bin:$PATH"
        echo "/opt/homebrew/bin" >> $GITHUB_PATH

        # Homebrew's default `opencv` is now OpenCV 5.0, which moved several
        # functions out of the cv:: namespace (contourArea, boundingRect,
        # getRotationMatrix2D, approxPolyDP, estimateAffinePartial2D, LMEDS) and
        # relocated headers -> the opencv/onnx native libs no longer compile.
        # The other platforms stay on OpenCV 4.x, so pin macOS to opencv@4 too.
        # opencv@4 is keg-only (not symlinked into /opt/homebrew), so expose its
        # pkg-config dir to every later step (onnx build.sh detects opencv4).
        if [ -d /opt/homebrew/opt/opencv@4/lib/pkgconfig ]; then
          echo "PKG_CONFIG_PATH=/opt/homebrew/opt/opencv@4/lib/pkgconfig:${PKG_CONFIG_PATH}" >> $GITHUB_ENV
        fi

    - name: Build ngtcp2 with GnuTLS backend (macOS)
      if: runner.os == 'macOS'
      run: |
        # Homebrew's libngtcp2 ships only the OpenSSL crypto backend.
        # The VM requires the GnuTLS backend; build ngtcp2 from source at the
        # exact version Homebrew installed so ABI is compatible at runtime.
        NGTCP2_VER=$(brew list --versions libngtcp2 | awk '{print $2}')
        echo "Building ngtcp2 v${NGTCP2_VER} to match Homebrew libngtcp2"
        cd /tmp
        git clone --depth 1 --branch "v${NGTCP2_VER}" https://github.com/ngtcp2/ngtcp2.git
        cd ngtcp2
        git submodule update --init --depth 1
        mkdir build && cd build
        cmake -DCMAKE_INSTALL_PREFIX=/opt/homebrew \
              -DENABLE_GNUTLS=ON -DENABLE_OPENSSL=OFF \
              -DCMAKE_PREFIX_PATH="/opt/homebrew;/opt/homebrew/opt/gnutls" \
              -DBUILD_TESTING=OFF ..
        make -j$(sysctl -n hw.ncpu)
        make install DESTDIR=/tmp/ngtcp2-install
        # libnghttp3 pulls in libngtcp2 (OpenSSL build) as a dep; those files are
        # root-owned, so only install the GnuTLS-specific files that aren't in brew.
        sudo cp /tmp/ngtcp2-install/opt/homebrew/lib/libngtcp2_crypto_gnutls* /opt/homebrew/lib/
        sudo mkdir -p /opt/homebrew/include/ngtcp2
        sudo cp /tmp/ngtcp2-install/opt/homebrew/include/ngtcp2/* /opt/homebrew/include/ngtcp2/
        echo "ngtcp2 GnuTLS backend installed:"
        ls /opt/homebrew/lib/libngtcp2*

    - name: Select Xcode 16.3+ (macOS)
      if: runner.os == 'macOS'
      run: |
        # objectVersion 90 (matrix.xcodeproj) requires Xcode 16.3+
        XCODE_PATH=$(ls -d /Applications/Xcode_16.[3-9]*.app 2>/dev/null | sort -V | tail -1)
        if [ -z "$XCODE_PATH" ]; then
          XCODE_PATH=$(ls -d /Applications/Xcode_16.*.app 2>/dev/null | sort -V | tail -1)
        fi
        if [ -n "$XCODE_PATH" ]; then
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          echo "Selected: $XCODE_PATH"
        fi
        xcodebuild -version

    - name: Install Apple signing certificate
      if: runner.os == 'macOS'
      env:
        CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
        P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      run: |
        if [ -z "$CERTIFICATE_BASE64" ] || [ -z "$P12_PASSWORD" ] || [ -z "$KEYCHAIN_PASSWORD" ]; then
          echo "Apple signing secrets not configured - skipping"
          exit 0
        fi

        CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
        echo -n "$CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH

        KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
        security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
        security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

        security import $CERTIFICATE_PATH -P "$P12_PASSWORD" \
          -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
        security set-key-partition-list -S apple-tool:,apple:,codesign:,productsign: \
          -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
        security list-keychains -d user -s $KEYCHAIN_PATH

        rm "$CERTIFICATE_PATH"
        echo "Apple signing certificate installed."

    # Windows setup
    - name: Setup Visual Studio (Windows)
      if: runner.os == 'Windows'
      uses: microsoft/setup-msbuild@v3

    - name: Setup MSVC Environment (Windows)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ matrix.arch }}

    - name: Install Windows dependencies
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # Install mbedtls and nghttp2 via vcpkg. The installs download tools
        # and sources from external CDNs that intermittently 504 (a transient
        # ninja download failed a whole leg on 2026-06-06), so retry with a
        # short backoff before giving up.
        function Install-VcpkgPackage([string]$pkg) {
          $max = 3
          for($i = 1; $i -le $max; $i++) {
            vcpkg install $pkg
            if($LASTEXITCODE -eq 0) {
              return
            }
            if($i -lt $max) {
              Write-Output "vcpkg install $pkg failed (attempt $i/$max); retrying in 20s..."
              Start-Sleep -Seconds 20
            }
          }
          throw "vcpkg install $pkg failed after $max attempts"
        }
        Install-VcpkgPackage "mbedtls:${{ matrix.arch }}-windows"
        Install-VcpkgPackage "nghttp2:${{ matrix.arch }}-windows"

        # Set include/lib paths for Visual Studio
        $vcpkgRoot = "C:\vcpkg\installed\${{ matrix.arch }}-windows"
        echo "INCLUDE=$vcpkgRoot\include;$env:INCLUDE" >> $env:GITHUB_ENV
        echo "LIB=$vcpkgRoot\lib;$env:LIB" >> $env:GITHUB_ENV
        # Add vcpkg bin to PATH so nghttp2.dll is found at test runtime
        echo "$vcpkgRoot\bin" >> $env:GITHUB_PATH

        Write-Output "✅ Installed mbedtls and nghttp2 for ${{ matrix.arch }}"
        Write-Output "Set INCLUDE=$vcpkgRoot\include"
        Write-Output "Set LIB=$vcpkgRoot\lib"
        Write-Output "Added to PATH: $vcpkgRoot\bin"

    - name: Cache OpenCV DLLs (Windows x64)
      if: matrix.platform == 'windows-x64'
      id: opencv-cache
      # The cache is only an optimization — a transient cache-service error must
      # not fail the build. On a miss/error, cache-hit != 'true' and the download
      # step below fetches the DLLs anyway.
      continue-on-error: true
      uses: actions/cache@v5
      with:
        path: core/lib/opencv/win/x64/bin
        key: opencv-4.12.0-win-x64-dlls

    - name: Download OpenCV runtime DLLs (Windows x64)
      if: matrix.platform == 'windows-x64' && steps.opencv-cache.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $opencvVersion = "4.12.0"
        $binDir = "core\lib\opencv\win\x64\bin"
        New-Item -ItemType Directory -Force -Path $binDir | Out-Null

        $url = "https://github.com/opencv/opencv/releases/download/$opencvVersion/opencv-$opencvVersion-windows.exe"
        Write-Output "Downloading OpenCV $opencvVersion from $url ..."
        # same transient-CDN-failure class as the vcpkg installs: bounded retry
        $max = 3
        for($i = 1; $i -le $max; $i++) {
          try {
            Invoke-WebRequest -Uri $url -OutFile opencv-dl.exe
            break
          }
          catch {
            if($i -eq $max) { throw }
            Write-Output "OpenCV download failed (attempt $i/$max); retrying in 20s..."
            Start-Sleep -Seconds 20
          }
        }

        7z x opencv-dl.exe -oopencv-extract -y | Out-Null

        Copy-Item "opencv-extract\opencv\build\x64\vc16\bin\opencv_world4120.dll" $binDir
        Copy-Item "opencv-extract\opencv\build\x64\vc16\bin\opencv_videoio_ffmpeg4120_64.dll" $binDir

        Remove-Item opencv-dl.exe -Force
        Remove-Item -Recurse opencv-extract -Force

        Write-Output "OpenCV DLLs installed:"
        Get-ChildItem $binDir

    # ============================================
    # ccache Setup
    # ============================================

    - name: Cache ccache
      if: runner.os != 'Windows'
      uses: actions/cache@v5
      with:
        path: ~/.ccache
        key: ${{ runner.os }}-${{ matrix.arch }}-ccache-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.arch }}-ccache-

    - name: Setup ccache
      if: runner.os != 'Windows'
      run: |
        which ccache || { echo "ccache not found in PATH"; exit 1; }
        ccache --max-size=500M
        ccache --set-config=compression=true
        ccache --zero-stats

    # ============================================
    # Build Compiler Bootstrap (Linux x64 only)
    # ============================================

    - name: Build bootstrap (Linux x64 only)
      if: matrix.platform == 'linux-x64'
      working-directory: ./core/compiler
      run: ./update_version.sh

    # ============================================
    # Build Toolchain
    # ============================================

    - name: Build toolchain
      working-directory: ./core/release
      env:
        CC: ${{ runner.os == 'Linux' && 'ccache gcc' || '' }}
        CXX: ${{ runner.os == 'Linux' && 'ccache g++' || '' }}
      run: ${{ matrix.deploy_script }}

    # Prove the macOS distribution is self-contained.
    #
    # The deploy bundles SDL2 into lib/sdl and rewrites install names to @rpath,
    # replacing the old instructions that told users to untar a tarball into
    # /usr/local. The deploy script already fails if an absolute SDL2 path
    # survives, but "no absolute paths" and "actually loads from our tree" are
    # different claims -- this runner has Homebrew SDL2 at /opt/homebrew, so a
    # broken @rpath could still be masked by a lucky fallback.
    #
    # DYLD_PRINT_LIBRARIES makes dyld name every library it loads, so we can
    # assert WHICH libSDL2 was used. That is as close as CI can get to the thing
    # we cannot test here: unpacking a release on a Mac with no Homebrew.
    - name: Verify macOS SDL2 bundling
      if: matrix.platform == 'macos-arm64'
      working-directory: ./core/release/deploy
      run: |
        echo "--- libobjk_sdl.dylib dependencies ---"
        otool -L lib/native/libobjk_sdl.dylib | sed 's/^/  /'

        if otool -L lib/native/libobjk_sdl.dylib | grep -q "/usr/local/lib/libSDL2"; then
          echo "FAIL: still references /usr/local/lib for SDL2"
          exit 1
        fi

        echo "--- bundled dylibs ---"
        ls -1 lib/sdl/*.dylib | sed 's/^/  /'

        # Every @rpath dependency must exist in lib/sdl
        for dep in $(otool -L lib/native/libobjk_sdl.dylib | awk '/@rpath\/libSDL2/ {print $1}'); do
          base=$(basename "$dep")
          if [ ! -f "lib/sdl/$base" ]; then
            echo "FAIL: $base is needed via @rpath but is not in lib/sdl"
            exit 1
          fi
        done

        # Which libSDL2 does dyld actually pick? Run the GL test and look.
        echo "--- runtime resolution ---"
        cd bin
        # Compile it here: this step runs before the suite's own compile step,
        # so the .obe does not exist yet.
        ./obc -src ../../../../programs/regression/gl_context_test.obs \
              -lib cipher,collect,xml,json,sdl2,sdl_gl -dest /tmp/glt.obe
        DYLD_PRINT_LIBRARIES=1 OBJECK_GL_REQUIRED=1 ./obr /tmp/glt.obe 2>&1 \
          | grep -i "libSDL2" | head -5 | sed 's/^/  /' > /tmp/sdl_loaded.txt || true
        cat /tmp/sdl_loaded.txt

        if grep -q "/opt/homebrew" /tmp/sdl_loaded.txt; then
          echo "FAIL: loaded SDL2 from Homebrew, not from the distribution."
          echo "      The @rpath bundling is not doing its job; an end user"
          echo "      without Homebrew would get a load failure."
          exit 1
        fi
        if [ ! -s /tmp/sdl_loaded.txt ]; then
          echo "NOTE: dyld printed no libSDL2 line; cannot confirm the source."
        else
          echo "OK: SDL2 resolved from inside the distribution"
        fi

    # ============================================
    # Rebuild Libraries (non-bootstrap platforms)
    # ============================================

    - name: Rebuild libraries (Linux ARM64)
      if: matrix.platform == 'linux-arm64'
      working-directory: ./core/compiler
      run: |
        chmod +x update_version_arm.sh
        ./update_version_arm.sh

    - name: Rebuild libraries (macOS ARM64)
      if: matrix.platform == 'macos-arm64'
      working-directory: ./core/compiler
      run: |
        chmod +x update_version_arm.sh
        ./update_version_arm.sh

    - name: Rebuild libraries (Windows)
      if: runner.os == 'Windows' && matrix.platform != 'windows-arm64'
      working-directory: ./core/compiler
      shell: bash
      run: |
        OBC="../release/${{ matrix.arch == 'ARM64' && 'deploy-arm64' || 'deploy-x64' }}/bin/obc.exe"
        if [ ! -f "$OBC" ]; then
          echo "Compiler not found at $OBC, skipping lib rebuild"
          exit 0
        fi

        echo "Rebuilding libraries with $OBC..."
        $OBC -src lib_src/gen_collect.obs -lib ../lib/lang -tar lib -opt s3 -dest ../lib/gen_collect.obl -strict
        $OBC -src lib_src/concurrent.obs -lib gen_collect -tar lib -opt s3 -dest ../lib/concurrent.obl
        $OBC -src lib_src/json_stream.obs -lib gen_collect -tar lib -opt s3 -dest ../lib/json_stream.obl
        $OBC -src lib_src/cipher.obs -tar lib -opt s3 -dest ../lib/cipher.obl
        $OBC -src lib_src/json.obs -lib gen_collect -tar lib -opt s3 -dest ../lib/json.obl
        $OBC -src lib_src/opencv.obs -lib cipher,json -tar lib -opt s3 -dest ../lib/opencv.obl
        $OBC -src lib_src/onnx.obs -lib opencv,cipher,json -tar lib -opt s3 -dest ../lib/onnx.obl
        $OBC -src lib_src/lame.obs -tar lib -opt s3 -dest ../lib/lame.obl
        $OBC -src lib_src/diags.obs -lib gen_collect -tar lib -opt s3 -dest ../lib/diags.obl
        $OBC -src lib_src/xml.obs -lib gen_collect -tar lib -opt s3 -dest ../lib/xml.obl
        $OBC -src lib_src/regex.obs -lib gen_collect -tar lib -opt s3 -dest ../lib/regex.obl
        $OBC -src lib_src/csv.obs -tar lib -lib gen_collect -opt s3 -dest ../lib/csv.obl
        $OBC -src lib_src/ml_core.obs,lib_src/ml_linear.obs,lib_src/ml_tree.obs,lib_src/ml_bayes.obs,lib_src/ml_neighbors.obs,lib_src/ml_cluster.obs,lib_src/ml_data.obs -lib gen_collect,csv -tar lib -opt s3 -dest ../lib/ml.obl
        $OBC -src lib_src/ai_search.obs,lib_src/ai_game.obs,lib_src/ai_optimize.obs,lib_src/ai_rl.obs -lib gen_collect -tar lib -opt s3 -dest ../lib/ai.obl
        $OBC -src lib_src/nlp.obs -lib gen_collect -tar lib -opt s3 -dest ../lib/nlp.obl
        $OBC -src lib_src/net_common.obs,lib_src/net.obs,lib_src/net_secure.obs -tar lib -lib gen_collect,cipher -opt s3 -dest ../lib/net.obl
        $OBC -src lib_src/net_h2.obs -tar lib -lib net,gen_collect,cipher -opt s3 -dest ../lib/net_h2.obl
        $OBC -src lib_src/net_quic.obs -tar lib -lib net,gen_collect,cipher -opt s3 -dest ../lib/net_quic.obl
        $OBC -src lib_src/net_server.obs -tar lib -lib net,json,gen_collect,cipher -opt s3 -dest ../lib/net_server.obl
        $OBC -src lib_src/web_server.obs -lib gen_collect,net -tar lib -opt s3 -dest ../lib/web_server.obl
        $OBC -src lib_src/json_rpc.obs -tar lib -lib json,net -opt s3 -dest ../lib/json_rpc.obl
        $OBC -src lib_src/misc.obs -lib gen_collect,net,json -tar lib -opt s3 -dest ../lib/misc.obl
        $OBC -src lib_src/rss.obs -tar lib -lib xml,gen_collect,net,cipher -opt s3 -dest ../lib/rss.obl
        $OBC -src lib_src/query.obs -tar lib -lib net,regex,csv,xml,json,misc -opt s3 -dest ../lib/query.obl
        $OBC -src lib_src/odbc.obs -lib gen_collect -tar lib -opt s3 -dest ../lib/odbc.obl
        $OBC -src lib_src/openai.obs -lib json,net,net_server,cipher,misc -tar lib -opt s3 -dest ../lib/openai.obl
        $OBC -src lib_src/gemini.obs -lib misc,json,net,net_server,cipher -tar lib -opt s3 -dest ../lib/gemini.obl
        $OBC -src lib_src/ollama.obs -lib net,json,cipher,misc -tar lib -opt s3 -dest ../lib/ollama.obl
        $OBC -src lib_src/sdl2.obs -tar lib -dest ../lib/sdl2.obl
        $OBC -src lib_src/sdl_game.obs -lib gen_collect,json,sdl2 -tar lib -dest ../lib/sdl_game.obl
        $OBC -src lib_src/sdl_gl.obs -lib gen_collect,sdl2 -tar lib -dest ../lib/sdl_gl.obl
        echo "Libraries rebuilt successfully"

    - name: Update deploy with rebuilt libraries
      if: matrix.platform != 'linux-x64' && matrix.platform != 'windows-arm64'
      shell: bash
      working-directory: ./core/release
      run: |
        if [ -d "deploy-${{ matrix.arch }}" ]; then
          DEPLOY_LIB="deploy-${{ matrix.arch }}/lib"
        elif [ -d "deploy" ]; then
          DEPLOY_LIB="deploy/lib"
        else
          echo "Deploy directory not found, skipping lib copy"
          exit 0
        fi
        echo "Copying rebuilt libraries to $DEPLOY_LIB..."
        cp ../lib/*.obl "$DEPLOY_LIB/"
        echo "Done"

    - name: Show ccache stats
      if: runner.os != 'Windows'
      run: ccache --show-stats

    # ============================================
    # Determine Deploy Directory
    # ============================================

    - name: Set deploy directory
      id: deploy-dir
      shell: bash
      working-directory: ./core/release
      run: |
        if [ -d "deploy-${{ matrix.arch }}" ]; then
          echo "dir=deploy-${{ matrix.arch }}" >> $GITHUB_OUTPUT
        elif [ -d "deploy" ]; then
          echo "dir=deploy" >> $GITHUB_OUTPUT
        else
          echo "ERROR: Deploy directory not found"
          ls -la
          exit 1
        fi

    # ============================================
    # Test Suite
    # Note: Windows ARM64 is cross-compiled and cannot run tests on x64 runner
    # ============================================

    - name: Skip tests (cross-compiled platform)
      if: matrix.platform == 'windows-arm64'
      shell: bash
      run: |
        echo "Tests skipped for Windows ARM64"
        echo "This platform is cross-compiled on x64 runner"
        echo "ARM64 binaries cannot execute on x64 hardware"
        echo "Build verification only - no test execution"

    - name: Compile tests
      if: matrix.platform != 'windows-arm64'
      working-directory: ./core/release/${{ steps.deploy-dir.outputs.dir }}/bin
      shell: bash
      run: |
        if [ "${{ runner.os }}" = "Windows" ]; then
          OBC="./obc.exe"
        else
          OBC="./obc"
          chmod +x obc obr obd obi 2>/dev/null || true
        fi

        # Verify compiler exists
        if [ ! -f "$OBC" ]; then
          echo "ERROR: Compiler not found: $OBC"
          ls -la
          exit 1
        fi

        # Verify library directory
        LIB_DIR="../lib"
        if [ ! -d "$LIB_DIR" ]; then
          echo "ERROR: Library directory not found: $LIB_DIR"
          exit 1
        fi

        echo "Compiler found: $OBC"
        echo "Library directory: $LIB_DIR"

        # Set library path for macOS
        if [ "${{ runner.os }}" = "macOS" ]; then
          export DYLD_LIBRARY_PATH="$(pwd)/../lib:$DYLD_LIBRARY_PATH"
          echo "Set DYLD_LIBRARY_PATH for macOS"
        fi

        echo "Testing basic compilation..."
        echo "Working directory: $(pwd)"
        ls -la "$LIB_DIR" | head -20

        # Basic tests for all platforms
        $OBC -lib cipher,net,xml,json -src ../../../../programs/deploy/hello_0.obs || exit 1
        $OBC -lib cipher,net,xml,json -src ../../../../programs/deploy/functions_5.obs || exit 1
        $OBC -lib cipher,net,xml,json -src ../../../../programs/deploy/json_3.obs || exit 1
        $OBC -lib cipher,net,xml,json -src ../../../../programs/deploy/xml_2.obs || exit 1

        echo "Basic tests compiled successfully"

        # Extended tests for Linux x64 only
        if [ "${{ matrix.platform }}" = "linux-x64" ]; then
          echo "Compiling extended tests..."
          $OBC -lib cipher,net,odbc,rss,regex,misc,xml,json -src ../../../../programs/deploy/calc_life_10.obs || exit 1
          $OBC -lib cipher,net,odbc,rss,regex,misc,xml,json -src ../../../../programs/deploy/closure_19.obs || exit 1
          $OBC -lib cipher,net,odbc,rss,regex,misc,xml,json -src ../../../../programs/deploy/encrypt_7.obs || exit 1
          $OBC -lib cipher,net,odbc,rss,regex,misc,xml,query,json,csv -src ../../../../programs/deploy/fs_query_12.obs || exit 1
          $OBC -lib cipher,net,odbc,rss,regex,misc,xml,json -src ../../../../programs/deploy/lambda_17.obs || exit 1
          $OBC -lib cipher,net,odbc,rss,regex,misc,xml,json -src ../../../../programs/deploy/regex_4.obs || exit 1
          $OBC -lib cipher,net,odbc,rss,regex,misc,xml,json -src ../../../../programs/deploy/threads_6.obs || exit 1
          $OBC -lib cipher,net,gen_collect,net_h2 -src ../../../../programs/tests/prgm_http2.obs || exit 1
          $OBC -lib cipher,net,gen_collect,net_quic -src ../../../../programs/tests/prgm_http3.obs || exit 1
          $OBC -lib cipher,net,gen_collect,net_quic -src ../../../../programs/tests/http3_downgrade_test.obs || exit 1
          $OBC -lib cipher,net,gen_collect,net_h2 -src ../../../../programs/tests/http_header_echo_test.obs || exit 1
          echo "Extended tests compiled successfully"
        fi

    - name: Run tests
      if: matrix.platform != 'windows-arm64'
      working-directory: ./core/release/${{ steps.deploy-dir.outputs.dir }}/bin
      shell: bash
      run: |
        if [ "${{ runner.os }}" = "Windows" ]; then
          OBR="./obr.exe"
        else
          OBR="./obr"
        fi

        # Basic tests
        $OBR ../../../../programs/deploy/hello_0.obe
        $OBR ../../../../programs/deploy/functions_5.obe
        $OBR ../../../../programs/deploy/json_3.obe
        $OBR ../../../../programs/deploy/xml_2.obe

        # Extended tests for Linux x64
        if [ "${{ matrix.platform }}" = "linux-x64" ]; then
          $OBR ../../../../programs/deploy/calc_life_10.obe
          $OBR ../../../../programs/deploy/closure_19.obe
          $OBR ../../../../programs/deploy/encrypt_7.obe
          $OBR ../../../../programs/deploy/fs_query_12.obe
          $OBR ../../../../programs/deploy/lambda_17.obe
          $OBR ../../../../programs/deploy/regex_4.obe
          # Threading test can be sensitive to CI runner timing; retry up to 3 times
          for attempt in 1 2 3; do
            if $OBR ../../../../programs/deploy/threads_6.obe; then
              break
            fi
            if [ $attempt -eq 3 ]; then
              echo "threads_6.obe failed after 3 attempts"
              exit 1
            fi
            echo "threads_6.obe attempt $attempt failed, retrying..."
            sleep 2
          done
        fi
        # NOTE: HTTP/2 and HTTP/3 tests are intentionally NOT here. They depend
        # on live upstream servers and run as a separate non-gating step below.

    # ============================================
    # Regression Tests
    # ============================================

    - name: Build native ONNX library (Linux x64)
      if: matrix.platform == 'linux-x64'
      working-directory: ./core/lib/onnx/eq
      shell: bash
      run: |
        # The C++ that actually talks to ONNX Runtime was built by NO job on any
        # platform -- CI only compiled onnx.obs -> onnx.obl. That blind spot is how
        # ONNX came to be completely broken on Linux and MSYS2 (the CUDA arm called
        # AppendExecutionProvider("CUDA", ...), which ORT rejects, and the catch
        # returned without setting the session handle, so it surfaced as a silently
        # null session rather than an error).
        #
        # Both arms are built deliberately: they are separate #elif branches, so a
        # build of one proves nothing about the other. A broken CUDA branch once
        # passed a clean Windows build for exactly that reason -- Windows compiles
        # only the DML arm.
        chmod +x build.sh
        for mode in cpu cuda; do
          echo "=== build.sh $mode ==="
          rm -f libobjk_onnx.so
          ./build.sh "$mode"
          if [ ! -f libobjk_onnx.so ]; then
            echo "::error::native ONNX build ($mode) produced no library"
            exit 1
          fi
          echo "  libobjk_onnx.so: $(stat -c%s libobjk_onnx.so) bytes"
        done

    - name: Run regression tests (POSIX)
      if: runner.os != 'Windows' && matrix.platform != 'windows-arm64'
      working-directory: ./programs/regression
      # Temporary: surface generic type-arg state to diagnose the intermittent
      # bad_generic_arg_mismatch miss (prints [generic-diag] lines during compile).
      env:
        OBJECK_DIAG_GENERICS: "1"
        # Turns gl_context_test.obs from "skip when no GL" into "fail when
        # no GL". These three legs do reach a 3.3 core context -- Linux via
        # Mesa offscreen/EGL, macOS via cocoa -- so losing it is a
        # regression, not an environment quirk. Windows runs the .cmd step
        # below and keeps skipping: its stock GL is 1.1, so a 3.3 core
        # request cannot succeed without Mesa being installed there.
        OBJECK_GL_REQUIRED: "1"
      run: |
        chmod +x run_regression.sh
        ARCH="${{ matrix.arch }}"
        echo "Running regression tests for architecture: $ARCH"
        ./run_regression.sh $ARCH

    - name: Run regression tests (Windows)
      if: runner.os == 'Windows' && matrix.platform != 'windows-arm64'
      working-directory: ./programs/regression
      shell: cmd
      # Temporary: surface generic type-arg state to diagnose the intermittent
      # bad_generic_arg_mismatch miss (prints [generic-diag] lines during compile).
      env:
        OBJECK_DIAG_GENERICS: "1"
      run: run_regression.cmd ${{ matrix.arch }}

    - name: Run debugger tests (POSIX)
      if: runner.os != 'Windows' && matrix.platform != 'windows-arm64'
      working-directory: ./programs/regression
      run: |
        chmod +x run_debugger_tests.sh
        ARCH="${{ matrix.arch }}"
        echo "Running debugger tests for architecture: $ARCH"
        ./run_debugger_tests.sh $ARCH

    - name: Run debugger tests (Windows)
      if: runner.os == 'Windows' && matrix.platform != 'windows-arm64'
      working-directory: ./programs/regression
      shell: cmd
      run: run_debugger_tests.cmd ${{ matrix.arch }}

    - name: Run DAP tests (POSIX)
      if: runner.os != 'Windows' && matrix.platform != 'windows-arm64'
      working-directory: ./programs/regression
      run: |
        ARCH="${{ matrix.arch }}"
        BIN="../../core/release/deploy-$ARCH/bin"
        if [ ! -d "$BIN" ]; then BIN="../../core/release/deploy/bin"; fi
        echo "Running DAP tests with bin: $BIN"
        python3 run_dap_tests.py "$BIN"

    - name: Run DAP tests (Windows)
      if: runner.os == 'Windows' && matrix.platform != 'windows-arm64'
      working-directory: ./programs/regression
      shell: cmd
      run: |
        set BIN=..\..\core\release\deploy-${{ matrix.arch }}\bin
        if not exist "%BIN%" set BIN=..\..\core\release\deploy\bin
        python run_dap_tests.py "%BIN%"

    # obu updater: offline end-to-end against fake releases (no network). Builds
    # obu with the test hooks, then exercises 'check' -- which runs everywhere,
    # Windows included -- plus the update/rollback swap and the command-injection
    # PoC wherever obu implements the in-place swap.
    #
    # Windows had NO updater coverage before this: 'check' is the only command
    # supported there, and it used to bypass the OBU_RELEASE_JSON_FILE hook
    # entirely, so there was nothing offline to test. On Windows the update
    # suite reports PENDING and asserts the not-supported contract instead, so
    # this step fails loudly if that message changes without the suite being
    # switched on.
    - name: Run updater tests
      if: matrix.platform == 'linux-x64' || matrix.platform == 'windows-x64'
      shell: bash
      run: |
        if [ "${{ runner.os }}" != "Windows" ]; then export CXX=g++; fi
        PY=python3
        command -v python3 >/dev/null 2>&1 || PY=python
        "$PY" core/utils/updater/test_update.py

    # Pure-logic unit test for the phi3 token sampler (no ONNX Runtime/model).
    - name: Run ONNX sampling unit test (POSIX)
      if: matrix.platform == 'linux-x64'
      shell: bash
      run: |
        g++ -std=c++17 -Wall -Wextra -O2 \
          core/lib/onnx/eq/test/test_phi3_sampling.cpp -o /tmp/test_phi3_sampling
        /tmp/test_phi3_sampling

    # Pure-logic unit test for the SCRFD anchor decode (no ONNX Runtime/model).
    # Face detection returned zero results for every image at every threshold
    # from v2026.5.3 through v2026.8.1 -- the stride guard compared a row count
    # against an element count -- and nothing could catch it: no ONNX demo runs
    # in CI, and the InsightFace models are excluded by .gitignore. This test
    # needs neither, and fails on that exact defect.
    - name: Run ONNX SCRFD decode unit test (POSIX)
      if: matrix.platform == 'linux-x64'
      shell: bash
      run: |
        g++ -std=c++17 -Wall -Wextra -O2 \
          core/lib/onnx/eq/test/test_scrfd_decode.cpp -o /tmp/test_scrfd_decode
        /tmp/test_scrfd_decode

    # Cache the SCRFD detector so the integration check below does not refetch
    # ~17 MB on every run. Keyed by release tag: the asset is immutable.
    - name: Cache InsightFace SCRFD model (linux-x64)
      if: matrix.platform == 'linux-x64'
      uses: actions/cache@v4
      with:
        path: /tmp/face-assets
        # Word-like on purpose: a token such as "det10g" mixes letters and
        # digits enough for gitleaks' generic-api-key rule to score it as a
        # secret and fail the Secret Scan on a plain cache key.
        key: insightface-scrfd-detector-v0.7

    # Integration check for the ONNX face pipeline (quarantined / non-gating).
    #
    # The unit test above covers the decode in isolation. It cannot see the seam
    # where the real defect lived: whether the MODEL's actual output tensors
    # still match what the decoder expects. Face detection returned zero results
    # for every image from v2026.5.3 through v2026.8.1 at exactly that seam.
    #
    # The InsightFace models (191 MB) and test photographs are excluded from the
    # repository by .gitignore, so this step fetches what it needs. It is
    # continue-on-error for the same reason the network tests are: an upstream
    # outage must not redden the whole matrix, while the step's own badge and
    # the run summary still surface a real regression.
    - name: Run ONNX face detection integration test (non-gating)
      if: matrix.platform == 'linux-x64'
      continue-on-error: true
      shell: bash
      run: |
        set -o pipefail
        ASSETS=/tmp/face-assets
        mkdir -p "$ASSETS"

        # SCRFD detector only -- the 167 MB ArcFace recognizer is not needed to
        # prove the detect path decodes real model output.
        if [ ! -f "$ASSETS/det_10g.onnx" ]; then
          echo "Fetching buffalo_l (SCRFD detector)..."
          curl -fsSL --retry 3 --retry-delay 5 -o "$ASSETS/buffalo_l.zip" \
            https://github.com/deepinsight/insightface/releases/download/v0.7/buffalo_l.zip || {
              echo "SKIP: could not download buffalo_l.zip (upstream unavailable)"; exit 0; }
          unzip -o -j "$ASSETS/buffalo_l.zip" '*det_10g.onnx' -d "$ASSETS" >/dev/null || {
              echo "SKIP: buffalo_l.zip did not contain det_10g.onnx"; exit 0; }
          rm -f "$ASSETS/buffalo_l.zip"
        fi

        # A face photograph. Public domain (US federal government work).
        if [ ! -f "$ASSETS/face.jpg" ]; then
          curl -fsSL --retry 3 --retry-delay 5 -o "$ASSETS/face.jpg" \
            https://upload.wikimedia.org/wikipedia/commons/8/8d/President_Barack_Obama.jpg || {
              echo "SKIP: could not download the test photograph"; exit 0; }
        fi

        DEPLOY="$(pwd)/core/release/${{ steps.deploy-dir.outputs.dir }}"
        export OBJECK_LIB_PATH="$DEPLOY/lib"
        export LD_LIBRARY_PATH="$DEPLOY/lib/native:${LD_LIBRARY_PATH:-}"

        cd programs/frameworks/opencv_onnx
        "$DEPLOY/bin/obc" -src test_face_detect.obs \
          -lib opencv,onnx,cipher,json -dest /tmp/test_face_detect.obe

        # Exit non-zero on a real failure so the step badge reflects reality;
        # continue-on-error keeps it from reddening the matrix.
        "$DEPLOY/bin/obr" /tmp/test_face_detect.obe "$ASSETS/det_10g.onnx" "$ASSETS/face.jpg" 1

    # ============================================
    # Network Tests (quarantined / non-gating)
    #
    # HTTP/2 (nghttp2) and HTTP/3 (ngtcp2/QUIC) tests hit LIVE upstream servers
    # and fail for reasons outside this repo: upstream 5xx/429, or UDP egress
    # blocked on the runner. continue-on-error keeps a transient outage from
    # reding the whole matrix; the step's own badge + the run summary still
    # surface real regressions so they aren't silently ignored.
    # ============================================

    - name: Run network tests (non-gating)
      if: matrix.platform == 'linux-x64' || matrix.platform == 'windows-x64'
      continue-on-error: true
      working-directory: ./core/release/${{ steps.deploy-dir.outputs.dir }}/bin
      shell: bash
      run: |
        if [ "${{ runner.os }}" = "Windows" ]; then
          OBR="./obr.exe"
          # These .obe are pre-built only on linux-x64 (see "Compile tests").
          # Build them here rather than in the gating step so a missing library
          # cannot redden the build -- this step is continue-on-error.
          ./obc.exe -lib cipher,net,gen_collect,net_h2 -src ../../../../programs/tests/prgm_http2.obs || true
          ./obc.exe -lib cipher,net,gen_collect,net_quic -src ../../../../programs/tests/prgm_http3.obs || true
          ./obc.exe -lib cipher,net,gen_collect,net_quic -src ../../../../programs/tests/http3_downgrade_test.obs || true
          ./obc.exe -lib cipher,net,gen_collect,net_h2 -src ../../../../programs/tests/http_header_echo_test.obs || true
        else
          OBR="./obr"
        fi
        status=0

        {
          echo "### Network tests (non-gating) — ${{ matrix.platform }}"
          echo ""
          echo "| Result | Test | Note |"
          echo "| :----: | :--- | :--- |"
        } >> "$GITHUB_STEP_SUMMARY"

        run_net() {
          local name="$1" obe="$2" out
          echo "=== $name ==="
          if [ ! -f "$obe" ]; then
            echo "| ⏭️ | $name | not built on this platform |" >> "$GITHUB_STEP_SUMMARY"
            return
          fi
          if ! out=$("$OBR" "$obe" 2>&1); then
            echo "$out"
            echo "| ⚠️ | $name | VM exited non-zero (upstream/network?) |" >> "$GITHUB_STEP_SUMMARY"
            status=1
            return
          fi
          echo "$out"
          if echo "$out" | grep -q "FAIL"; then
            echo "| ❌ | $name | reported FAIL |" >> "$GITHUB_STEP_SUMMARY"
            status=1
          elif echo "$out" | grep -q "SKIP"; then
            # Not a pass. The test ran but never exercised the protocol -- no
            # engine compiled in, or no route to the host. Surfaced so absent
            # coverage cannot masquerade as green.
            echo "| ⏭️ | $name | SKIPPED - protocol not exercised |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| ✅ | $name | passed |" >> "$GITHUB_STEP_SUMMARY"
          fi
        }

        run_net "HTTP/2" ../../../../programs/tests/prgm_http2.obe
        run_net "HTTP/3" ../../../../programs/tests/prgm_http3.obe
        run_net "HTTP/3 downgrade" ../../../../programs/tests/http3_downgrade_test.obe
        run_net "Header echo" ../../../../programs/tests/http_header_echo_test.obe
        echo "" >> "$GITHUB_STEP_SUMMARY"

        if [ $status -ne 0 ]; then
          echo "::warning::Network tests reported failures (non-gating); see run summary"
        fi
        # Exit non-zero so the step badge reflects reality; continue-on-error
        # above keeps the overall job green.
        exit $status

    # A crash in a regression test reaches the log as one line -- "runtime error
    # (exit 134)" -- with no frames. macOS writes a full backtrace for every
    # SIGABRT/SIGSEGV to DiagnosticReports, so collecting those turns a
    # macOS-only crash from a guess-and-push-to-CI loop into a single read.
    # onnx_runtime_test's teardown abort was diagnosed without one; the next
    # one should not have to be.
    - name: Collect macOS crash reports (on failure)
      if: failure() && matrix.platform == 'macos-arm64'
      continue-on-error: true
      run: |
        dest=programs/regression/results/crash-reports
        mkdir -p "$dest"
        for d in "$HOME/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports; do
          [ -d "$d" ] || continue
          find "$d" -maxdepth 1 -type f -name '*.ips' -exec cp {} "$dest/" \; 2>/dev/null || true
          find "$d" -maxdepth 1 -type f -name '*.crash' -exec cp {} "$dest/" \; 2>/dev/null || true
        done
        count=$(ls -1 "$dest" 2>/dev/null | wc -l | tr -d ' ')
        echo "collected $count crash report(s)"
        if [ "$count" = "0" ]; then
          echo "::warning::No crash reports found; the failure may not have been a crash"
        fi

    - name: Upload regression logs (on failure)
      if: failure() && matrix.platform != 'windows-arm64'
      uses: actions/upload-artifact@v6
      with:
        name: regression-logs-${{ matrix.platform }}
        path: programs/regression/results/**
        retention-days: 7
        if-no-files-found: ignore

    # ============================================
    # API Documentation (Linux x64 only)
    # ============================================

    - name: Generate API documentation
      if: matrix.platform == 'linux-x64'
      working-directory: ./core/release/${{ steps.deploy-dir.outputs.dir }}/bin
      run: |
        mkdir -p ../../../../docs/api
        ./obc -src ../../../lib/code_doc/doc_html.obs,../../../lib/code_doc/doc_parser.obs \
          -lib cipher,json,xml,misc,net -dest code_doc.obe

        ./obr code_doc.obe \
          ../../../lib/code_doc/templates \
          ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0' }} \
          ../../../compiler/lib_src/lang.obs \
          ../../../compiler/lib_src/regex.obs \
          ../../../compiler/lib_src/json_stream.obs \
          ../../../compiler/lib_src/json.obs \
          ../../../compiler/lib_src/xml.obs \
          ../../../compiler/lib_src/cipher.obs \
          ../../../compiler/lib_src/odbc.obs \
          ../../../compiler/lib_src/csv.obs \
          ../../../compiler/lib_src/query.obs \
          ../../../compiler/lib_src/sdl2.obs \
          ../../../compiler/lib_src/sdl_game.obs \
          ../../../compiler/lib_src/sdl_gl.obs \
          ../../../compiler/lib_src/gen_collect.obs \
          ../../../compiler/lib_src/concurrent.obs \
          ../../../compiler/lib_src/net_common.obs \
          ../../../compiler/lib_src/net.obs \
          ../../../compiler/lib_src/net_secure.obs \
          ../../../compiler/lib_src/net_h2.obs \
          ../../../compiler/lib_src/net_quic.obs \
          ../../../compiler/lib_src/net_server.obs \
          ../../../compiler/lib_src/rss.obs \
          ../../../compiler/lib_src/misc.obs \
          ../../../compiler/lib_src/diags.obs \
          ../../../compiler/lib_src/ml_core.obs \
          ../../../compiler/lib_src/ml_linear.obs \
          ../../../compiler/lib_src/ml_tree.obs \
          ../../../compiler/lib_src/ml_bayes.obs \
          ../../../compiler/lib_src/ml_neighbors.obs \
          ../../../compiler/lib_src/ml_cluster.obs \
          ../../../compiler/lib_src/ml_data.obs \
          ../../../compiler/lib_src/ai_search.obs \
          ../../../compiler/lib_src/ai_game.obs \
          ../../../compiler/lib_src/ai_optimize.obs \
          ../../../compiler/lib_src/ai_rl.obs \
          ../../../compiler/lib_src/openai.obs \
          ../../../compiler/lib_src/gemini.obs \
          ../../../compiler/lib_src/ollama.obs \
          ../../../compiler/lib_src/json_rpc.obs \
          ../../../compiler/lib_src/opencv.obs \
          ../../../compiler/lib_src/onnx.obs \
          ../../../compiler/lib_src/nlp.obs \
          ../../../compiler/lib_src/lame.obs \
          ../../../compiler/lib_src/web_server.obs

    - name: Package API documentation
      if: matrix.platform == 'linux-x64'
      working-directory: ./docs
      run: |
        zip -r api.zip api/

    - name: Upload API documentation
      if: matrix.platform == 'linux-x64'
      uses: actions/upload-artifact@v6
      with:
        name: api-docs
        path: docs/api.zip
        retention-days: 7

    - name: Clean up signing keychain
      if: always() && runner.os == 'macOS'
      run: |
        if [ -f "$RUNNER_TEMP/app-signing.keychain-db" ]; then
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
        fi

    # ============================================
    # Upload Build Artifacts
    # ============================================

    - name: Upload build artifacts
      uses: actions/upload-artifact@v6
      with:
        name: objeck-${{ matrix.platform }}
        path: |
          core/release/${{ steps.deploy-dir.outputs.dir }}/bin/*
          core/release/${{ steps.deploy-dir.outputs.dir }}/lib/*
        retention-days: 7

  # ============================================
  # Editor tooling: formatter, LSP server, VS Code extension
  # ============================================

  # No `needs:` — this runs alongside the platform matrix and finishes long
  # before it, so tooling breakage surfaces early. It builds only core/vm and
  # core/compiler (the perf-gate.yml dependency set: no OpenCV/SDL/ODBC) and
  # pairs them with the .obl libraries committed under core/lib.
  tools:
    name: Tools (formatter, LSP, VS Code extension)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # First, because it needs nothing built and fails in seconds. Five files
      # hard-code the list of core/compiler/lib_src/*.obs and nothing keeps them
      # in step; they had already drifted unnoticed -- one list was missing two
      # libraries and still named a third that had been deleted, so the counts
      # matched while the API docs and the editor index were both incomplete.
      - name: Library lists agree with lib_src
        run: python3 tools/cicd/check_doc_lists.py

      # Same class of guard, same cost: nothing built, fails in seconds. The
      # regression runners score a test on its exit code alone, so one that
      # prints "FAIL: ..." and then returns normally from Main is counted as a
      # PASS. 125 of the 168 asserting tests were in exactly that state, and two
      # were failing while it went unnoticed -- a run reporting "195 passed,
      # 3 skipped, 2 failed" was really 193/3/4, and the four real failures were
      # all one open defect that had looked confined to a single test.
      - name: Regression tests can report failure
        run: python3 tools/cicd/check_test_exit_codes.py

      # Same reason, same cost: nothing built, fails in seconds. A native call
      # whose name is written as a literal at the call site allocates a String
      # on every call -- 1655ns against 130ns for the same call with the name
      # held in a field. Holding them is a whole-tree edit that one regenerated
      # library silently undoes: core/lib/sdl/code_gen emits sdl2.obs, and its
      # emitter writes the literal form.
      - name: Native call names are held, not re-allocated
        run: python3 tools/cicd/hoist_native_names.py --check core/compiler/lib_src/*.obs

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libmbedtls-dev libnghttp2-dev libngtcp2-dev \
            libngtcp2-crypto-gnutls-dev libnghttp3-dev libgnutls28-dev \
            zlib1g-dev libreadline-dev ccache

      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-tools-ccache-${{ github.sha }}
          restore-keys: ${{ runner.os }}-tools-ccache-

      - name: Setup ccache
        run: ccache --max-size=500M && ccache --set-config=compression=true

      - name: Build Objeck (obc + obr)
        working-directory: core/vm
        env: { CC: ccache gcc, CXX: ccache g++ }
        run: |
          cp make/Makefile.amd64 Makefile
          make -j$(nproc)
          cd ../compiler
          cp make/Makefile.amd64 Makefile
          make -j$(nproc) OBJECK_LIB_PATH=///".///"

      - name: Assemble deploy tree
        run: |
          # The tooling scripts probe core/release/deploy-x64 then deploy,
          # so materialize that layout rather than teaching each script a
          # bin-dir argument.
          DEPLOY=core/release/deploy-x64
          mkdir -p "$DEPLOY/bin" "$DEPLOY/lib"
          cp core/compiler/obc core/vm/obr "$DEPLOY/bin"/
          chmod +x "$DEPLOY/bin/obc" "$DEPLOY/bin/obr"
          cp core/lib/*.obl "$DEPLOY/lib"/
          cp core/lib/*.ini "$DEPLOY/lib"/ 2>/dev/null || true
          "$DEPLOY/bin/obc" -version | head -1 || true

      - name: Build native diagnostics library
        run: |
          # The language server reaches its analyzer through
          # DllProxy->New("libobjk_diags"). Without the native library the
          # server still answers initialize and advertises capabilities, but
          # every analysis-backed handler returns null and no diagnostics are
          # ever published -- which is exactly how this job first failed.
          cd core/lib/diags
          bash build_linux.sh diags
          mkdir -p ../../release/deploy-x64/lib/native
          cp diags.so ../../release/deploy-x64/lib/native/libobjk_diags.so

      - name: Formatter regression
        run: bash tools/lsp/server/format_code/run_regression.sh

      - name: Build LSP server
        run: bash tools/lsp/server/build_server.sh

      - name: LSP regression
        run: python3 tools/lsp/tests/run_lsp_tests.py core/release/deploy-x64/bin

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: VS Code extension — install, compile, lint
        working-directory: tools/lsp/clients/vscode
        run: |
          npm ci
          npm run compile
          npm run lint

  # ============================================
  # Build Status Summary
  # ============================================

  status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [build, tools]
    if: always()
    steps:
      - name: Report build status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ needs.build.result }}" = "success" ] \
             && [ "${{ needs.tools.result }}" = "success" ]; then
            echo "✅ All platform builds and tooling checks succeeded"
            echo "### ✅ CI — all platform builds and tooling checks succeeded" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "❌ Build result: ${{ needs.build.result }}, tools result: ${{ needs.tools.result }}"
          {
            echo "### ❌ CI — build ${{ needs.build.result }}, tools ${{ needs.tools.result }}"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # fail-fast is off, so the rolled-up result hides which platforms
          # broke. Ask the API for the specific failed matrix legs by name.
          failed=$(gh run view "${{ github.run_id }}" --repo "${{ github.repository }}" \
            --json jobs -q '.jobs[] | select(.conclusion=="failure") | .name' 2>/dev/null || true)
          if [ -n "$failed" ]; then
            echo "Failed jobs:"
            echo "$failed" | sed 's/^/  ❌ /'
            {
              echo "| Failed job |"
              echo "| :--------- |"
              echo "$failed" | sed 's/.*/| & |/'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 1
