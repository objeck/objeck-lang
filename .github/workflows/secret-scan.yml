name: Secret Scan

# Scan the repository for committed secrets (API keys, tokens, credentials).
# Runs on every push and pull request, and on a weekly schedule to catch
# anything that slipped through.

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so historical leaks are detected

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The job above scans full history with .gitleaks.toml, which path-allowlists
  # core/release/cov_scan.{in,sh} to avoid re-reporting the Coverity token that
  # sat in that file from 2019-08-11 until 2026-08. Necessary for a history scan,
  # but it leaves that path unwatched at HEAD -- a newly pasted token there would
  # be missed (verified locally: silently missed under .gitleaks.toml, caught
  # under .gitleaks-head.toml). This job closes that gap by scanning the working
  # tree only, with no cov_scan exemption. History is never scanned here, so the
  # known historical findings cannot make it fail.
  #
  # Scoped to core/release because that is where credential-handling scripts
  # live. A whole-tree scan reports 110 pre-existing findings from test fixtures
  # (LinkedIn .mhtml captures, example HTML), which would make this permanently
  # red and therefore ignored.
  release-scripts-head:
    name: gitleaks (HEAD, release scripts)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # No fetch-depth: working tree only, history is the other job's business.

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.28.0
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks version

      - name: Scan release scripts at HEAD
        run: |
          /tmp/gitleaks dir core/release \
            --config .gitleaks-head.toml \
            --no-banner \
            --redact \
            --exit-code 1
