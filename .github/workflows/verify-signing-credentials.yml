name: Verify Signing Credentials

# Checks that CODESIGN_CERT_BASE64 and CODESIGN_PASSWORD actually agree, without
# building anything. A full release build takes over an hour and only reaches
# signing at step 21, which is an absurd way to test a password.
#
# This exists because the two secrets silently disagreed for four months: the
# password was rotated on 2026-04-05 and the certificate was never re-uploaded,
# so every Windows installer from v2026.4.0 through v2026.8.2 shipped unsigned
# while signtool ran and failed on every artifact.
#
# Prints certificate metadata and expiry. Never prints the password, and never
# writes the .pfx anywhere but the runner's temp directory.

on:
  workflow_dispatch:

jobs:
  verify:
    name: Verify signing credentials
    runs-on: windows-latest
    steps:
      - name: Check certificate and password agree
        shell: pwsh
        env:
          CODESIGN_CERT_BASE64: ${{ secrets.CODESIGN_CERT_BASE64 }}
          CODESIGN_PASSWORD: ${{ secrets.CODESIGN_PASSWORD }}
        run: |
          if (-not $env:CODESIGN_CERT_BASE64) {
            Write-Output "::error::CODESIGN_CERT_BASE64 is not set"
            exit 1
          }
          if (-not $env:CODESIGN_PASSWORD) {
            Write-Output "::error::CODESIGN_PASSWORD is not set"
            exit 1
          }

          $certPath = Join-Path $env:RUNNER_TEMP "verify.pfx"
          try {
            [System.IO.File]::WriteAllBytes($certPath, [System.Convert]::FromBase64String($env:CODESIGN_CERT_BASE64))
          }
          catch {
            Write-Output "::error::CODESIGN_CERT_BASE64 is not valid base64 - the secret itself is corrupt"
            exit 1
          }
          Write-Output "Certificate decoded: $((Get-Item $certPath).Length) bytes"

          # The decisive check. A wrong password throws here, which is exactly what
          # signtool reports as "The specified PFX password is not correct."
          try {
            $secure = ConvertTo-SecureString $env:CODESIGN_PASSWORD -AsPlainText -Force
            $cert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($certPath, $secure)
          }
          catch {
            Remove-Item $certPath -Force -ErrorAction SilentlyContinue
            Write-Output "::error::CODESIGN_PASSWORD does not match CODESIGN_CERT_BASE64 - signing will fail"
            Write-Output "  $($_.Exception.Message)"
            exit 1
          }

          Write-Output "PASSWORD OK - the certificate and password agree"
          Write-Output "  Subject:  $($cert.Subject)"
          Write-Output "  Issuer:   $($cert.Issuer)"
          Write-Output "  NotAfter: $($cert.NotAfter)"
          Write-Output "  HasPrivateKey: $($cert.HasPrivateKey)"

          # A valid password on an expired certificate still fails to produce a
          # trusted signature, so report that separately rather than as success.
          $daysLeft = ($cert.NotAfter - (Get-Date)).Days
          if ($cert.NotAfter -lt (Get-Date)) {
            Remove-Item $certPath -Force -ErrorAction SilentlyContinue
            Write-Output "::error::Certificate EXPIRED on $($cert.NotAfter)"
            exit 1
          }
          if ($daysLeft -lt 30) {
            Write-Output "::warning::Certificate expires in $daysLeft days ($($cert.NotAfter))"
          }
          if (-not $cert.HasPrivateKey) {
            Remove-Item $certPath -Force -ErrorAction SilentlyContinue
            Write-Output "::error::Certificate has no private key - it cannot sign"
            exit 1
          }

          Remove-Item $certPath -Force
          Write-Output "Signing credentials are usable ($daysLeft days until expiry)"
