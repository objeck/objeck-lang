name: Verify Signing Credentials

# Checks that the signing secrets the release pipeline ACTUALLY USES agree with
# their passwords and carry private keys, without building anything. A full
# release build takes over an hour and only reaches signing near the end, which
# is an absurd way to test a password.
#
# What the pipeline uses (release-build.yml, "Install Apple signing
# certificate"): APPLE_INSTALLER_CERT_BASE64 / APPLE_INSTALLER_CERT_PASSWORD
# (Developer ID Installer, signs the .pkg), APPLE_CERTIFICATE_BASE64 /
# APPLE_CERTIFICATE_PASSWORD (Developer ID Application, signs the binaries in
# the .pkg AND the .tgz), and KEYCHAIN_PASSWORD. This job imports them into a
# throwaway keychain with the same commands the release runs, so a failure
# here is the failure the release would have had.
#
# Windows is NOT checked here and cannot be: the Windows installers are signed
# locally with a SafeNet eToken (tools/cicd/sign_release.cmd). The older
# CODESIGN_CERT_BASE64 / CODESIGN_PASSWORD secrets this workflow used to check
# are referenced by no workflow any more, and when last examined (2026-09-08)
# the stored certificate was the Sectigo intermediate CA with no private key --
# it could never have signed anything. They can be deleted.
#
# This exists because two secrets silently disagreed for four months once: a
# password was rotated on 2026-04-05 and the certificate was never re-uploaded,
# so every Windows installer from v2026.4.0 through v2026.8.2 shipped unsigned
# while signtool ran and failed on every artifact. Prints certificate subjects
# and expiry. Never prints a password, never writes a certificate anywhere but
# the runner's temp directory, and deletes the keychain it made.

on:
  workflow_dispatch:
  # Weekly, so a rotated password or an expiring certificate shows up as a red
  # scheduled run instead of as an unsigned release.
  schedule:
    - cron: '0 6 * * 1'

jobs:
  verify:
    name: Verify Apple signing credentials
    runs-on: macos-latest
    steps:
      - name: Import the certificates the release imports
        env:
          APPLE_INSTALLER_CERT_BASE64: ${{ secrets.APPLE_INSTALLER_CERT_BASE64 }}
          APPLE_INSTALLER_CERT_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERT_PASSWORD }}
          APPLE_APP_CERT_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_APP_CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -u
          failed=0
          for name in APPLE_INSTALLER_CERT_BASE64 APPLE_INSTALLER_CERT_PASSWORD APPLE_APP_CERT_BASE64 APPLE_APP_CERT_PASSWORD KEYCHAIN_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set"
              failed=1
            fi
          done
          [ "$failed" -eq 0 ] || exit 1

          KEYCHAIN_PATH="$RUNNER_TEMP/verify-signing.keychain-db"
          rm -f "$RUNNER_TEMP"/*.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # decode + import, exactly as release-build.yml does. A wrong password
          # is what `security import` rejects here and what the release would
          # have rejected at its signing step.
          import_cert() {
            label="$1"; b64="$2"; password="$3"
            path="$RUNNER_TEMP/$label.p12"
            if ! echo -n "$b64" | base64 --decode -o "$path" 2>/dev/null; then
              echo "::error::$label: the base64 secret itself is corrupt"
              return 1
            fi
            echo "$label: decoded $(stat -f%z "$path") bytes"
            if ! security import "$path" -P "$password" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH" >/dev/null 2>&1; then
              rm -f "$path"
              echo "::error::$label: the password does not open the certificate (or it is not a PKCS#12) - signing will fail"
              return 1
            fi
            rm -f "$path"
            echo "$label: password OK"
          }
          import_cert "installer" "$APPLE_INSTALLER_CERT_BASE64" "$APPLE_INSTALLER_CERT_PASSWORD" || failed=1
          import_cert "application" "$APPLE_APP_CERT_BASE64" "$APPLE_APP_CERT_PASSWORD" || failed=1
          if [ "$failed" -ne 0 ]; then
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
            exit 1
          fi

      - name: Identities carry private keys and are not expiring
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -u
          KEYCHAIN_PATH="$RUNNER_TEMP/verify-signing.keychain-db"
          trap 'security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true; rm -f cert*.pem' EXIT
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # An "identity" is a certificate WITH its private key; a bare
          # certificate (the retired Windows secret's failure mode) is not
          # listed here.
          security find-identity -v "$KEYCHAIN_PATH" | sed 's/^/  /'
          if ! security find-identity -v "$KEYCHAIN_PATH" | grep -q "Developer ID Installer"; then
            echo "::error::no 'Developer ID Installer' identity with a private key - the .pkg cannot be signed"
            exit 1
          fi
          if ! security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q "Developer ID Application"; then
            echo "::error::no 'Developer ID Application' identity with a private key - binaries cannot be signed"
            exit 1
          fi

          # expiry, per certificate
          failed=0
          security find-certificate -a -p "$KEYCHAIN_PATH" | awk '/BEGIN CERTIFICATE/{n++} {print > ("cert" n ".pem")}'
          now=$(date +%s)
          for pem in cert*.pem; do
            subject=$(openssl x509 -in "$pem" -noout -subject | sed 's/^subject= *//')
            notafter=$(openssl x509 -in "$pem" -noout -enddate | sed 's/^notAfter=//')
            end_epoch=$(date -j -f "%b %e %H:%M:%S %Y %Z" "$notafter" +%s 2>/dev/null || echo 0)
            days=$(( (end_epoch - now) / 86400 ))
            echo "  $subject"
            echo "      NotAfter: $notafter ($days days)"
            if [ "$end_epoch" -gt 0 ] && [ "$end_epoch" -lt "$now" ]; then
              echo "::error::EXPIRED: $subject"
              failed=1
            elif [ "$end_epoch" -gt 0 ] && [ "$days" -lt 30 ]; then
              echo "::warning::expires in $days days: $subject"
            fi
          done
          exit $failed
